<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Marsko lab tool — reaction.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/marsko-hud.css">
<meta name="theme-color" content="#030407">
  <title>Reaction-Diffusion Lab // marsko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020306;
      color: #cbd5e1;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    #simCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      image-rendering: auto;
    }

    /* 상단 헤더 HUD */
    header {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
    }
    .home-link {
      color: #64748b;
      font-size: 0.75rem;
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      pointer-events: auto;
      width: fit-content;
      padding: 2px 6px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
    }
    .home-link:hover { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
    h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f8fafc;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    .hud-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #94a3b8;
    }

    /* 우측 텔레메트리 */
    .telemetry-card {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(10, 15, 26, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #94a3b8;
      backdrop-filter: blur(6px);
      pointer-events: none;
      line-height: 1.6;
      text-align: right;
      z-index: 10;
    }
    .telemetry-card strong { color: #38bdf8; }

    /* 하단 플로팅 컨트롤 독 */
    .control-dock {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 15, 26, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      z-index: 10;
      max-width: 95%;
      overflow-x: auto;
    }
    .dock-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .dock-btn:hover { background: #334155; color: #38bdf8; }
    .dock-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }

    .dock-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: #94a3b8;
      white-space: nowrap;
    }
    .slider-group input[type="range"] {
      width: 55px;
      height: 4px;
      accent-color: #38bdf8;
      background: #334155;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="home-link">← marsko</a>
  <h1>REACTION-DIFFUSION LAB</h1>
  <div class="hud-meta">GRAY-SCOTT MODEL · TURING MORPHOGENESIS</div>
</header>

<div class="telemetry-card">
  <div>PATTERN: <strong id="valPreset">MITOSIS</strong></div>
  <div>FEED (F): <strong id="valF">0.0367</strong></div>
  <div>KILL (k): <strong id="valK">0.0649</strong></div>
  <div>FPS: <strong id="valFps">60</strong></div>
</div>

<canvas id="simCanvas"></canvas>

<div class="control-dock">
  <button type="button" class="dock-btn active" id="btnMitosis">세포 분열</button>
  <button type="button" class="dock-btn" id="btnCoral">산호초</button>
  <button type="button" class="dock-btn" id="btnMaze">지문 미궁</button>
  <button type="button" class="dock-btn" id="btnSpirals">나선 파동</button>
  <button type="button" class="dock-btn" id="btnChaos">카오스</button>

  <div class="dock-sep"></div>

  <button type="button" class="dock-btn" id="btnSeed">씨앗 재주입</button>
  <button type="button" class="dock-btn" id="btnClear">초기화</button>
  <button type="button" class="dock-btn" id="btnPause">❚❚ 일시정지</button>

  <div class="dock-sep"></div>

  <div class="slider-group">
    <span>브러시 반경</span>
    <input type="range" id="brushRange" min="2" max="16" value="7">
  </div>
</div>

<script>
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');

  const valPreset = document.getElementById('valPreset');
  const valF = document.getElementById('valF');
  const valK = document.getElementById('valK');
  const valFps = document.getElementById('valFps');

  const btnMitosis = document.getElementById('btnMitosis');
  const btnCoral = document.getElementById('btnCoral');
  const btnMaze = document.getElementById('btnMaze');
  const btnSpirals = document.getElementById('btnSpirals');
  const btnChaos = document.getElementById('btnChaos');
  const btnSeed = document.getElementById('btnSeed');
  const btnClear = document.getElementById('btnClear');
  const btnPause = document.getElementById('btnPause');
  const brushRange = document.getElementById('brushRange');

  // 내부 수치 연산 그리드 해상도 (초당 12스텝 고속 처리용 최적 크기)
  const GW = 280;
  const GH = 180;
  const TOTAL_CELLS = GW * GH;

  // 화학물질 U, V 농도 버퍼
  let u = new Float32Array(TOTAL_CELLS);
  let v = new Float32Array(TOTAL_CELLS);
  let nextU = new Float32Array(TOTAL_CELLS);
  let nextV = new Float32Array(TOTAL_CELLS);

  // 오프스크린 렌더 캔버스
  const offscreen = document.createElement('canvas');
  offscreen.width = GW;
  offscreen.height = GH;
  const offCtx = offscreen.getContext('2d');
  let imgData = offCtx.createImageData(GW, GH);

  // 물리 확산 계수 및 반응 속도
  const Du = 0.2097;
  const Dv = 0.105;
  const dt = 1.0;

  // 대표적 피어슨(Pearson) 튜링 패턴 파라미터 프리셋
  const PRESETS = {
    mitosis: { name: 'MITOSIS (SPOTS)', F: 0.0367, k: 0.0649 },
    coral:   { name: 'CORAL REEF',     F: 0.0545, k: 0.0620 },
    maze:    { name: 'LABYRINTH',      F: 0.0290, k: 0.0570 },
    spirals: { name: 'SPIRAL WAVES',   F: 0.0180, k: 0.0510 },
    chaos:   { name: 'CHAOS DIVIDE',   F: 0.0260, k: 0.0550 }
  };

  let currentPreset = 'mitosis';
  let F = PRESETS.mitosis.F;
  let k = PRESETS.mitosis.k;
  let isRunning = true;
  let brushRadius = parseInt(brushRange.value, 10);

  let width = window.innerWidth;
  let height = window.innerHeight;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // 시스템 초기화
  function initSimulation(presetKey = currentPreset) {
    currentPreset = presetKey;
    const p = PRESETS[presetKey];
    F = p.F;
    k = p.k;

    valPreset.textContent = p.name;
    valF.textContent = F.toFixed(4);
    valK.textContent = k.toFixed(4);

    [btnMitosis, btnCoral, btnMaze, btnSpirals, btnChaos].forEach(b => b.classList.remove('active'));
    if (presetKey === 'mitosis') btnMitosis.classList.add('active');
    if (presetKey === 'coral') btnCoral.classList.add('active');
    if (presetKey === 'maze') btnMaze.classList.add('active');
    if (presetKey === 'spirals') btnSpirals.classList.add('active');
    if (presetKey === 'chaos') btnChaos.classList.add('active');

    // U = 1.0, V = 0.0 기저 상태
    u.fill(1.0);
    v.fill(0.0);
    nextU.fill(1.0);
    nextV.fill(0.0);

    // 씨앗(Seed) 투하
    seedSpots();
  }

  // 화면 여러 곳에 활성 씨앗 투하
  function seedSpots() {
    const cx = Math.floor(GW / 2);
    const cy = Math.floor(GH / 2);

    // 중앙 메인 클러스터
    addDrop(cx, cy, 14);

    // 주변 보조 씨앗들
    const offsets = [
      [-45, -25], [45, -25],
      [-50, 30],  [50, 30],
      [0, -45],   [0, 45]
    ];
    offsets.forEach(([ox, oy]) => {
      addDrop(cx + ox, cy + oy, 8);
    });
  }

  // 특정 위치에 화학물질 V 투입
  function addDrop(gx, gy, radius = brushRadius) {
    const r2 = radius * radius;
    for (let dy = -radius; dy <= radius; dy++) {
      const y = gy + dy;
      if (y < 1 || y >= GH - 1) continue;
      for (let dx = -radius; dx <= radius; dx++) {
        const x = gx + dx;
        if (x < 1 || x >= GW - 1) continue;

        if (dx * dx + dy * dy <= r2) {
          const idx = y * GW + x;
          // 활성 물질 V 투입 및 기저 물질 U 치환
          v[idx] = 0.75 + Math.random() * 0.15;
          u[idx] = 0.25;
        }
      }
    }
  }

  // --- 그레이-스콧 수치 해석 엔진 (등방성 9점 스텐실) ---
  function stepPhysics() {
    // 9점 라플라시안 가중치:
    // 중심: -1.0, 상하좌우: +0.2, 대각선: +0.05
    for (let y = 1; y < GH - 1; y++) {
      let idx = y * GW + 1;
      for (let x = 1; x < GW - 1; x++, idx++) {
        const uVal = u[idx];
        const vVal = v[idx];

        // 9-point Laplacian
        const lapU = 
          0.20 * (u[idx - 1] + u[idx + 1] + u[idx - GW] + u[idx + GW]) +
          0.05 * (u[idx - GW - 1] + u[idx - GW + 1] + u[idx + GW - 1] + u[idx + GW + 1]) -
          uVal;

        const lapV = 
          0.20 * (v[idx - 1] + v[idx + 1] + v[idx - GW] + v[idx + GW]) +
          0.05 * (v[idx - GW - 1] + v[idx - GW + 1] + v[idx + GW - 1] + v[idx + GW + 1]) -
          vVal;

        // 반응 항: uv^2
        const uvv = uVal * vVal * vVal;

        // ∂u/∂t = Du ∇²u - uv² + F(1 - u)
        // ∂v/∂t = Dv ∇²v + uv² - (F + k)v
        const nU = uVal + (Du * lapU - uvv + F * (1.0 - uVal)) * dt;
        const nV = vVal + (Dv * lapV + uvv - (F + k) * vVal) * dt;

        // 수치 클램핑
        nextU[idx] = nU < 0 ? 0 : (nU > 1 ? 1 : nU);
        nextV[idx] = nV < 0 ? 0 : (nV > 1 ? 1 : nV);
      }
    }

    // 버퍼 스왑
    const tempU = u; u = nextU; nextU = tempU;
    const tempV = v; v = nextV; nextV = tempV;
  }

  // --- 화면 렌더링 루프 (마젠타-시안 네온 팔레트) ---
  function render() {
    const data = imgData.data;
    let ptr = 0;

    for (let i = 0; i < TOTAL_CELLS; i++) {
      const vVal = v[i];

      if (vVal < 0.05) {
        // 배경: 심연의 다크 네이비 (#020306 ~ #08101e)
        data[ptr++] = 3;
        data[ptr++] = 6;
        data[ptr++] = 12;
        data[ptr++] = 255;
      } else {
        // 활성 물질 V를 부드럽게 강조하는 비선형 보간 (0.05 ~ 0.45)
        const t = Math.min(1.0, (vVal - 0.05) / 0.38);

        // 경계선: 매혹적인 마젠타/바이올렛 (#a855f7)
        // 코어: 눈부신 네온 시안/아쿠아 (#38bdf8) -> 화이트 코어
        if (t < 0.5) {
          const ratio = t * 2.0;
          data[ptr++] = Math.floor(168 * ratio + 10 * (1 - ratio));
          data[ptr++] = Math.floor(85 * ratio + 25 * (1 - ratio));
          data[ptr++] = Math.floor(247 * ratio + 40 * (1 - ratio));
        } else {
          const ratio = (t - 0.5) * 2.0;
          data[ptr++] = Math.floor(56 + 180 * ratio);
          data[ptr++] = Math.floor(189 + 60 * ratio);
          data[ptr++] = Math.floor(248 + 7 * ratio);
        }
        data[ptr++] = 255;
      }
    }

    offCtx.putImageData(imgData, 0, 0);

    // 부드러운 스케일링으로 전체 화면에 복사
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(offscreen, 0, 0, width, height);
  }

  let frameCount = 0;
  let lastTime = performance.now();

  function loop() {
    if (isRunning) {
      // 1프레임당 12회 고속 서브스텝 계산!
      for (let s = 0; s < 12; s++) {
        stepPhysics();
      }
    }

    render();

    frameCount++;
    const now = performance.now();
    if (now - lastTime >= 500) {
      valFps.textContent = Math.round((frameCount * 1000) / (now - lastTime));
      frameCount = 0;
      lastTime = now;
    }

    requestAnimationFrame(loop);
  }

  // --- 마우스 / 터치 인터랙션 (씨앗 그리기) ---
  let isPointerDown = false;

  function handlePointer(clientX, clientY) {
    const gx = Math.floor((clientX / width) * GW);
    const gy = Math.floor((clientY / height) * GH);
    addDrop(gx, gy, brushRadius);
  }

  canvas.addEventListener('mousedown', (e) => {
    isPointerDown = true;
    handlePointer(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    if (isPointerDown) handlePointer(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', () => { isPointerDown = false; });

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isPointerDown = true;
      handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (isPointerDown && e.touches.length === 1) {
      handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });
  canvas.addEventListener('touchend', () => { isPointerDown = false; });

  // 프리셋 버튼 바인딩
  btnMitosis.addEventListener('click', () => initSimulation('mitosis'));
  btnCoral.addEventListener('click', () => initSimulation('coral'));
  btnMaze.addEventListener('click', () => initSimulation('maze'));
  btnSpirals.addEventListener('click', () => initSimulation('spirals'));
  btnChaos.addEventListener('click', () => initSimulation('chaos'));

  btnSeed.addEventListener('click', seedSpots);
  btnClear.addEventListener('click', () => {
    u.fill(1.0);
    v.fill(0.0);
    nextU.fill(1.0);
    nextV.fill(0.0);
  });

  btnPause.addEventListener('click', () => {
    isRunning = !isRunning;
    btnPause.textContent = isRunning ? '❚❚ 일시정지' : '▶ 재생';
    btnPause.classList.toggle('active', isRunning);
  });

  brushRange.addEventListener('input', (e) => {
    brushRadius = parseInt(e.target.value, 10);
  });

  // 시작
  initSimulation('mitosis');
  requestAnimationFrame(loop);
</script>

</body>
</html>
