<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030604">
  <title>Missile Command Vector // marsko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020503;
      color: #86efac;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* CRT 브라운관 스캔라인 & 섀도우마스크 오버레이 */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
        linear-gradient(90deg, rgba(0, 255, 128, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 128, 255, 0.02));
      background-size: 100% 3px, 6px 100%;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9), inset 0 0 35px rgba(34, 197, 94, 0.12);
      z-index: 5;
    }

    /* 상단 헤더 HUD */
    header {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
    }
    .home-link {
      color: #3b7747;
      font-size: 0.75rem;
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      pointer-events: auto;
      width: fit-content;
      padding: 2px 6px;
      background: rgba(4, 20, 8, 0.6);
      border-radius: 4px;
      border: 1px solid rgba(74, 222, 128, 0.15);
      backdrop-filter: blur(4px);
    }
    .home-link:hover { color: #4ade80; border-color: rgba(74, 222, 128, 0.4); }
    h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #bbf7d0;
      text-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
    }
    .hud-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #4ade80;
      opacity: 0.7;
    }

    /* 우측 레이더 텔레메트리 HUD */
    .telemetry-card {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(4, 20, 8, 0.8);
      border: 1px solid rgba(74, 222, 128, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: #86efac;
      backdrop-filter: blur(6px);
      pointer-events: none;
      line-height: 1.6;
      text-align: right;
      z-index: 10;
      min-width: 170px;
    }
    .telemetry-card strong { color: #4ade80; text-shadow: 0 0 8px rgba(74, 222, 128, 0.5); }
    .telemetry-card .danger { color: #f43f5e !important; text-shadow: 0 0 8px rgba(244, 63, 94, 0.6); }

    /* 중앙 상태 알림 배너 (웨이브 클리어 / 도시 전멸) */
    .status-banner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      z-index: 20;
      pointer-events: none;
      display: none;
    }
    .status-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-shadow: 0 0 20px currentColor;
    }
    .status-sub {
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    /* 기지별 남은 잔탄 HUD (하단 배치) */
    .battery-hud {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: #86efac;
      z-index: 10;
      pointer-events: none;
      background: rgba(4, 20, 8, 0.75);
      border: 1px solid rgba(74, 222, 128, 0.15);
      padding: 6px 16px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }
    .battery-hud strong { color: #4ade80; }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="home-link">← marsko</a>
  <h1>VECTOR MISSILE COMMAND</h1>
  <div class="hud-meta">AIR DEFENSE · CHAIN REACTION INTERCEPT</div>
</header>

<div class="telemetry-card">
  <div>SCORE: <strong id="hudScore">0</strong></div>
  <div>WAVE: <strong id="hudWave">1</strong></div>
  <div>CITIES: <strong id="hudCities">6 / 6</strong></div>
  <div>INCOMING: <strong id="hudIncoming">0</strong></div>
  <div>DEFENSE: <strong id="hudStatus">STANDBY</strong></div>
</div>

<div class="status-banner" id="statusBanner">
  <div class="status-title" id="statusTitle">WAVE SURVIVED</div>
  <div class="status-sub" id="statusSub">[클릭] 또는 [SPACE]로 다음 웨이브 방어 시작</div>
</div>

<div class="battery-hud">
  <div>[A] ALPHA: <strong id="ammoAlpha">10</strong></div>
  <div>[S] DELTA: <strong id="ammoDelta">10</strong></div>
  <div>[D] OMEGA: <strong id="ammoOmega">10</strong></div>
</div>

<canvas id="gameCanvas"></canvas>
<div class="crt-overlay"></div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const hudScore = document.getElementById('hudScore');
  const hudWave = document.getElementById('hudWave');
  const hudCities = document.getElementById('hudCities');
  const hudIncoming = document.getElementById('hudIncoming');
  const hudStatus = document.getElementById('hudStatus');

  const statusBanner = document.getElementById('statusBanner');
  const statusTitle = document.getElementById('statusTitle');
  const statusSub = document.getElementById('statusSub');

  const ammoAlpha = document.getElementById('ammoAlpha');
  const ammoDelta = document.getElementById('ammoDelta');
  const ammoOmega = document.getElementById('ammoOmega');

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  // --- Web Audio API 프로시저럴 사운드 합성 엔진 ---
  let audioCtx = null;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  // 1. 요격 미사일 발사 시 고주파 상승 피치 (Launch Chirp)
  function playLaunchSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.12);

    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.16);
  }

  // 2. 동심원 폭발 시 서브베이스 럼블 (Explosion Rumble)
  function playExplosionSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.5);

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);

    // 저음 강조 필터
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 280;

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
  }

  // 3. 적 미사일 도시 명중 시 둔탁한 폭음
  function playCityDestroyedSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(80, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.8);

    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.85);
  }

  // --- 게임 상태 변수 ---
  let score = 0;
  let wave = 1;
  let gameState = 'PLAYING'; // PLAYING, WAVE_CLEARED, GAME_OVER

  // 방공 기지 3개 (Alpha, Delta, Omega)
  let bases = [];
  // 방어 도시 6개
  let cities = [];

  // 미사일 및 폭발 엔티티
  let enemyMissiles = [];
  let interceptors = [];
  let explosions = [];
  let crosshairs = [];

  let totalIncomingThisWave = 0;
  let spawnedThisWave = 0;
  let lastSpawnTime = 0;

  function initBasesAndCities() {
    const groundY = height - 35;
    bases = [
      { id: 0, name: 'ALPHA', x: width * 0.1, y: groundY, ammo: 10, maxAmmo: 10, alive: true },
      { id: 1, name: 'DELTA', x: width * 0.5, y: groundY - 6, ammo: 10, maxAmmo: 10, alive: true },
      { id: 2, name: 'OMEGA', x: width * 0.9, y: groundY, ammo: 10, maxAmmo: 10, alive: true }
    ];

    cities = [
      { x: width * 0.22, y: groundY, alive: true },
      { x: width * 0.31, y: groundY, alive: true },
      { x: width * 0.40, y: groundY, alive: true },
      { x: width * 0.60, y: groundY, alive: true },
      { x: width * 0.69, y: groundY, alive: true },
      { x: width * 0.78, y: groundY, alive: true }
    ];
  }

  function startWave(w) {
    wave = w;
    gameState = 'PLAYING';
    statusBanner.style.display = 'none';

    // 기지 탄약 재보급
    bases.forEach(b => {
      if (b.alive) b.ammo = b.maxAmmo;
    });

    totalIncomingThisWave = 12 + wave * 4;
    spawnedThisWave = 0;
    enemyMissiles = [];
    interceptors = [];
    explosions = [];
    crosshairs = [];

    hudStatus.textContent = 'ENGAGED';
    hudStatus.className = 'danger';
  }

  // 적 ICBM 미사일 생성
  function spawnEnemyMissile() {
    // 살아있는 도시나 기지 중 무작위 타깃 선정
    const targets = [];
    cities.forEach(c => { if (c.alive) targets.push({ x: c.x, y: c.y, type: 'city', ref: c }); });
    bases.forEach(b => { if (b.alive) targets.push({ x: b.x, y: b.y, type: 'base', ref: b }); });

    // 타깃이 없으면 임의의 지면 타격
    const target = targets.length > 0 
      ? targets[Math.floor(Math.random() * targets.length)]
      : { x: Math.random() * width, y: height - 35, type: 'ground' };

    const startX = Math.random() * width;
    const startY = 0;

    // 웨이브가 높아질수록 하강 속도 증가
    const speed = 0.55 + Math.random() * 0.45 + (wave * 0.08);

    enemyMissiles.push({
      startX, startY,
      currX: startX, currY: startY,
      targetX: target.x, targetY: target.y,
      speed,
      targetRef: target,
      split: false // 다탄두(MIRV) 분할 가능 여부
    });

    spawnedThisWave++;
  }

  // 가장 가까운 탄약 있는 기지에서 요격 미사일 발사
  function fireInterceptor(targetX, targetY, forcedBaseIdx = -1) {
    if (gameState !== 'PLAYING') return;

    let chosenBase = null;

    if (forcedBaseIdx !== -1) {
      const b = bases[forcedBaseIdx];
      if (b.alive && b.ammo > 0) chosenBase = b;
    } else {
      // 마우스 위치에서 가장 가깝고 탄약이 남은 기지 탐색
      let minDist = Infinity;
      bases.forEach(b => {
        if (b.alive && b.ammo > 0) {
          const d = Math.hypot(b.x - targetX, b.y - targetY);
          if (d < minDist) {
            minDist = d;
            chosenBase = b;
          }
        }
      });
    }

    if (!chosenBase) return;

    chosenBase.ammo--;
    playLaunchSound();

    // 조준용 크로스헤어 마커 등록
    crosshairs.push({ x: targetX, y: targetY });

    const dx = targetX - chosenBase.x;
    const dy = targetY - chosenBase.y;
    const dist = Math.hypot(dx, dy);
    const speed = 7.5; // 요격탄 비행 속도

    interceptors.push({
      startX: chosenBase.x,
      startY: chosenBase.y,
      currX: chosenBase.x,
      currY: chosenBase.y,
      targetX,
      targetY,
      vx: (dx / dist) * speed,
      vy: (dy / dist) * speed,
      dist,
      traveled: 0
    });
  }

  // 동심원 폭발 생성
  function createExplosion(x, y, maxRadius = 38) {
    playExplosionSound();
    explosions.push({
      x, y,
      radius: 2,
      maxRadius,
      growth: 0.9,
      state: 'GROWING' // GROWING, SHRINKING
    });
  }

  // --- 메인 업데이트 루프 ---
  function update(now) {
    if (gameState === 'PLAYING') {
      // 1. 적 미사일 스폰 타이밍
      if (spawnedThisWave < totalIncomingThisWave && now - lastSpawnTime > (1400 - Math.min(800, wave * 80))) {
        spawnEnemyMissile();
        lastSpawnTime = now;

        // 일정 확률로 다탄두(MIRV) 2발 동시 투하
        if (wave >= 3 && Math.random() < 0.28 && spawnedThisWave < totalIncomingThisWave) {
          spawnEnemyMissile();
        }
      }

      // 2. 적 미사일 하강 물리
      for (let i = enemyMissiles.length - 1; i >= 0; i--) {
        const m = enemyMissiles[i];
        const dx = m.targetX - m.startX;
        const dy = m.targetY - m.startY;
        const dist = Math.hypot(dx, dy);

        m.currX += (dx / dist) * m.speed;
        m.currY += (dy / dist) * m.speed;

        // 지면/도시/기지 도달 판정
        if (m.currY >= m.targetY) {
          createExplosion(m.targetX, m.targetY, 48);
          playCityDestroyedSound();

          // 타깃 파괴 처리
          if (m.targetRef && m.targetRef.type === 'city') {
            m.targetRef.ref.alive = false;
          } else if (m.targetRef && m.targetRef.type === 'base') {
            m.targetRef.ref.alive = false;
            m.targetRef.ref.ammo = 0;
          }

          enemyMissiles.splice(i, 1);
        }
      }

      // 3. 요격 미사일 비행
      for (let i = interceptors.length - 1; i >= 0; i--) {
        const intc = interceptors[i];
        intc.currX += intc.vx;
        intc.currY += intc.vy;
        intc.traveled += Math.hypot(intc.vx, intc.vy);

        // 목표 지점 도달 시 기폭
        if (intc.traveled >= intc.dist) {
          createExplosion(intc.targetX, intc.targetY, 36);
          // 크로스헤어 제거
          const chIdx = crosshairs.findIndex(ch => Math.hypot(ch.x - intc.targetX, ch.y - intc.targetY) < 4);
          if (chIdx !== -1) crosshairs.splice(chIdx, 1);

          interceptors.splice(i, 1);
        }
      }

      // 4. 동심원 폭발 및 연쇄 요격(Chain Reaction) 판정
      for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];

        if (exp.state === 'GROWING') {
          exp.radius += exp.growth;
          if (exp.radius >= exp.maxRadius) exp.state = 'SHRINKING';
        } else {
          exp.radius -= exp.growth * 0.7;
          if (exp.radius <= 0) {
            explosions.splice(i, 1);
            continue;
          }
        }

        // 폭발 구체 내부에 진입한 적 미사일 요격 격추
        for (let j = enemyMissiles.length - 1; j >= 0; j--) {
          const em = enemyMissiles[j];
          if (Math.hypot(em.currX - exp.x, em.currY - exp.y) <= exp.radius) {
            score += 25 * wave;
            // 피격된 자리에서 연쇄 2차 폭발 생성!
            createExplosion(em.currX, em.currY, 32);
            enemyMissiles.splice(j, 1);
          }
        }
      }

      // 5. 웨이브 클리어 / 게임 오버 판정
      const aliveCities = cities.filter(c => c.alive).length;
      if (aliveCities === 0) {
        gameState = 'GAME_OVER';
        statusTitle.textContent = 'THE END // ALL CITIES LOST';
        statusTitle.style.color = '#f43f5e';
        statusSub.textContent = `최종 점수: ${score} · [클릭]하여 재기동`;
        statusBanner.style.display = 'block';
        hudStatus.textContent = 'DEFENSE FAILED';
        hudStatus.className = 'danger';
      } else if (spawnedThisWave >= totalIncomingThisWave && enemyMissiles.length === 0 && interceptors.length === 0) {
        gameState = 'WAVE_CLEARED';
        // 보너스 점수 정산 (남은 도시 x 100점, 남은 탄약 x 5점)
        let ammoBonus = 0;
        bases.forEach(b => ammoBonus += b.ammo * 5);
        const cityBonus = aliveCities * 100;
        score += cityBonus + ammoBonus;

        statusTitle.textContent = `WAVE ${wave} SURVIVED`;
        statusTitle.style.color = '#4ade80';
        statusSub.textContent = `도시 방어 (+${cityBonus}) · 잔여 탄약 (+${ammoBonus}) · [클릭]하여 다음 웨이브`;
        statusBanner.style.display = 'block';
        hudStatus.textContent = 'SECTOR SECURED';
        hudStatus.className = '';
      }
    }

    updateHUD();
  }

  function updateHUD() {
    hudScore.textContent = score;
    hudWave.textContent = wave;
    const aliveCities = cities.filter(c => c.alive).length;
    hudCities.textContent = `${aliveCities} / 6`;
    hudCities.className = aliveCities <= 2 ? 'danger' : '';

    const remaining = (totalIncomingThisWave - spawnedThisWave) + enemyMissiles.length;
    hudIncoming.textContent = remaining;

    ammoAlpha.textContent = bases[0].alive ? bases[0].ammo : 'DEAD';
    ammoDelta.textContent = bases[1].alive ? bases[1].ammo : 'DEAD';
    ammoOmega.textContent = bases[2].alive ? bases[2].ammo : 'DEAD';
  }

  // --- 화면 렌더링 루프 ---
  function draw() {
    // P1 녹색 형광체 잔상 감쇠 페이드
    ctx.fillStyle = 'rgba(2, 5, 3, 0.28)';
    ctx.fillRect(0, 0, width, height);

    const groundY = height - 35;

    // 1. 지면 및 산악 벙커 지형
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(0, groundY);

    // Alpha 기지 벙커
    ctx.lineTo(bases[0].x - 22, groundY);
    ctx.lineTo(bases[0].x, groundY - 14);
    ctx.lineTo(bases[0].x + 22, groundY);

    // Delta 기지 벙커 (중앙 고지대)
    ctx.lineTo(bases[1].x - 28, groundY);
    ctx.lineTo(bases[1].x, groundY - 20);
    ctx.lineTo(bases[1].x + 28, groundY);

    // Omega 기지 벙커
    ctx.lineTo(bases[2].x - 22, groundY);
    ctx.lineTo(bases[2].x, groundY - 14);
    ctx.lineTo(bases[2].x + 22, groundY);

    ctx.lineTo(width, groundY);
    ctx.stroke();

    // 2. 방어 도시 (6개 와이어프레임 빌딩군)
    cities.forEach(c => {
      if (c.alive) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        // 3개 미니 빌딩 실루엣
        ctx.strokeRect(c.x - 12, groundY - 14, 7, 14);
        ctx.strokeRect(c.x - 4, groundY - 20, 8, 20);
        ctx.strokeRect(c.x + 5, groundY - 11, 7, 11);
      } else {
        // 파괴된 폐허 잔해
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.35)';
        ctx.beginPath();
        ctx.moveTo(c.x - 10, groundY);
        ctx.lineTo(c.x + 10, groundY);
        ctx.stroke();
      }
    });

    // 3. 적 ICBM 붉은색 궤적 선
    ctx.lineWidth = 1.2;
    enemyMissiles.forEach(m => {
      ctx.strokeStyle = '#f43f5e';
      ctx.beginPath();
      ctx.moveTo(m.startX, m.startY);
      ctx.lineTo(m.currX, m.currY);
      ctx.stroke();

      // 탄두 선두 발광점
      ctx.fillStyle = '#fecdd3';
      ctx.fillRect(m.currX - 1.5, m.currY - 1.5, 3, 3);
    });

    // 4. 아군 요격 미사일 청록색 궤적 선
    interceptors.forEach(intc => {
      ctx.strokeStyle = 'rgba(74, 222, 128, 0.7)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(intc.startX, intc.startY);
      ctx.lineTo(intc.currX, intc.currY);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(intc.currX - 1.5, intc.currY - 1.5, 3, 3);
    });

    // 5. 조준 크로스헤어 마커 (X자)
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 1.0;
    crosshairs.forEach(ch => {
      ctx.beginPath();
      ctx.moveTo(ch.x - 4, ch.y - 4);
      ctx.lineTo(ch.x + 4, ch.y + 4);
      ctx.moveTo(ch.x + 4, ch.y - 4);
      ctx.lineTo(ch.x - 4, ch.y + 4);
      ctx.stroke();
    });

    // 6. 동심원 플라즈마 폭발 구체
    explosions.forEach(exp => {
      const grad = ctx.createRadialGradient(exp.x, exp.y, 1, exp.x, exp.y, exp.radius);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.35, 'rgba(74, 222, 128, 0.85)');
      grad.addColorStop(0.75, 'rgba(34, 197, 94, 0.4)');
      grad.addColorStop(1, 'transparent');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
      ctx.fill();

      // 가장자리 충격파 링
      ctx.strokeStyle = '#bbf7d0';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    });
  }

  function loop(now) {
    update(now);
    draw();
    requestAnimationFrame(loop);
  }

  // --- 사용자 입력 이벤트 ---
  canvas.addEventListener('mousedown', (e) => {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    if (gameState === 'PLAYING') {
      fireInterceptor(e.clientX, e.clientY);
    } else if (gameState === 'WAVE_CLEARED') {
      startWave(wave + 1);
    } else if (gameState === 'GAME_OVER') {
      score = 0;
      initBasesAndCities();
      startWave(1);
    }
  });

  // 키보드로 특정 기지 강제 발사 ([A], [S], [D] 또는 [SPACE])
  let mousePos = { x: width / 2, y: height / 2 };
  window.addEventListener('mousemove', (e) => {
    mousePos.x = e.clientX;
    mousePos.y = e.clientY;
  });

  window.addEventListener('keydown', (e) => {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    if (gameState === 'PLAYING') {
      if (e.code === 'KeyA') fireInterceptor(mousePos.x, mousePos.y, 0); // Alpha 기지 발사
      if (e.code === 'KeyS') fireInterceptor(mousePos.x, mousePos.y, 1); // Delta 기지 발사
      if (e.code === 'KeyD') fireInterceptor(mousePos.x, mousePos.y, 2); // Omega 기지 발사
      if (e.code === 'Space') fireInterceptor(mousePos.x, mousePos.y); // 자동 최단거리 기지
    } else {
      if (e.code === 'Space') {
        if (gameState === 'WAVE_CLEARED') startWave(wave + 1);
        else if (gameState === 'GAME_OVER') {
          score = 0;
          initBasesAndCities();
          startWave(1);
        }
      }
    }
  });

  // 터치 조작 대응
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    const touch = e.touches[0];
    if (gameState === 'PLAYING') {
      fireInterceptor(touch.clientX, touch.clientY);
    } else if (gameState === 'WAVE_CLEARED') {
      startWave(wave + 1);
    } else if (gameState === 'GAME_OVER') {
      score = 0;
      initBasesAndCities();
      startWave(1);
    }
  }, { passive: false });

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initBasesAndCities();
  });

  // 초기 시작
  initBasesAndCities();
  startWave(1);
  requestAnimationFrame(loop);
</script>

</body>
</html>
