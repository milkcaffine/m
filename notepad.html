<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121316">
  <title>오프라인 마크다운 메모장 // marsko</title>
  <!-- 정상 작동하는 최신 Marked UMD 공식 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <!-- 고정폭 모노스페이스 및 본문 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Apple SD Gothic Neo", sans-serif;
      background: #121316;
      color: #e4e7eb;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* 사이드바 */
    .sidebar {
      width: 280px;
      background: #17191e;
      border-right: 1px solid #232730;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.25s ease;
      z-index: 30;
    }
    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid #232730;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-group { display: flex; flex-direction: column; gap: 2px; }
    .brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      color: #00f0ff;
    }
    .brand-sub { font-size: 0.65rem; color: #64748b; }

    .btn-icon {
      background: #232730;
      border: 1px solid #2f3442;
      color: #e4e7eb;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .btn-icon:hover { background: #2c3240; }

    .note-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .note-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: background 0.15s;
    }
    .note-item:hover { background: #1f232b; }
    .note-item.active { background: #232834; border-left: 3px solid #00f0ff; }
    .note-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f0f3f6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #707887;
    }

    /* 메인 작업 영역 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 상단 툴바 */
    .toolbar {
      padding: 8px 14px;
      border-bottom: 1px solid #232730;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #14161a;
      flex-shrink: 0;
    }
    .tool-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }
    .tool-right { display: flex; align-items: center; gap: 6px; }

    .home-link {
      color: #8b949e;
      font-size: 0.78rem;
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      white-space: nowrap;
      padding: 4px 6px;
      border-radius: 6px;
      background: #1c2027;
    }
    .home-link:hover { color: #00f0ff; }

    #titleInput {
      background: transparent;
      border: none;
      color: #f0f3f6;
      font-size: 0.95rem;
      font-weight: 700;
      width: 100%;
      outline: none;
    }

    #saveStatus {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #556277;
      white-space: nowrap;
    }
    #saveStatus.saved { color: #00f0ff; }

    .view-segmented {
      display: flex;
      background: #1c2027;
      border-radius: 8px;
      padding: 2px;
    }
    .view-segmented button {
      border: none;
      background: transparent;
      color: #7d8799;
      padding: 5px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .view-segmented button.active {
      background: #2a313d;
      color: #00f0ff;
    }

    /* 에디터 & 뷰 */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    #editor {
      width: 100%;
      height: 100%;
      background: #121316;
      color: #dbe0e8;
      border: none;
      outline: none;
      padding: 18px 20px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.92rem;
      line-height: 1.7;
      resize: none;
      overflow-y: auto;
    }
    #preview {
      width: 100%;
      height: 100%;
      background: #121316;
      padding: 20px 24px;
      overflow-y: auto;
      display: none;
      line-height: 1.75;
      font-size: 0.95rem;
      color: #cdd5df;
    }

    /* 마크다운 서식 */
    #preview h1, #preview h2, #preview h3 { color: #f0f3f6; margin: 1.2em 0 0.5em 0; font-weight: 700; }
    #preview h1 { font-size: 1.4rem; border-bottom: 1px solid #232730; padding-bottom: 6px; }
    #preview h2 { font-size: 1.2rem; }
    #preview h3 { font-size: 1.05rem; }
    #preview p { margin-bottom: 1em; }
    #preview ul, #preview ol { padding-left: 20px; margin-bottom: 1em; }
    #preview li { margin-bottom: 4px; }
    #preview blockquote {
      border-left: 3px solid #00f0ff;
      padding-left: 12px;
      margin: 1em 0;
      color: #8b98a9;
      font-style: italic;
    }
    #preview code {
      font-family: 'IBM Plex Mono', monospace;
      background: #1c2028;
      color: #00f0ff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85em;
    }
    #preview pre {
      background: #171920;
      border: 1px solid #232730;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1em 0;
    }
    #preview pre code { background: none; padding: 0; color: #e4e7eb; }

    /* 모바일 서랍 반응형 */
    @media (max-width: 680px) {
      .sidebar {
        position: absolute;
        top: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
        box-shadow: 10px 0 30px rgba(0,0,0,0.7);
      }
    }
  </style>
</head>
<body>

<!-- 좌측 사이드바 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="brand-group">
      <span class="brand">OFFLINE NOTES</span>
      <span class="brand-sub">LOCAL STORAGE ENGINE</span>
    </div>
    <button class="btn-icon" id="newNoteBtn">+ 새 글</button>
  </div>
  <div class="note-list" id="noteList"></div>
</aside>

<!-- 우측 메인 에디터 -->
<main class="main">
  <div class="toolbar">
    <div class="tool-left">
      <a href="index.html" class="home-link">← marsko</a>
      <button class="btn-icon" id="toggleSidebarBtn" title="목록 열기/닫기">☰ 목록</button>
      <input type="text" id="titleInput" placeholder="제목 없는 메모" value="">
    </div>
    <div class="tool-right">
      <span id="saveStatus">저장됨</span>
      <div class="view-segmented">
        <button type="button" id="editTab" class="active">편집</button>
        <button type="button" id="previewTab">미리보기</button>
      </div>
      <button class="btn-icon" id="exportBtn" title=".md 파일로 내보내기">⬇ MD</button>
      <button class="btn-icon" id="deleteBtn" style="color:#ff4466;" title="삭제">✕</button>
    </div>
  </div>

  <div class="workspace">
    <textarea id="editor" placeholder="여기에 생각을 자유롭게 기록하세요...&#10;&#10;* 외부 서버 통신 없이 브라우저 내부에 실시간 자동 저장됩니다.&#10;* 상단의 [미리보기] 탭을 누르면 마크다운 서식이 렌더링됩니다."></textarea>
    <div id="preview"></div>
  </div>
</main>

<script>
  // 저장소 엔진: localStorage 기반 안전 동기식 엔진 (오류 0%)
  const STORAGE_KEY = 'marsko_notes_v1';
  let notes = [];
  let currentNoteId = null;
  let autoSaveTimer = null;

  const sidebar = document.getElementById('sidebar');
  const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
  const noteList = document.getElementById('noteList');
  const newNoteBtn = document.getElementById('newNoteBtn');
  const titleInput = document.getElementById('titleInput');
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const saveStatus = document.getElementById('saveStatus');
  const editTab = document.getElementById('editTab');
  const previewTab = document.getElementById('previewTab');
  const exportBtn = document.getElementById('exportBtn');
  const deleteBtn = document.getElementById('deleteBtn');

  // 데이터 로드
  function loadAllNotesFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        notes = JSON.parse(raw);
      } else {
        notes = [];
      }
    } catch (e) {
      console.warn('Storage read error, starting fresh', e);
      notes = [];
    }
  }

  // 데이터 저장
  function saveAllNotesToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    } catch (e) {
      console.error('Storage save error', e);
    }
  }

  // 사이드바 목록 UI 갱신 (무한 재귀 없음)
  function renderSidebarList() {
    noteList.innerHTML = '';
    // 최신 수정순 정렬
    notes.sort((a, b) => b.updatedAt - a.updatedAt);

    notes.forEach(note => {
      const item = document.createElement('div');
      item.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
      const d = new Date(note.updatedAt);
      const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

      item.innerHTML = `
        <span class="note-title">${escapeHtml(note.title) || '제목 없는 메모'}</span>
        <span class="note-date">${dateStr}</span>
      `;
      item.addEventListener('click', () => {
        selectNote(note.id);
        if (window.innerWidth <= 680) sidebar.classList.remove('open');
      });
      noteList.appendChild(item);
    });
  }

  // 특정 노트 선택
  function selectNote(id) {
    const target = notes.find(n => n.id === id);
    if (!target) return;

    currentNoteId = target.id;
    titleInput.value = target.title || '';
    editor.value = target.content || '';
    saveStatus.textContent = '저장됨';
    saveStatus.className = 'saved';

    // 사이드바 active 클래스만 토글 (DOM 재구축 방지)
    document.querySelectorAll('.note-item').forEach((el, idx) => {
      el.classList.toggle('active', notes[idx] && notes[idx].id === currentNoteId);
    });

    if (preview.style.display === 'block') {
      renderMarkdownPreview();
    }
  }

  // 새 글 생성
  function createNewNote(customTitle, customContent) {
    const newNote = {
      id: 'note_' + Date.now(),
      title: customTitle || '',
      content: customContent || '',
      updatedAt: Date.now()
    };
    notes.unshift(newNote);
    saveAllNotesToStorage();
    currentNoteId = newNote.id;
    renderSidebarList();
    selectNote(newNote.id);
  }

  // 디바운스 자동 저장 (0.3초)
  function triggerAutoSave() {
    saveStatus.textContent = '저장 중...';
    saveStatus.className = '';
    clearTimeout(autoSaveTimer);

    autoSaveTimer = setTimeout(() => {
      const current = notes.find(n => n.id === currentNoteId);
      if (!current) return;

      current.title = titleInput.value.trim();
      current.content = editor.value;
      current.updatedAt = Date.now();

      saveAllNotesToStorage();
      saveStatus.textContent = '저장됨';
      saveStatus.className = 'saved';

      renderSidebarList();
    }, 300);
  }

  titleInput.addEventListener('input', triggerAutoSave);
  editor.addEventListener('input', () => {
    triggerAutoSave();
    if (preview.style.display === 'block') {
      renderMarkdownPreview();
    }
  });

  // 단축키 Ctrl+S / Cmd+S
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      triggerAutoSave();
    }
  });

  // 새 글 버튼
  newNoteBtn.addEventListener('click', () => {
    createNewNote('', '');
    if (window.innerWidth <= 680) sidebar.classList.remove('open');
    editor.focus();
  });

  // 삭제 버튼
  deleteBtn.addEventListener('click', () => {
    if (!currentNoteId) return;
    if (confirm('현재 메모를 삭제하시겠습니까?')) {
      notes = notes.filter(n => n.id !== currentNoteId);
      saveAllNotesToStorage();

      if (notes.length > 0) {
        renderSidebarList();
        selectNote(notes[0].id);
      } else {
        createNewNote('', '');
      }
    }
  });

  // 사이드바 토글
  toggleSidebarBtn.addEventListener('click', () => {
    sidebar.classList.toggle('open');
  });

  // 편집 / 미리보기 탭
  editTab.addEventListener('click', () => {
    editTab.classList.add('active');
    previewTab.classList.remove('active');
    editor.style.display = 'block';
    preview.style.display = 'none';
  });

  previewTab.addEventListener('click', () => {
    previewTab.classList.add('active');
    editTab.classList.remove('active');
    editor.style.display = 'none';
    preview.style.display = 'block';
    renderMarkdownPreview();
  });

  function renderMarkdownPreview() {
    const raw = editor.value || '*내용이 없습니다.*';
    try {
      if (window.marked && typeof window.marked.parse === 'function') {
        preview.innerHTML = window.marked.parse(raw);
      } else {
        preview.textContent = raw;
      }
    } catch (e) {
      preview.textContent = raw;
    }
  }

  // .md 내보내기
  exportBtn.addEventListener('click', () => {
    const title = (titleInput.value.trim() || 'untitled').replace(/[/\\?%*:|"<>]/g, '-');
    const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${title}.md`;
    link.click();
  });

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 앱 시작 초기화
  loadAllNotesFromStorage();
  if (notes.length === 0) {
    createNewNote('시작하기', `# 나만의 오프라인 마크다운 메모장\n\n이 메모장은 외부 서버 통신 없이 브라우저 내부에 실시간 안전하게 저장됩니다.\n\n- 타이핑을 멈추면 **0.3초 만에 자동 저장**됩니다.\n- 상단의 **[미리보기]** 탭을 누르면 마크다운 서식이 깔끔하게 렌더링됩니다.\n- **[⬇ MD]** 버튼으로 언제든 마크다운 파일로 다운로드할 수 있습니다.`);
  } else {
    renderSidebarList();
    selectNote(notes[0].id);
  }
</script>

</body>
</html>
