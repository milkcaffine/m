<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121316">
  <title>MINIMAL OFFLINE NOTEPAD</title>
  <!-- 클라이언트 마크다운 파서 marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- 고정폭 모노스페이스 및 본문 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Apple SD Gothic Neo", sans-serif;
      background: #121316;
      color: #e4e7eb;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* 사이드바 (문서 목록 드로어) */
    .sidebar {
      width: 270px;
      background: #17191e;
      border-right: 1px solid #232730;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.25s ease;
      z-index: 20;
    }
    .sidebar-header {
      padding: 16px 14px;
      border-bottom: 1px solid #232730;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 0.5px;
    }
    .btn-icon {
      background: #232730;
      border: 1px solid #2f3442;
      color: #e4e7eb;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }
    .btn-icon:hover { background: #2c3240; }

    .note-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .note-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: background 0.15s;
    }
    .note-item:hover { background: #1f232b; }
    .note-item.active { background: #232834; border-left: 3px solid #00f0ff; }
    .note-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f0f3f6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #707887;
    }

    /* 메인 에디터 영역 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 상단 네비게이션 툴바 */
    .toolbar {
      height: 52px;
      padding: 0 16px;
      border-bottom: 1px solid #232730;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #14161a;
      flex-shrink: 0;
    }
    .tool-left { display: flex; align-items: center; gap: 10px; flex: 1; }
    .tool-right { display: flex; align-items: center; gap: 8px; }

    #titleInput {
      background: transparent;
      border: none;
      color: #f0f3f6;
      font-size: 0.95rem;
      font-weight: 700;
      width: 100%;
      outline: none;
    }
    #saveStatus {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: #556277;
      white-space: nowrap;
    }
    #saveStatus.saved { color: #00f0ff; }

    /* 뷰 모드 탭 (Edit / Preview) */
    .view-segmented {
      display: flex;
      background: #1c2027;
      border-radius: 8px;
      padding: 2px;
    }
    .view-segmented button {
      border: none;
      background: transparent;
      color: #7d8799;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .view-segmented button.active {
      background: #2a313d;
      color: #00f0ff;
    }

    /* 본문 편집기 & 렌더링 컨테이너 */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    #editor {
      width: 100%;
      height: 100%;
      background: #121316;
      color: #dbe0e8;
      border: none;
      outline: none;
      padding: 20px 24px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.92rem;
      line-height: 1.7;
      resize: none;
      overflow-y: auto;
    }

    #preview {
      width: 100%;
      height: 100%;
      background: #121316;
      padding: 20px 28px;
      overflow-y: auto;
      display: none;
      line-height: 1.75;
      font-size: 0.95rem;
      color: #cdd5df;
    }

    /* 마크다운 렌더링 스타일 */
    #preview h1, #preview h2, #preview h3 { color: #f0f3f6; margin: 1.2em 0 0.5em 0; font-weight: 700; }
    #preview h1 { font-size: 1.5rem; border-bottom: 1px solid #232730; padding-bottom: 6px; }
    #preview h2 { font-size: 1.25rem; }
    #preview h3 { font-size: 1.05rem; }
    #preview p { margin-bottom: 1em; }
    #preview ul, #preview ol { padding-left: 20px; margin-bottom: 1em; }
    #preview li { margin-bottom: 4px; }
    #preview blockquote {
      border-left: 3px solid #00f0ff;
      padding-left: 14px;
      margin: 1em 0;
      color: #8b98a9;
      font-style: italic;
    }
    #preview code {
      font-family: 'IBM Plex Mono', monospace;
      background: #1c2028;
      color: #00f0ff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85em;
    }
    #preview pre {
      background: #171920;
      border: 1px solid #232730;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1em 0;
    }
    #preview pre code { background: none; padding: 0; color: #e4e7eb; }
    #preview hr { border: none; border-top: 1px solid #232730; margin: 2em 0; }

    /* 모바일 반응형 서랍 */
    @media (max-width: 680px) {
      .sidebar {
        position: absolute;
        top: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
        box-shadow: 10px 0 30px rgba(0,0,0,0.7);
      }
    }
    .back { text-align: center; margin-bottom: 12px; font-size: 0.85rem; }
    .back a { color: #007aff; text-decoration: none; }
  </style>
</head>
<body>

<!-- 좌측 문서 목록 사이드바 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="brand">INDEXED-DB // NOTES</span>
    <button class="btn-icon" id="newNoteBtn">+ 새 글</button>
  </div>
  <div class="note-list" id="noteList"></div>
</aside>

<!-- 우측 메인 에디터 -->
<main class="main">
  <div class="back"><a href="index.html">← marsko</a></div>
  <div class="toolbar">
    <div class="tool-left">
      <button class="btn-icon" id="toggleSidebarBtn" title="목록 열기/닫기">☰</button>
      <input type="text" id="titleInput" placeholder="제목 없는 메모" value="">
    </div>
    <div class="tool-right">
      <span id="saveStatus">저장됨</span>
      <div class="view-segmented">
        <button type="button" id="editTab" class="active">편집</button>
        <button type="button" id="previewTab">미리보기</button>
      </div>
      <button class="btn-icon" id="exportBtn" title=".md 파일로 내보내기">⬇ MD</button>
      <button class="btn-icon" id="deleteBtn" style="color:#ff3366;" title="현재 메모 삭제">✕</button>
    </div>
  </div>

  <div class="workspace">
    <textarea id="editor" placeholder="여기에 마크다운으로 생각을 자유롭게 기록하세요...&#10;&#10;* 서버 통신 없이 브라우저 내부 IndexedDB에 실시간 자동 저장됩니다.&#10;* 상단의 [미리보기] 버튼을 누르면 서식이 깔끔하게 렌더링됩니다."></textarea>
    <div id="preview"></div>
  </div>
</main>

<script>
  // 1. IndexedDB 설정
  const DB_NAME = 'OfflineMinimalNotepadDB';
  const DB_VERSION = 1;
  const STORE_NAME = 'notes';
  let db = null;
  let currentNoteId = null;
  let autoSaveTimer = null;

  const sidebar = document.getElementById('sidebar');
  const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
  const noteList = document.getElementById('noteList');
  const newNoteBtn = document.getElementById('newNoteBtn');
  const titleInput = document.getElementById('titleInput');
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const saveStatus = document.getElementById('saveStatus');
  const editTab = document.getElementById('editTab');
  const previewTab = document.getElementById('previewTab');
  const exportBtn = document.getElementById('exportBtn');
  const deleteBtn = document.getElementById('deleteBtn');

  // DB 열기 프로미스
  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains(STORE_NAME)) {
          const store = database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          store.createIndex('updatedAt', 'updatedAt', { unique: false });
        }
      };
      request.onsuccess = (e) => {
        db = e.target.result;
        resolve(db);
      };
      request.onerror = (e) => reject(e);
    });
  }

  // DB 트랜잭션 헬퍼
  function getAllNotes() {
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => {
        // 최신 수정순 정렬
        const notes = req.result.sort((a, b) => b.updatedAt - a.updatedAt);
        resolve(notes);
      };
    });
  }

  function getNote(id) {
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get(id);
      req.onsuccess = () => resolve(req.result);
    });
  }

  function saveNoteToDB(note) {
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.put(note);
      tx.oncomplete = () => resolve();
    });
  }

  function deleteNoteFromDB(id) {
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.delete(id);
      tx.oncomplete = () => resolve();
    });
  }

  // 2. 문서 렌더링 & UI 제어
  async function refreshNoteList() {
    const notes = await getAllNotes();
    noteList.innerHTML = '';

    if (notes.length === 0) {
      // 노트가 하나도 없으면 초기 기본 노트 생성
      await createNewNote('시작하기', `# 나만의 오프라인 마크다운 메모장\n\n이 메모장은 **외부 서버 통신 전혀 없이** 브라우저 로컬 저장소(\`IndexedDB\`)에만 영구 보관됩니다.\n\n- 타이핑을 멈추면 **0.3초 만에 자동 저장**됩니다.\n- 상단의 **[미리보기]**를 누르면 마크다운 서식이 렌더링됩니다.\n- **[⬇ MD]** 버튼으로 언제든 마크다운 파일로 다운로드할 수 있습니다.`);
      return;
    }

    notes.forEach(note => {
      const item = document.createElement('div');
      item.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
      const d = new Date(note.updatedAt);
      const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

      item.innerHTML = `
        <span class="note-title">${note.title || '제목 없는 메모'}</span>
        <span class="note-date">${dateStr}</span>
      `;
      item.onclick = () => loadNote(note.id);
      noteList.appendChild(item);
    });
  }

  async function loadNote(id) {
    const note = await getNote(id);
    if (!note) return;
    currentNoteId = note.id;
    titleInput.value = note.title;
    editor.value = note.content;
    saveStatus.textContent = '저장됨';
    saveStatus.className = 'saved';
    
    // 모바일이면 서랍 닫기
    if (window.innerWidth <= 680) sidebar.classList.remove('open');
    refreshNoteList();
  }

  async function createNewNote(customTitle, customContent) {
    const newNote = {
      id: 'note_' + Date.now(),
      title: customTitle || '',
      content: customContent || '',
      updatedAt: Date.now()
    };
    await saveNoteToDB(newNote);
    currentNoteId = newNote.id;
    await loadNote(newNote.id);
  }

  // 3. 디바운스 자동 저장 (타이핑 멈춘 후 300ms)
  function triggerAutoSave() {
    saveStatus.textContent = '저장 중...';
    saveStatus.className = '';
    clearTimeout(autoSaveTimer);

    autoSaveTimer = setTimeout(async () => {
      if (!currentNoteId) return;
      const note = {
        id: currentNoteId,
        title: titleInput.value.trim(),
        content: editor.value,
        updatedAt: Date.now()
      };
      await saveNoteToDB(note);
      saveStatus.textContent
