<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Marsko lab tool — film-frame.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/marsko-hud.css">
<meta name="theme-color" content="#09090b">
  <title>필름 카메라 프레임 & 보더 생성기 // marsko</title>
  <!-- ✅ 정상 작동하는 jsDelivr 공식 CDN으로 교체 -->
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <!-- 감성 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Apple SD Gothic Neo", sans-serif;
      background: #09090b;
      color: #e4e4e7;
      display: flex;
      justify-content: center;
      padding: 12px;
    }
    .container {
      background: #18181b;
      border: 1px solid #27272a;
      max-width: 520px;
      width: 100%;
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.25rem; font-weight: 800; text-align: center; margin-bottom: 4px; color: #f4f4f5; }
    p.sub { font-size: 0.8rem; color: #a1a1aa; text-align: center; margin-bottom: 16px; }

    /* 업로드 영역 */
    .dropzone {
      border: 2px dashed #0284c7;
      background: #0f172a;
      border-radius: 14px;
      padding: 22px 12px;
      text-align: center;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .dropzone:hover {
      background: #132038;
      border-color: #38bdf8;
    }
    .dropzone small { font-size: 0.75rem; color: #94a3b8; font-weight: 400; }
    input[type="file"] { display: none; }

    /* EXIF 감지 상태 표시줄 */
    .exif-status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .exif-status.ok { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .exif-status.warn { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    /* 컨트롤 패널 */
    .control-panel {
      margin-top: 14px;
      background: #27272a;
      border: 1px solid #3f3f46;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.88rem;
    }
    .control-row label { font-weight: 600; color: #d4d4d8; }
    .control-row select, .control-row input[type="text"] {
      font-size: 0.9rem;
      border-radius: 8px;
      padding: 7px 10px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #f4f4f5;
    }
    .control-row input[type="text"] { width: 195px; }

    /* 세그먼트 버튼 */
    .segmented-control {
      display: flex;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 3px;
      width: 100%;
      margin-bottom: 4px;
    }
    .segmented-control button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 0;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      color: #a1a1aa;
      transition: all 0.15s ease;
    }
    .segmented-control button.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .slider-box { display: flex; align-items: center; gap: 8px; }
    .slider-box input[type="range"] { width: 110px; }
    .slider-box span { font-size: 0.8rem; color: #94a3b8; width: 36px; text-align: right; }

    /* 미리보기 뷰 */
    #previewArea {
      margin-top: 16px;
      display: none;
      width: 100%;
      text-align: center;
    }
    .preview-header { font-size: 0.75rem; color: #a1a1aa; margin-bottom: 6px; text-align: left; }
    .canvas-container {
      width: 100%;
      max-height: 420px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }
    #previewCanvas {
      max-width: 100%;
      max-height: 400px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      border-radius: 4px;
    }

    /* 다운로드 버튼 */
    .btn-group { margin-top: 18px; }
    .btn {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0284c7;
      color: #ffffff;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #0369a1; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .back { text-align: center; margin-bottom: 12px; font-size: 0.85rem; }
    .back a { color: #64748b; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; }
    .back a:hover { color: #38bdf8; }
  </style>
</head>
<body>

<div class="container">
  <div class="back"><a href="index.html">← marsko</a></div>
  <h1>필름 카메라 프레임 생성기</h1>
  <p class="sub">EXIF 자동 읽기 · 카메라 & 렌즈 정보 보더</p>

  <div class="dropzone" id="dropzone">
    <span>📷 사진 선택 / 불러오기</span>
    <small>모바일에서 EXIF를 유지하려면 '파일 선택'으로 원본을 고르세요</small>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/heic,.jpg,.jpeg,.png,.heic">
  </div>

  <div id="exifStatus" class="exif-status"></div>

  <div class="control-panel">
    <label style="font-weight: 600; font-size: 0.88rem; color: #343a40;">보더(프레임) 스타일</label>
    <div class="segmented-control" id="styleControl">
      <button type="button" data-style="white" class="active">갤러리 화이트</button>
      <button type="button" data-style="black">시네마 블랙</button>
      <button type="button" data-style="film">35mm 필름</button>
      <button type="button" data-style="polaroid">폴라로이드</button>
    </div>

    <div class="control-row">
      <label for="cameraInput">카메라 바디</label>
      <input type="text" id="cameraInput" value="Sony α7 II" placeholder="예: Leica IIIf, Sony A7II">
    </div>

    <div class="control-row">
      <label for="lensInput">렌즈 이름</label>
      <input type="text" id="lensInput" value="Helios 44-2 58mm F2" placeholder="예: Helios 44-2 58mm F2">
    </div>

    <div class="control-row">
      <label for="exposureInput">촬영 파라미터</label>
      <input type="text" id="exposureInput" value="F2.0 · 1/500s · ISO 100" placeholder="f값, 셔터속도, ISO">
    </div>

    <div class="control-row">
      <label for="dateInput">날짜 / 장소</label>
      <input type="text" id="dateInput" value="2026.10 · TOKYO" placeholder="예: 2026.10">
    </div>

    <div class="control-row" id="borderWidthRow">
      <label for="borderRange">외곽 여백 두께</label>
      <div class="slider-box">
        <input type="range" id="borderRange" min="20" max="100" value="48">
        <span id="borderVal">48px</span>
      </div>
    </div>
  </div>

  <div id="previewArea">
    <div class="preview-header">미리보기 (원본 고화질 유지)</div>
    <div class="canvas-container">
      <canvas id="previewCanvas"></canvas>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" id="downloadBtn" disabled>프레임 사진 저장</button>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const exifStatus = document.getElementById('exifStatus');
  const styleControl = document.getElementById('styleControl');
  const cameraInput = document.getElementById('cameraInput');
  const lensInput = document.getElementById('lensInput');
  const exposureInput = document.getElementById('exposureInput');
  const dateInput = document.getElementById('dateInput');
  const borderRange = document.getElementById('borderRange');
  const borderVal = document.getElementById('borderVal');

  const previewArea = document.getElementById('previewArea');
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');
  const downloadBtn = document.getElementById('downloadBtn');

  let currentImg = null;
  let currentStyle = 'white';

  // 스타일 토글
  styleControl.addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    styleControl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentStyle = e.target.dataset.style;
    renderFrame();
  });

  // 파일 업로드 및 EXIF 파싱
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    exifStatus.style.display = 'block';
    exifStatus.className = 'exif-status';
    exifStatus.textContent = '사진 정보를 분석하는 중...';

    // 1. EXIF 데이터 파싱 (옵션 제한 없이 전체 태그 읽기)
    try {
      if (typeof window.exifr !== 'undefined') {
        const exif = await window.exifr.parse(file);

        if (exif && (exif.Model || exif.Make || exif.ExposureTime || exif.ISO || exif.FNumber || exif.DateTimeOriginal)) {
          // 바디 모델명
          if (exif.Model) {
            cameraInput.value = exif.Model;
          } else if (exif.Make) {
            cameraInput.value = exif.Make;
          }

          // 렌즈명 (수동 렌즈 등 LensModel이 없을 때는 수동 입력값 유지하거나 초점거리 표시)
          if (exif.LensModel) {
            lensInput.value = exif.LensModel;
          } else if (exif.FocalLength) {
            lensInput.value = `${Math.round(exif.FocalLength)}mm`;
          }

          // 노출 파라미터 조합
          const params = [];
          if (exif.FNumber) params.push(`F${exif.FNumber}`);
          if (exif.ExposureTime) {
            const exp = exif.ExposureTime;
            params.push(exp < 1 ? `1/${Math.round(1 / exp)}s` : `${exp}s`);
          }
          const isoVal = exif.ISO || exif.ISOSpeedRatings;
          if (isoVal) params.push(`ISO ${isoVal}`);

          if (params.length > 0) {
            exposureInput.value = params.join(' · ');
          }

          // 촬영 날짜
          const dt = exif.DateTimeOriginal || exif.CreateDate;
          if (dt instanceof Date && !isNaN(dt)) {
            const yyyy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            dateInput.value = `${yyyy}.${mm}.${dd}`;
          }

          exifStatus.className = 'exif-status ok';
          exifStatus.textContent = '✨ 사진에서 EXIF 촬영 정보를 성공적으로 불러왔습니다!';
        } else {
          exifStatus.className = 'exif-status warn';
          exifStatus.textContent = 'ℹ️ 사진에 EXIF 정보가 없어 기본/수동 입력값을 유지합니다.';
        }
      }
    } catch (err) {
      console.warn('EXIF parse warning:', err);
      exifStatus.className = 'exif-status warn';
      exifStatus.textContent = 'ℹ️ EXIF를 읽을 수 없는 파일입니다. 직접 텍스트를 수정해 주세요.';
    }

    // 2. 이미지 로드 및 캔버스 렌더링
    const reader = new FileReader();
    reader.onload = (ev) => {
      currentImg = new Image();
      currentImg.onload = renderFrame;
      currentImg.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  // 실시간 텍스트 수정 반영
  [cameraInput, lensInput, exposureInput, dateInput].forEach(el => el.addEventListener('input', renderFrame));
  borderRange.addEventListener('input', () => {
    borderVal.textContent = borderRange.value + 'px';
    renderFrame();
  });

  // 프레임 렌더링
  function renderFrame() {
    if (!currentImg) return;

    const imgW = currentImg.naturalWidth;
    const imgH = currentImg.naturalHeight;
    const baseBorder = parseInt(borderRange.value, 10);

    const scale = Math.max(imgW, imgH) / 1000;
    const pad = Math.round(baseBorder * scale);
    const bottomBarH = currentStyle === 'polaroid' ? Math.round(pad * 2.8) : Math.round(pad * 1.8);

    let canvasW, canvasH, photoX, photoY;

    if (currentStyle === 'film') {
      const sprocketBarH = Math.round(pad * 1.5);
      canvasW = imgW + pad * 2;
      canvasH = imgH + sprocketBarH * 2 + bottomBarH;
      photoX = pad;
      photoY = sprocketBarH;
    } else {
      canvasW = imgW + pad * 2;
      canvasH = imgH + pad + bottomBarH;
      photoX = pad;
      photoY = pad;
    }

    canvas.width = canvasW;
    canvas.height = canvasH;

    // 1. 프레임 배경
    if (currentStyle === 'white' || currentStyle === 'polaroid') {
      ctx.fillStyle = '#fdfdfd';
    } else {
      ctx.fillStyle = '#0f1012';
    }
    ctx.fillRect(0, 0, canvasW, canvasH);

    // 2. 35mm 필름 스타일 스프로킷
    if (currentStyle === 'film') {
      drawFilmSprockets(ctx, canvasW, canvasH, pad, photoY, imgH);
    }

    // 3. 원본 사진
    ctx.drawImage(currentImg, photoX, photoY, imgW, imgH);

    // 4. 하단 텍스트
    const isDark = (currentStyle === 'black' || currentStyle === 'film');
    const textColor = isDark ? '#f8f9fa' : '#1a1a1a';
    const subColor = isDark ? '#868e96' : '#70777e';
    const infoY = photoY + imgH + Math.round(pad * 0.7);

    ctx.save();
    if (currentStyle === 'polaroid') {
      ctx.fillStyle = '#2b2b2b';
      ctx.font = `600 ${Math.round(26 * scale)}px "IBM Plex Mono", monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(cameraInput.value, photoX + 10, infoY + Math.round(18 * scale));

      ctx.fillStyle = '#7a7a7a';
      ctx.font = `400 ${Math.round(20 * scale)}px "IBM Plex Mono", monospace`;
      ctx.fillText(`${lensInput.value}  ${exposureInput.value}`, photoX + 10, infoY + Math.round(48 * scale));

      ctx.textAlign = 'right';
      ctx.fillText(dateInput.value, photoX + imgW - 10, infoY + Math.round(48 * scale));
    } else {
      ctx.fillStyle = textColor;
      ctx.font = `700 ${Math.round(24 * scale)}px "Inter", sans-serif`;
      ctx.textAlign = 'left';
      ctx.fillText(cameraInput.value.toUpperCase(), photoX, infoY);

      ctx.fillStyle = subColor;
      ctx.font = `500 ${Math.round(18 * scale)}px "IBM Plex Mono", monospace`;
      ctx.fillText(lensInput.value, photoX, infoY + Math.round(26 * scale));

      ctx.textAlign = 'right';
      ctx.fillStyle = textColor;
      ctx.font = `600 ${Math.round(20 * scale)}px "IBM Plex Mono", monospace`;
      ctx.fillText(exposureInput.value, photoX + imgW, infoY);

      ctx.fillStyle = subColor;
      ctx.font = `500 ${Math.round(17 * scale)}px "Inter", sans-serif`;
      ctx.fillText(dateInput.value.toUpperCase(), photoX + imgW, infoY + Math.round(26 * scale));
    }
    ctx.restore();

    previewArea.style.display = 'block';
    downloadBtn.disabled = false;
  }

  function drawFilmSprockets(ctx, w, h, pad, photoY, imgH) {
    ctx.save();
    const holeW = Math.round(pad * 0.45);
    const holeH = Math.round(pad * 0.6);
    const holeGap = Math.round(holeW * 1.5);
    const radius = Math.round(holeW * 0.2);

    const topHoleY = Math.round((photoY - holeH) / 2);
    const bottomHoleY = photoY + imgH + Math.round(pad * 1.8) + Math.round((photoY - holeH) / 2) - 10;

    ctx.fillStyle = '#22252a';
    for (let x = pad / 2; x < w - pad / 2; x += (holeW + holeGap)) {
      ctx.beginPath();
      ctx.roundRect(x, topHoleY, holeW, holeH, radius);
      ctx.fill();

      ctx.beginPath();
      ctx.roundRect(x, bottomHoleY, holeW, holeH, radius);
      ctx.fill();
    }

    ctx.fillStyle = '#d97706';
    ctx.font = `700 ${Math.round(pad * 0.35)}px "IBM Plex Mono", monospace`;
    ctx.fillText('FILM 400', pad, topHoleY + holeH + 18);
    ctx.fillText('▶ 24A', w / 2, topHoleY + holeH + 18);
    ctx.restore();
  }

  downloadBtn.addEventListener('click', () => {
    canvas.toBlob((blob) => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `bordered_${Date.now()}.jpg`;
      link.click();
    }, 'image/jpeg', 0.98);
  });
</script>

</body>
</html>
