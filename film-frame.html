<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Marsko lab tool — film-frame. EXIF 자동 추출 및 다양한 시네마·중형·필름 검은 프레임 보더 생성기">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/marsko-hud.css">
  <meta name="theme-color" content="#09090b">
  <title>필름 카메라 프레임 & 보더 생성기 // marsko</title>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <!-- 감성 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Apple SD Gothic Neo", sans-serif;
      background: #09090b;
      color: #e4e4e7;
      display: flex;
      justify-content: center;
      padding: 14px 10px 40px;
      min-height: 100vh;
    }
    .container {
      background: #18181b;
      border: 1px solid #27272a;
      max-width: 580px;
      width: 100%;
      border-radius: 20px;
      padding: 22px 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.25rem; font-weight: 800; text-align: center; margin-bottom: 4px; color: #f4f4f5; letter-spacing: -0.3px; }
    p.sub { font-size: 0.8rem; color: #a1a1aa; text-align: center; margin-bottom: 16px; }

    .back { text-align: center; margin-bottom: 12px; font-size: 0.85rem; }
    .back a { color: #64748b; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; }
    .back a:hover { color: #38bdf8; }

    /* 업로드 영역 */
    .dropzone {
      border: 2px dashed #0284c7;
      background: #0f172a;
      border-radius: 14px;
      padding: 22px 14px;
      text-align: center;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .dropzone:hover {
      background: #132038;
      border-color: #38bdf8;
    }
    .dropzone small { font-size: 0.75rem; color: #94a3b8; font-weight: 400; }
    input[type="file"] { display: none; }

    /* EXIF 감지 상태 표시줄 */
    .exif-status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .exif-status.ok { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .exif-status.warn { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    /* 컨트롤 패널 */
    .control-panel {
      margin-top: 14px;
      background: #202024;
      border: 1px solid #333338;
      padding: 14px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .panel-section-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #94a3b8;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      margin-top: 2px;
      margin-bottom: 1px;
    }

    /* 스타일 그리드 */
    .style-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 2px;
    }
    .style-btn {
      border: 1px solid #3f3f46;
      background: #18181b;
      padding: 7px 4px;
      font-size: 0.74rem;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      color: #a1a1aa;
      text-align: center;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .style-btn:hover { background: #27272a; color: #f4f4f5; }
    .style-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 1px 6px rgba(2, 132, 199, 0.4);
    }

    /* 옵션 행 */
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.84rem;
      gap: 8px;
    }
    .control-row label { font-weight: 600; color: #d4d4d8; flex-shrink: 0; }
    .control-row select, .control-row input[type="text"] {
      font-size: 0.86rem;
      border-radius: 8px;
      padding: 6px 10px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #f4f4f5;
      font-family: inherit;
    }
    .control-row input[type="text"] { flex: 1; max-width: 280px; }
    .control-row select { min-width: 130px; }

    /* 소형 세그먼트 (비율 / 톤) */
    .sub-segmented {
      display: flex;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .sub-segmented button {
      border: none;
      background: transparent;
      padding: 4px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.15s ease;
    }
    .sub-segmented button:hover { color: #f1f5f9; }
    .sub-segmented button.active {
      background: #334155;
      color: #38bdf8;
    }

    /* 체크박스 토글 */
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      color: #cbd5e1;
      font-size: 0.82rem;
    }
    .toggle-label input[type="checkbox"] {
      accent-color: #0284c7;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .slider-box { display: flex; align-items: center; gap: 8px; }
    .slider-box input[type="range"] {
      width: 120px;
      accent-color: #0284c7;
      cursor: pointer;
    }
    .slider-box span {
      font-size: 0.78rem;
      color: #94a3b8;
      min-width: 42px;
      text-align: right;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* 상세 옵션 서브 패널 */
    .detail-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px dashed #333338;
    }

    /* 미리보기 뷰 */
    #previewArea {
      margin-top: 16px;
      display: none;
      width: 100%;
      text-align: center;
    }
    .preview-header {
      font-size: 0.75rem;
      color: #a1a1aa;
      margin-bottom: 6px;
      text-align: left;
      font-family: 'IBM Plex Mono', monospace;
    }
    .canvas-container {
      width: 100%;
      max-height: 480px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
    }
    #previewCanvas {
      max-width: 100%;
      max-height: 460px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border-radius: 4px;
    }

    /* 다운로드 버튼 */
    .btn-group { margin-top: 18px; }
    .btn {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0284c7;
      color: #ffffff;
      transition: background 0.15s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }
    .btn:hover:not(:disabled) {
      background: #0369a1;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.4);
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 520px) {
      .style-grid { grid-template-columns: repeat(2, 1fr); }
      .control-row { flex-direction: column; align-items: flex-start; gap: 4px; }
      .control-row input[type="text"], .control-row select { width: 100%; max-width: 100%; }
      .slider-box input[type="range"] { width: 100px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="back"><a href="index.html">← marsko</a></div>
  <h1>필름 카메라 프레임 생성기</h1>
  <p class="sub">EXIF 자동 읽기 · 시네마 & 중형 필름 다크 프레임</p>

  <div class="dropzone" id="dropzone">
    <span>📷 사진 선택 / 불러오기</span>
    <small>모바일에서 EXIF를 유지하려면 '파일 선택'으로 원본을 고르세요</small>
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/heic,.jpg,.jpeg,.png,.heic">
  </div>

  <div id="exifStatus" class="exif-status"></div>

  <div class="control-panel">
    <!-- 프레임 스타일 선택 (8종) -->
    <div class="panel-section-title">프레임 스타일</div>
    <div class="style-grid" id="styleControl">
      <button type="button" class="style-btn active" data-style="black">시네마 블랙</button>
      <button type="button" class="style-btn" data-style="medium">중형 120 필름</button>
      <button type="button" class="style-btn" data-style="scope">시네마스코프</button>
      <button type="button" class="style-btn" data-style="mat">파인아트 매트</button>
      <button type="button" class="style-btn" data-style="film">35mm 필름</button>
      <button type="button" class="style-btn" data-style="polaroid">폴라로이드</button>
      <button type="button" class="style-btn" data-style="white">갤러리 화이트</button>
      <button type="button" class="style-btn" data-style="minimal">순수 보더 (No Text)</button>
    </div>

    <!-- 검은 프레임 세부 커스텀 옵션 -->
    <div class="detail-options" id="detailOptions">
      <div class="control-row">
        <label>비율 (Aspect)</label>
        <div class="sub-segmented" id="aspectControl">
          <button type="button" class="active" data-aspect="auto">원본 유지</button>
          <button type="button" data-aspect="1:1">1:1 정방형</button>
          <button type="button" data-aspect="4:5">4:5 인스타</button>
          <button type="button" data-aspect="16:9">16:9 와이드</button>
        </div>
      </div>

      <div class="control-row" id="toneRow">
        <label>배경 블랙 톤</label>
        <div class="sub-segmented" id="toneControl">
          <button type="button" class="active" data-tone="#000000">제트 블랙</button>
          <button type="button" data-tone="#0e1013">차콜 다크</button>
          <button type="button" data-tone="#151311">빈티지 웜</button>
          <button type="button" data-tone="#080c14">미드나잇</button>
        </div>
      </div>

      <div class="control-row">
        <label for="keylineSelect">내부 키라인(이너 라인)</label>
        <select id="keylineSelect">
          <option value="none" selected>없음 (기본)</option>
          <option value="white">미세 화이트 (1px)</option>
          <option value="gold">앤틱 골드 (1px)</option>
          <option value="silver">실버 그레이 (1px)</option>
        </select>
      </div>

      <div class="control-row">
        <label for="cornerSelect">사진 모서리 깎기</label>
        <select id="cornerSelect">
          <option value="0" selected>직각 (0px)</option>
          <option value="6">부드럽게 (Soft)</option>
          <option value="16">필름 라운드 (Round)</option>
        </select>
      </div>

      <div class="control-row">
        <label class="toggle-label">
          <input type="checkbox" id="dateStampToggle">
          <span>90s 레트로 오렌지 날짜 스탬프 각인 (LED)</span>
        </label>
      </div>

      <div class="control-row" id="borderWidthRow">
        <label for="borderRange">외곽 여백 두께</label>
        <div class="slider-box">
          <input type="range" id="borderRange" min="20" max="120" value="48">
          <span id="borderVal">48px</span>
        </div>
      </div>
    </div>

    <!-- EXIF 및 카메라 텍스트 정보 입력 -->
    <div class="panel-section-title" id="textSectionTitle" style="margin-top: 4px;">카메라 & 촬영 정보</div>

    <div class="control-row" id="cameraRow">
      <label for="cameraInput">카메라 바디</label>
      <input type="text" id="cameraInput" value="Sony α7 II" placeholder="예: Leica M6, Hasselblad 500C/M">
    </div>

    <div class="control-row" id="lensRow">
      <label for="lensInput">렌즈 이름</label>
      <input type="text" id="lensInput" value="Helios 44-2 58mm F2" placeholder="예: Carl Zeiss Planar 80mm F2.8">
    </div>

    <div class="control-row" id="exposureRow">
      <label for="exposureInput">촬영 파라미터</label>
      <input type="text" id="exposureInput" value="F2.0 · 1/500s · ISO 100" placeholder="f값, 셔터속도, ISO">
    </div>

    <div class="control-row" id="dateRow">
      <label for="dateInput">날짜 / 장소</label>
      <input type="text" id="dateInput" value="2026.10 · TOKYO" placeholder="예: 2026.10.24">
    </div>
  </div>

  <div id="previewArea">
    <div class="preview-header">미리보기 (고해상도 캔버스)</div>
    <div class="canvas-container">
      <canvas id="previewCanvas"></canvas>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" id="downloadBtn" disabled>프레임 사진 저장</button>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const exifStatus = document.getElementById('exifStatus');
  const styleControl = document.getElementById('styleControl');
  const aspectControl = document.getElementById('aspectControl');
  const toneControl = document.getElementById('toneControl');
  const keylineSelect = document.getElementById('keylineSelect');
  const cornerSelect = document.getElementById('cornerSelect');
  const dateStampToggle = document.getElementById('dateStampToggle');

  const cameraInput = document.getElementById('cameraInput');
  const lensInput = document.getElementById('lensInput');
  const exposureInput = document.getElementById('exposureInput');
  const dateInput = document.getElementById('dateInput');
  const borderRange = document.getElementById('borderRange');
  const borderVal = document.getElementById('borderVal');

  const previewArea = document.getElementById('previewArea');
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');
  const downloadBtn = document.getElementById('downloadBtn');

  // 상태 관리
  let currentImg = null;
  let currentStyle = 'black'; // 기본 시네마 블랙
  let currentAspect = 'auto'; // 'auto', '1:1', '4:5', '16:9'
  let currentTone = '#000000'; // 기본 제트 블랙
  let currentKeyline = 'none'; // 'none', 'white', 'gold', 'silver'
  let currentCorner = 0;       // 0, 6, 16
  let showDateStamp = false;

  // 1. 스타일 토글
  styleControl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    styleControl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentStyle = btn.dataset.style;

    // 미니멀 보더 모드일 때는 텍스트 입력창 숨기기
    const textRows = [document.getElementById('cameraRow'), document.getElementById('lensRow'), document.getElementById('exposureRow'), document.getElementById('dateRow')];
    if (currentStyle === 'minimal') {
      textRows.forEach(r => r.style.display = 'none');
      document.getElementById('textSectionTitle').style.display = 'none';
    } else {
      textRows.forEach(r => r.style.display = 'flex');
      document.getElementById('textSectionTitle').style.display = 'block';
    }

    renderFrame();
  });

  // 2. 비율 토글
  aspectControl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    aspectControl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentAspect = btn.dataset.aspect;
    renderFrame();
  });

  // 3. 블랙 톤 토글
  toneControl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    toneControl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTone = btn.dataset.tone;
    renderFrame();
  });

  // 4. 셀렉트 및 체크박스 이벤트
  keylineSelect.addEventListener('change', (e) => {
    currentKeyline = e.target.value;
    renderFrame();
  });

  cornerSelect.addEventListener('change', (e) => {
    currentCorner = parseInt(e.target.value, 10);
    renderFrame();
  });

  dateStampToggle.addEventListener('change', (e) => {
    showDateStamp = e.target.checked;
    renderFrame();
  });

  // 파일 업로드 및 EXIF 파싱
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    exifStatus.style.display = 'block';
    exifStatus.className = 'exif-status';
    exifStatus.textContent = '사진 정보를 분석하는 중...';

    try {
      if (typeof window.exifr !== 'undefined') {
        const exif = await window.exifr.parse(file);

        if (exif && (exif.Model || exif.Make || exif.ExposureTime || exif.ISO || exif.FNumber || exif.DateTimeOriginal)) {
          if (exif.Model) {
            cameraInput.value = exif.Model;
          } else if (exif.Make) {
            cameraInput.value = exif.Make;
          }

          if (exif.LensModel) {
            lensInput.value = exif.LensModel;
          } else if (exif.FocalLength) {
            lensInput.value = `${Math.round(exif.FocalLength)}mm`;
          }

          const params = [];
          if (exif.FNumber) params.push(`F${exif.FNumber}`);
          if (exif.ExposureTime) {
            const exp = exif.ExposureTime;
            params.push(exp < 1 ? `1/${Math.round(1 / exp)}s` : `${exp}s`);
          }
          const isoVal = exif.ISO || exif.ISOSpeedRatings;
          if (isoVal) params.push(`ISO ${isoVal}`);

          if (params.length > 0) {
            exposureInput.value = params.join(' · ');
          }

          const dt = exif.DateTimeOriginal || exif.CreateDate;
          if (dt instanceof Date && !isNaN(dt)) {
            const yyyy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            dateInput.value = `${yyyy}.${mm}.${dd}`;
          }

          exifStatus.className = 'exif-status ok';
          exifStatus.textContent = '✨ 사진에서 EXIF 촬영 정보를 성공적으로 불러왔습니다!';
        } else {
          exifStatus.className = 'exif-status warn';
          exifStatus.textContent = 'ℹ️ 사진에 EXIF 정보가 없어 기본/수동 입력값을 유지합니다.';
        }
      }
    } catch (err) {
      console.warn('EXIF parse warning:', err);
      exifStatus.className = 'exif-status warn';
      exifStatus.textContent = 'ℹ️ EXIF를 읽을 수 없는 파일입니다. 직접 텍스트를 수정해 주세요.';
    }

    const reader = new FileReader();
    reader.onload = (ev) => {
      currentImg = new Image();
      currentImg.onload = renderFrame;
      currentImg.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  // 텍스트 및 슬라이더 실시간 반응
  [cameraInput, lensInput, exposureInput, dateInput].forEach(el => el.addEventListener('input', renderFrame));
  borderRange.addEventListener('input', () => {
    borderVal.textContent = borderRange.value + 'px';
    renderFrame();
  });

  // ----------------------------------------------------------------------
  // 메인 프레임 렌더링 엔진
  // ----------------------------------------------------------------------
  function renderFrame() {
    if (!currentImg) return;

    const imgW = currentImg.naturalWidth;
    const imgH = currentImg.naturalHeight;
    const baseBorder = parseInt(borderRange.value, 10);
    const scale = Math.max(imgW, imgH) / 1000;
    const pad = Math.round(baseBorder * scale);

    // 하단 텍스트 정보 바 높이 계산
    let bottomBarH = 0;
    if (currentStyle === 'minimal') {
      bottomBarH = pad;
    } else if (currentStyle === 'polaroid') {
      bottomBarH = Math.round(pad * 2.8);
    } else if (currentStyle === 'scope') {
      bottomBarH = Math.round(pad * 1.5);
    } else {
      bottomBarH = Math.round(pad * 1.8);
    }

    // 1. 스타일별 기본 콘텐츠 크기 계산
    let contentW, contentH, photoX, photoY;

    if (currentStyle === 'film') {
      const sprocketH = Math.round(pad * 1.4);
      contentW = imgW + pad * 2;
      contentH = imgH + sprocketH * 2 + bottomBarH;
      photoX = pad;
      photoY = sprocketH;
    } else if (currentStyle === 'medium') {
      const mediumPadY = Math.round(pad * 1.4);
      contentW = imgW + pad * 2;
      contentH = imgH + mediumPadY + bottomBarH;
      photoX = pad;
      photoY = mediumPadY;
    } else if (currentStyle === 'scope') {
      const letterH = Math.round(pad * 1.5);
      contentW = imgW + pad;
      contentH = imgH + letterH + bottomBarH;
      photoX = Math.round(pad * 0.5);
      photoY = letterH;
    } else {
      contentW = imgW + pad * 2;
      contentH = imgH + pad + bottomBarH;
      photoX = pad;
      photoY = pad;
    }

    // 2. 지정된 비율(Aspect Ratio)에 맞춰 캔버스 확장 및 중앙 정렬
    let canvasW = contentW;
    let canvasH = contentH;
    let offsetX = 0;
    let offsetY = 0;

    if (currentAspect !== 'auto') {
      let targetRatio = 1.0;
      if (currentAspect === '1:1') targetRatio = 1.0;
      else if (currentAspect === '4:5') targetRatio = 4 / 5;
      else if (currentAspect === '16:9') targetRatio = 16 / 9;

      const currentRatio = contentW / contentH;
      if (currentRatio > targetRatio) {
        // 너비 기준 맞추고 높이를 늘림
        canvasW = contentW;
        canvasH = Math.round(contentW / targetRatio);
        offsetY = Math.round((canvasH - contentH) / 2);
      } else {
        // 높이 기준 맞추고 너비를 늘림
        canvasH = contentH;
        canvasW = Math.round(contentH * targetRatio);
        offsetX = Math.round((canvasW - contentW) / 2);
      }
    }

    canvas.width = canvasW;
    canvas.height = canvasH;
    photoX += offsetX;
    photoY += offsetY;

    // 3. 배경 채우기
    let bgColor = currentTone;
    if (currentStyle === 'white' || currentStyle === 'polaroid') {
      bgColor = '#fdfdfd';
    } else if (currentStyle === 'mat') {
      bgColor = currentTone === '#000000' ? '#0d0e11' : currentTone;
    }
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvasW, canvasH);

    // 4. 특수 프레임 장식 렌더링
    if (currentStyle === 'film') {
      drawFilmSprockets(ctx, canvasW, canvasH, pad, photoY, imgH, offsetX);
    } else if (currentStyle === 'medium') {
      drawMediumFormatDetails(ctx, canvasW, canvasH, photoX, photoY, imgW, imgH, scale, pad);
    } else if (currentStyle === 'scope') {
      drawCinemascopeHud(ctx, canvasW, canvasH, photoX, photoY, imgW, imgH, scale, pad);
    }

    // 5. 원본 사진 렌더링 (모서리 라운딩 적용)
    ctx.save();
    const cornerR = Math.round(currentCorner * scale);
    if (cornerR > 0) {
      ctx.beginPath();
      ctx.roundRect(photoX, photoY, imgW, imgH, cornerR);
      ctx.clip();
    }
    ctx.drawImage(currentImg, photoX, photoY, imgW, imgH);
    ctx.restore();

    // 6. 이너 키라인 (내부 테두리) 렌더링
    if (currentKeyline !== 'none' || currentStyle === 'mat') {
      let keyColor = 'rgba(255, 255, 255, 0.4)';
      if (currentKeyline === 'gold') keyColor = 'rgba(217, 169, 78, 0.55)';
      else if (currentKeyline === 'silver') keyColor = 'rgba(180, 190, 205, 0.55)';
      else if (currentKeyline === 'white' || currentStyle === 'mat') keyColor = 'rgba(240, 240, 240, 0.35)';

      const insetGap = Math.max(2, Math.round(3 * scale));
      const keyX = photoX - insetGap;
      const keyY = photoY - insetGap;
      const keyW = imgW + insetGap * 2;
      const keyH = imgH + insetGap * 2;

      ctx.save();
      ctx.strokeStyle = keyColor;
      ctx.lineWidth = Math.max(1, Math.round(1.2 * scale));
      ctx.beginPath();
      if (cornerR > 0) {
        ctx.roundRect(keyX, keyY, keyW, keyH, cornerR + insetGap);
      } else {
        ctx.rect(keyX, keyY, keyW, keyH);
      }
      ctx.stroke();
      ctx.restore();
    }

    // 7. 90년대 레트로 주황색 날짜 스탬프 (Date Stamp)
    if (showDateStamp) {
      drawRetroDateStamp(ctx, photoX, photoY, imgW, imgH, scale);
    }

    // 8. 하단 카메라 정보 텍스트 렌더링 (순수 보더 모드가 아닐 때)
    if (currentStyle !== 'minimal') {
      renderFrameTypography(ctx, canvasW, canvasH, photoX, photoY, imgW, imgH, scale, pad);
    }

    previewArea.style.display = 'block';
    downloadBtn.disabled = false;
  }

  // ----------------------------------------------------------------------
  // 스타일별 세부 그래픽 렌더러
  // ----------------------------------------------------------------------

  // A. 중형 포맷 (Medium 120 Format - 롤라이/핫셀블라드 감성)
  function drawMediumFormatDetails(ctx, w, h, px, py, pw, ph, scale, pad) {
    ctx.save();

    // 상하좌우 필름 프레임 노치(Notch) 음각 홈
    ctx.fillStyle = '#020202';
    const notchW = Math.round(14 * scale);
    const notchH = Math.round(6 * scale);

    // 상하 중앙 노치
    ctx.fillRect(px + pw / 2 - notchW / 2, py - notchH, notchW, notchH);
    ctx.fillRect(px + pw / 2 - notchW / 2, py + ph, notchW, notchH);

    // 좌우 중앙 노치
    ctx.fillRect(px - notchH, py + ph / 2 - notchW / 2, notchH, notchW);
    ctx.fillRect(px + pw, py + ph / 2 - notchW / 2, notchH, notchW);

    // 상단 빈티지 골드/오렌지 필름 마킹
    const markY = py - Math.round(pad * 0.45);
    ctx.font = `700 ${Math.round(13 * scale)}px "IBM Plex Mono", monospace`;
    ctx.fillStyle = '#eab308';
    ctx.textAlign = 'left';
    ctx.fillText('■ 120  KODAK PORTRA 400', px, markY);

    ctx.textAlign = 'right';
    ctx.fillText('EXP 12  ► 12A', px + pw, markY);

    ctx.restore();
  }

  // B. 시네마스코프 (Cinemascope 2.39:1 타임코드 & 테크니컬 HUD)
  function drawCinemascopeHud(ctx, w, h, px, py, pw, ph, scale, pad) {
    ctx.save();
    const hudY = py - Math.round(pad * 0.45);

    // 상단 좌측: REC 레드닷 & 24 FPS
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(px + 8, hudY - 4, Math.max(3, 4 * scale), 0, Math.PI * 2);
    ctx.fill();

    ctx.font = `600 ${Math.round(13 * scale)}px "IBM Plex Mono", monospace`;
    ctx.fillStyle = '#e2e8f0';
    ctx.textAlign = 'left';
    ctx.fillText('REC  23.976 FPS  RAW 4K', px + 22 * scale, hudY);

    // 상단 우측: 시네마 화면비 & 타임코드
    ctx.textAlign = 'right';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('SCOPE 2.39:1  TC 01:24:18:04', px + pw, hudY);

    ctx.restore();
  }

  // C. 35mm 필름 스프로킷 홀
  function drawFilmSprockets(ctx, w, h, pad, photoY, imgH, offsetX) {
    ctx.save();
    const holeW = Math.round(pad * 0.42);
    const holeH = Math.round(pad * 0.58);
    const holeGap = Math.round(holeW * 1.45);
    const radius = Math.round(holeW * 0.22);

    const topHoleY = Math.round((photoY - holeH) / 2);
    const bottomHoleY = photoY + imgH + Math.round(pad * 1.8) + Math.round((photoY - holeH) / 2) - 8;

    ctx.fillStyle = '#1c1f24';
    for (let x = offsetX + pad / 2; x < w - offsetX - pad / 2; x += (holeW + holeGap)) {
      ctx.beginPath();
      ctx.roundRect(x, topHoleY, holeW, holeH, radius);
      ctx.fill();

      ctx.beginPath();
      ctx.roundRect(x, bottomHoleY, holeW, holeH, radius);
      ctx.fill();
    }

    ctx.fillStyle = '#f59e0b';
    ctx.font = `700 ${Math.round(pad * 0.32)}px "IBM Plex Mono", monospace`;
    ctx.fillText('FILM 400', offsetX + pad, topHoleY + holeH + 16);
    ctx.fillText('▶ 24A', offsetX + (w - offsetX * 2) / 2, topHoleY + holeH + 16);
    ctx.restore();
  }

  // D. 90년대 레트로 주황색 LED 날짜 각인 (Date Stamp)
  function drawRetroDateStamp(ctx, px, py, pw, ph, scale) {
    ctx.save();
    const stampText = formatToRetroDate(dateInput.value);
    const fontSize = Math.round(28 * scale);
    ctx.font = `700 ${fontSize}px "IBM Plex Mono", monospace`;

    // 우측 하단 여백 배치
    const x = px + pw - Math.round(24 * scale);
    const y = py + ph - Math.round(24 * scale);

    ctx.textAlign = 'right';

    // 네온 글로우 효과
    ctx.shadowColor = '#ff6b00';
    ctx.shadowBlur = 12 * scale;
    ctx.fillStyle = '#ff9233';
    ctx.fillText(stampText, x, y);

    ctx.shadowBlur = 4 * scale;
    ctx.fillStyle = '#ffa94d';
    ctx.fillText(stampText, x, y);

    ctx.restore();
  }

  function formatToRetroDate(inputStr) {
    // 날짜 문자열에서 연/월/일 추출 또는 기본 포맷
    const match = inputStr.match(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
    if (match) {
      const yy = match[1].slice(-2);
      const mm = match[2].padStart(2, '0');
      const dd = match[3].padStart(2, '0');
      return `'${yy} ${mm} ${dd}`;
    }
    return `'26 11 01`;
  }

  // E. 타이포그래피 렌더러
  function renderFrameTypography(ctx, w, h, px, py, pw, ph, scale, pad) {
    const isDark = (currentStyle !== 'white' && currentStyle !== 'polaroid');
    const primaryColor = isDark ? '#f8fafc' : '#1e293b';
    const subColor = isDark ? '#94a3b8' : '#64748b';
    const infoY = py + ph + Math.round(pad * 0.72);

    ctx.save();

    if (currentStyle === 'polaroid') {
      ctx.fillStyle = '#1e293b';
      ctx.font = `600 ${Math.round(25 * scale)}px "IBM Plex Mono", monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(cameraInput.value, px + 8, infoY + Math.round(18 * scale));

      ctx.fillStyle = '#64748b';
      ctx.font = `400 ${Math.round(19 * scale)}px "IBM Plex Mono", monospace`;
      ctx.fillText(`${lensInput.value}  ${exposureInput.value}`, px + 8, infoY + Math.round(48 * scale));

      ctx.textAlign = 'right';
      ctx.fillText(dateInput.value, px + pw - 8, infoY + Math.round(48 * scale));
    } else if (currentStyle === 'mat') {
      // 갤러리 도록 스타일 미니멀 센터 정렬
      ctx.textAlign = 'center';
      ctx.fillStyle = primaryColor;
      ctx.font = `600 ${Math.round(22 * scale)}px "Cinzel", "Inter", serif`;
      ctx.fillText(cameraInput.value.toUpperCase(), px + pw / 2, infoY);

      ctx.fillStyle = subColor;
      ctx.font = `400 ${Math.round(16 * scale)}px "IBM Plex Mono", monospace`;
      ctx.fillText(`${lensInput.value}  ·  ${exposureInput.value}  ·  ${dateInput.value}`, px + pw / 2, infoY + Math.round(26 * scale));
    } else if (currentStyle === 'scope') {
      // 시네마 와이드 스타일
      ctx.fillStyle = '#f8fafc';
      ctx.font = `700 ${Math.round(22 * scale)}px "Inter", sans-serif`;
      ctx.textAlign = 'left';
      ctx.fillText(cameraInput.value.toUpperCase(), px, infoY);

      ctx.fillStyle = '#38bdf8';
      ctx.font = `500 ${Math.round(17 * scale)}px "IBM Plex Mono", monospace`;
      ctx.fillText(lensInput.value, px, infoY + Math.round(26 * scale));

      ctx.textAlign = 'right';
      ctx.fillStyle = '#f8fafc';
      ctx.font = `600 ${Math.round(19 * scale)}px "IBM Plex Mono", monospace`;
      ctx.fillText(exposureInput.value, px + pw, infoY);

      ctx.fillStyle = '#94a3b8';
      ctx.font = `500 ${Math.round(16 * scale)}px "Inter", sans-serif`;
      ctx.fillText(dateInput.value.toUpperCase(), px + pw, infoY + Math.round(26 * scale));
    } else {
      // 시네마 블랙, 중형, 화이트 공통
      ctx.fillStyle = primaryColor;
      ctx.font = `700 ${Math.round(24 * scale)}px "Inter", sans-serif`;
      ctx.textAlign = 'left';
      ctx.fillText(cameraInput.value.toUpperCase(), px, infoY);

      ctx.fillStyle = subColor;
      ctx.font = `500 ${Math.round(18 * scale)}px "IBM Plex Mono", monospace`;
      ctx.fillText(lensInput.value, px, infoY + Math.round(26 * scale));

      ctx.textAlign = 'right';
      ctx.fillStyle = primaryColor;
      ctx.font = `600 ${Math.round(20 * scale)}px "IBM Plex Mono", monospace`;
      ctx.fillText(exposureInput.value, px + pw, infoY);

      ctx.fillStyle = subColor;
      ctx.font = `500 ${Math.round(17 * scale)}px "Inter", sans-serif`;
      ctx.fillText(dateInput.value.toUpperCase(), px + pw, infoY + Math.round(26 * scale));
    }

    ctx.restore();
  }

  // 다운로드
  downloadBtn.addEventListener('click', () => {
    canvas.toBlob((blob) => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `film_frame_${currentStyle}_${Date.now()}.jpg`;
      link.click();
    }, 'image/jpeg', 0.98);
  });
</script>
