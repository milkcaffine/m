<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Marsko lab tool — slingshot.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/marsko-hud.css">
<meta name="theme-color" content="#030407">
  <title>Gravity Slingshot // marsko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020306;
      color: #cbd5e1;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    #spaceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* 상단 헤더 HUD */
    header {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
    }
    .home-link {
      color: #64748b;
      font-size: 0.75rem;
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      pointer-events: auto;
      width: fit-content;
      padding: 2px 6px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
    }
    .home-link:hover { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
    h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f8fafc;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    .hud-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #94a3b8;
    }

    /* 우측 텔레메트리 HUD */
    .telemetry-card {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(10, 15, 26, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: #94a3b8;
      backdrop-filter: blur(6px);
      pointer-events: none;
      line-height: 1.6;
      text-align: right;
      z-index: 10;
      min-width: 170px;
    }
    .telemetry-card strong { color: #38bdf8; }
    .telemetry-card .warn { color: #f43f5e !important; }
    .telemetry-card .safe { color: #4ade80 !important; }

    /* 중앙 상태 알림 배너 */
    .status-banner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      z-index: 20;
      pointer-events: none;
      display: none;
    }
    .status-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-shadow: 0 0 20px currentColor;
    }
    .status-sub {
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    /* 하단 컨트롤 독 */
    .control-dock {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 15, 26, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      z-index: 10;
      max-width: 95%;
      overflow-x: auto;
    }
    .dock-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .dock-btn:hover { background: #334155; color: #38bdf8; }
    .dock-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .dock-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }

    .tip-hint {
      position: absolute;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: #64748b;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="home-link">← marsko</a>
  <h1>ORBITAL GRAVITY SLINGSHOT</h1>
  <div class="hud-meta">N-BODY GRAVITY ASSIST · RK4 TRAJECTORY</div>
</header>

<div class="telemetry-card">
  <div>LEVEL: <strong id="hudLevel">1</strong></div>
  <div>VELOCITY: <strong id="hudVel">0.00</strong> AU/s</div>
  <div>ATTEMPTS: <strong id="hudTries">0</strong></div>
  <div>STATUS: <strong id="hudStatus">READY TO SLING</strong></div>
</div>

<div class="status-banner" id="statusBanner">
  <div class="status-title" id="statusTitle">ORBIT INSERTED!</div>
  <div class="status-sub" id="statusSub">[클릭]하여 다음 성계로 도약</div>
</div>

<div class="tip-hint">
  발사대(LAUNCHER)를 뒤로 당겼다 놓아 탐사선을 발사하세요. [R] 재도전
</div>

<canvas id="spaceCanvas"></canvas>

<div class="control-dock">
  <button type="button" class="dock-btn" id="btnRestart">현재 레벨 재시도 (R)</button>
  <button type="button" class="dock-btn" id="btnPrev">이전 성계</button>
  <button type="button" class="dock-btn" id="btnNext">다음 성계</button>

  <div class="dock-sep"></div>

  <button type="button" class="dock-btn active" id="btnGravityField">중력장 그리드</button>
  <button type="button" class="dock-btn active" id="btnTrace">궤적 잔상</button>
</div>

<script>
  const canvas = document.getElementById('spaceCanvas');
  const ctx = canvas.getContext('2d');

  const hudLevel = document.getElementById('hudLevel');
  const hudVel = document.getElementById('hudVel');
  const hudTries = document.getElementById('hudTries');
  const hudStatus = document.getElementById('hudStatus');

  const statusBanner = document.getElementById('statusBanner');
  const statusTitle = document.getElementById('statusTitle');
  const statusSub = document.getElementById('statusSub');

  const btnRestart = document.getElementById('btnRestart');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnGravityField = document.getElementById('btnGravityField');
  const btnTrace = document.getElementById('btnTrace');

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  // --- Web Audio API 프로시저럴 사운드 ---
  let audioCtx = null;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  // 1. 슬링샷 발사 신스 피치
  function playLaunchSound(power) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880 * Math.min(2.0, power * 0.2), audioCtx.currentTime + 0.18);

    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.24);
  }

  // 2. 행성 근일점 슬링샷 가속 윙윙음 (Gravity Assist Whoosh)
  function playAssistSound(speed) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(420, audioCtx.currentTime + 0.15);

    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.22);
  }

  // 3. 목표 기지 도킹 성공 팡파르
  function playSuccessSound() {
    if (!audioCtx) return;
    const freqs = [523.25, 659.25, 783.99, 1046.50]; // C 장조 아르페지오
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.08);
      gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + i * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + i * 0.08 + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + i * 0.08);
      osc.stop(audioCtx.currentTime + i * 0.08 + 0.5);
    });
  }

  // 4. 행성 충돌 폭발음
  function playCrashSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(90, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.4);

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.45);
  }

  // --- 레벨 및 성계 설계 ---
  let currentLevelIdx = 0;
  let attempts = 0;
  let showGravityField = true;
  let showTrace = true;

  // 레벨 데이터셋 (비율 기준 좌표: 0.0 ~ 1.0)
  const LEVELS = [
    {
      title: "ALPHA CENTAURI // 단일 중력선회",
      launcher: { rx: 0.15, ry: 0.5 },
      target: { rx: 0.85, ry: 0.5, r: 24 },
      planets: [
        { rx: 0.5, ry: 0.5, mass: 900, r: 36, color: '#38bdf8' }
      ]
    },
    {
      title: "KEPLER-16 // 쌍성계 8자 슬링샷",
      launcher: { rx: 0.12, ry: 0.3 },
      target: { rx: 0.88, ry: 0.7, r: 24 },
      planets: [
        { rx: 0.38, ry: 0.5, mass: 850, r: 32, color: '#fbbf24' },
        { rx: 0.62, ry: 0.5, mass: 950, r: 34, color: '#f43f5e' }
      ]
    },
    {
      title: "TRIPLE STAR // 삼중성 중력 미로",
      launcher: { rx: 0.1, ry: 0.8 },
      target: { rx: 0.88, ry: 0.2, r: 24 },
      planets: [
        { rx: 0.32, ry: 0.65, mass: 780, r: 30, color: '#a855f7' },
        { rx: 0.52, ry: 0.35, mass: 1100, r: 38, color: '#38bdf8' },
        { rx: 0.72, ry: 0.70, mass: 820, r: 32, color: '#4ade80' }
      ]
    },
    {
      title: "CYGNUS X-1 // 초거대 블랙홀 우회",
      launcher: { rx: 0.15, ry: 0.18 },
      target: { rx: 0.15, ry: 0.82, r: 24 },
      planets: [
        { rx: 0.5, ry: 0.5, mass: 2400, r: 48, color: '#e2e8f0', isBlackHole: true },
        { rx: 0.75, ry: 0.3, mass: 650, r: 26, color: '#fbbf24' },
        { rx: 0.75, ry: 0.7, mass: 650, r: 26, color: '#38bdf8' }
      ]
    }
  ];

  // 물리 시뮬레이션 상태
  let launcherPos = { x: 0, y: 0 };
  let targetPos = { x: 0, y: 0, r: 24 };
  let planets = [];

  let probe = null; // { x, y, vx, vy, path: [] }
  let isDragging = false;
  let dragStart = { x: 0, y: 0 };
  let dragCurrent = { x: 0, y: 0 };
  let gameState = 'AIMING'; // AIMING, FLYING, SUCCESS, CRASHED
  let particles = [];
  let stars = [];

  function initStars() {
    stars = [];
    for (let i = 0; i < 110; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.5 + 0.4,
        alpha: Math.random() * 0.7 + 0.2
      });
    }
  }

  function loadLevel(idx) {
    currentLevelIdx = (idx + LEVELS.length) % LEVELS.length;
    const lvl = LEVELS[currentLevelIdx];

    hudLevel.textContent = `${currentLevelIdx + 1} / ${LEVELS.length}`;
    gameState = 'AIMING';
    statusBanner.style.display = 'none';
    hudStatus.textContent = 'READY TO SLING';
    hudStatus.className = 'safe';

    launcherPos = { x: lvl.launcher.rx * width, y: lvl.launcher.ry * height };
    targetPos = { x: lvl.target.rx * width, y: lvl.target.ry * height, r: lvl.target.r };

    planets = lvl.planets.map(p => ({
      x: p.rx * width,
      y: p.ry * height,
      mass: p.mass,
      r: p.r,
      color: p.color,
      isBlackHole: p.isBlackHole || false
    }));

    probe = null;
    particles = [];
  }

  // 뉴턴 만유인력 가속도 계산: a = sum( G * M * r_vec / |r|^3 )
  function getAcceleration(px, py) {
    let ax = 0;
    let ay = 0;
    const G = 1.0;
    const softening = 8.0; // 특이점 방지 스무딩

    for (let p of planets) {
      const dx = p.x - px;
      const dy = p.y - py;
      const distSq = dx * dx + dy * dy + softening * softening;
      const dist = Math.sqrt(distSq);
      const force = (G * p.mass) / distSq;

      ax += force * (dx / dist);
      ay += force * (dy / dist);
    }
    return { ax, ay };
  }

  // 4차 룽게-쿠타(RK4) 정밀 적분 궤적 시뮬레이터 (예측 점선용)
  function simulateTrajectory(initX, initY, initVx, initVy, maxSteps = 450) {
    const traj = [];
    let x = initX;
    let y = initY;
    let vx = initVx;
    let vy = initVy;
    const dt = 0.4;

    for (let step = 0; step < maxSteps; step++) {
      traj.push({ x, y });

      // RK4 4단계 적분
      const a1 = getAcceleration(x, y);

      const k1_vx = a1.ax * dt;
      const k1_vy = a1.ay * dt;
      const k1_x = vx * dt;
      const k1_y = vy * dt;

      const a2 = getAcceleration(x + k1_x * 0.5, y + k1_y * 0.5);
      const k2_vx = a2.ax * dt;
      const k2_vy = a2.ay * dt;
      const k2_x = (vx + k1_vx * 0.5) * dt;
      const k2_y = (vy + k1_vy * 0.5) * dt;

      const a3 = getAcceleration(x + k2_x * 0.5, y + k2_y * 0.5);
      const k3_vx = a3.ax * dt;
      const k3_vy = a3.ay * dt;
      const k3_x = (vx + k2_vx * 0.5) * dt;
      const k3_y = (vy + k2_vy * 0.5) * dt;

      const a4 = getAcceleration(x + k3_x, y + k3_y);
      const k4_vx = a4.ax * dt;
      const k4_vy = a4.ay * dt;
      const k4_x = (vx + k3_vx) * dt;
      const k4_y = (vy + k3_vy) * dt;

      x += (k1_x + 2 * k2_x + 2 * k3_x + k4_x) / 6;
      y += (k1_y + 2 * k2_y + 2 * k3_y + k4_y) / 6;
      vx += (k1_vx + 2 * k2_vx + 2 * k3_vx + k4_vx) / 6;
      vy += (k1_vy + 2 * k2_vy + 2 * k3_vy + k4_vy) / 6;

      // 목표 기지 도달 판정
      if (Math.hypot(x - targetPos.x, y - targetPos.y) < targetPos.r) {
        traj.push({ x, y, hitTarget: true });
        break;
      }

      // 행성 충돌 판정
      let crashed = false;
      for (let p of planets) {
        if (Math.hypot(x - p.x, y - p.y) < p.r) {
          traj.push({ x, y, crashed: true });
          crashed = true;
          break;
        }
      }
      if (crashed) break;

      // 화면 밖 멀리 탈출
      if (x < -100 || x > width + 100 || y < -100 || y > height + 100) break;
    }

    return traj;
  }

  // 폭발 파티클
  function createExplosion(x, y, color = '#f43f5e') {
    for (let i = 0; i < 40; i++) {
      const spd = Math.random() * 4.5 + 1;
      const ang = Math.random() * Math.PI * 2;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1.0,
        decay: 0.02 + Math.random() * 0.03,
        color
      });
    }
  }

  // --- 메인 물리 업데이트 ---
  function update() {
    if (gameState === 'FLYING' && probe) {
      // 1프레임당 3회 서브스텝 계산으로 궤도 정밀도 극대화
      const dt = 0.35;
      for (let s = 0; s < 3; s++) {
        const acc = getAcceleration(probe.x, probe.y);
        probe.vx += acc.ax * dt;
        probe.vy += acc.ay * dt;
        probe.x += probe.vx * dt;
        probe.y += probe.vy * dt;

        probe.path.push({ x: probe.x, y: probe.y });
        if (probe.path.length > 500) probe.path.shift();

        // 1. 목표 우주정거장 안착 성공 판정
        const distToTarget = Math.hypot(probe.x - targetPos.x, probe.y - targetPos.y);
        if (distToTarget <= targetPos.r) {
          gameState = 'SUCCESS';
          playSuccessSound();
          statusTitle.textContent = 'STATION DOCKED!';
          statusTitle.style.color = '#4ade80';
          statusSub.textContent = '[클릭]하여 다음 성계로 진입';
          statusBanner.style.display = 'block';
          hudStatus.textContent = 'MISSION ACCOMPLISHED';
          hudStatus.className = 'safe';
          createExplosion(targetPos.x, targetPos.y, '#38bdf8');
          break;
        }

        // 2. 행성 충돌 판정
        for (let p of planets) {
          const d = Math.hypot(probe.x - p.x, probe.y - p.y);
          if (d <= p.r) {
            gameState = 'CRASHED';
            playCrashSound();
            createExplosion(probe.x, probe.y, p.color);
            statusTitle.textContent = 'PROBE DESTROYED';
            statusTitle.style.color = '#f43f5e';
            statusSub.textContent = '[R] 또는 화면 클릭으로 재발사';
            statusBanner.style.display = 'block';
            hudStatus.textContent = 'COLLISION OCCURRED';
            hudStatus.className = 'warn';
            break;
          }

          // 행성 근일점 스침 효과음 트리거
          if (d < p.r * 1.5 && Math.random() < 0.08) {
            playAssistSound(Math.hypot(probe.vx, probe.vy));
          }
        }

        if (gameState !== 'FLYING') break;

        // 3. 우주 미아 탈출 판정
        if (probe.x < -150 || probe.x > width + 150 || probe.y < -150 || probe.y > height + 150) {
          gameState = 'CRASHED';
          statusTitle.textContent = 'LOST IN DEEP SPACE';
          statusTitle.style.color = '#f43f5e';
          statusSub.textContent = '[R] 또는 화면 클릭으로 재도전';
          statusBanner.style.display = 'block';
          hudStatus.textContent = 'OUT OF BOUNDS';
          hudStatus.className = 'warn';
          break;
        }
      }

      const currentSpeed = Math.hypot(probe.vx, probe.vy);
      hudVel.textContent = currentSpeed.toFixed(2);
    }

    // 파티클
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // --- 화면 렌더링 ---
  function draw() {
    ctx.fillStyle = '#020306';
    ctx.fillRect(0, 0, width, height);

    // 1. 별빛 배경
    ctx.fillStyle = '#f8fafc';
    stars.forEach(s => {
      ctx.globalAlpha = s.alpha;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1.0;

    // 2. 행성 중력 우물(Gravity Well) 동심원 등고선
    if (showGravityField) {
      planets.forEach(p => {
        ctx.lineWidth = 1;
        [1.8, 2.8, 4.2].forEach((factor, idx) => {
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = 0.06 / (idx + 1);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * factor, 0, Math.PI * 2);
          ctx.stroke();
        });
      });
      ctx.globalAlpha = 1.0;
    }

    // 3. 행성 본체 드로잉
    planets.forEach(p => {
      // 행성 대기 글로우
      const glow = ctx.createRadialGradient(p.x, p.y, p.r * 0.4, p.x, p.y, p.r * 1.6);
      glow.addColorStop(0, p.color);
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 1.6, 0, Math.PI * 2);
      ctx.fill();

      // 행성 코어
      ctx.fillStyle = p.isBlackHole ? '#030407' : p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // 질량 텍스트 HUD
      ctx.font = '10px "IBM Plex Mono", monospace';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`${p.mass} M☉`, p.x - 18, p.y + p.r + 14);
    });

    // 4. 목표 우주정거장 (회전하는 십자 와이어프레임)
    const timeSec = performance.now() * 0.001;
    ctx.save();
    ctx.translate(targetPos.x, targetPos.y);
    ctx.rotate(timeSec * 0.5);

    // 수신 원형 링
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, targetPos.r, 0, Math.PI * 2);
    ctx.stroke();

    // 십자 도킹 베이
    ctx.beginPath();
    ctx.moveTo(-targetPos.r * 1.3, 0);
    ctx.lineTo(targetPos.r * 1.3, 0);
    ctx.moveTo(0, -targetPos.r * 1.3);
    ctx.lineTo(0, targetPos.r * 1.3);
    ctx.stroke();

    ctx.restore();

    ctx.font = '700 11px "IBM Plex Mono", monospace';
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('STATION', targetPos.x - 24, targetPos.y + targetPos.r + 16);

    // 5. 발사대 (Launcher Base)
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 2.0;
    ctx.strokeRect(launcherPos.x - 10, launcherPos.y - 10, 20, 20);
    ctx.beginPath();
    ctx.arc(launcherPos.x, launcherPos.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#4ade80';
    ctx.fill();

    // 6. 조준 중일 때: 슬링샷 줄 & 실시간 예측 궤적 점선
    if (isDragging) {
      const pullDx = launcherPos.x - dragCurrent.x;
      const pullDy = launcherPos.y - dragCurrent.y;
      const pullPower = Math.hypot(pullDx, pullDy);

      // 슬링샷 탄성 줄
      ctx.strokeStyle = 'rgba(244, 63, 94, 0.7)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(launcherPos.x, launcherPos.y);
      ctx.lineTo(dragCurrent.x, dragCurrent.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // 발사 속도 벡터 변환
      const launchVx = pullDx * 0.065;
      const launchVy = pullDy * 0.065;

      // 미래 궤적 사전 시뮬레이션 계산
      const predictedTraj = simulateTrajectory(launcherPos.x, launcherPos.y, launchVx, launchVy);

      // 예상 궤적 곡선 렌더링
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([3, 5]);
      ctx.beginPath();
      for (let i = 0; i < predictedTraj.length; i++) {
        const pt = predictedTraj[i];
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
      ctx.setLineDash([]);

      // 예측 종착점 하이라이트
      if (predictedTraj.length > 0) {
        const lastPt = predictedTraj[predictedTraj.length - 1];
        ctx.fillStyle = lastPt.hitTarget ? '#4ade80' : (lastPt.crashed ? '#f43f5e' : '#38bdf8');
        ctx.beginPath();
        ctx.arc(lastPt.x, lastPt.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 7. 비행 중인 탐사선 본체 및 꼬리 궤적
    if (probe) {
      if (showTrace && probe.path.length > 1) {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let i = 0; i < probe.path.length; i++) {
          const pt = probe.path[i];
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
      }

      if (gameState !== 'CRASHED') {
        ctx.save();
        ctx.translate(probe.x, probe.y);
        const heading = Math.atan2(probe.vy, probe.vx);
        ctx.rotate(heading);

        // 아폴로 스타일 와이어프레임 캡슐
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(-6, -5);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-6, 5);
        ctx.closePath();
        ctx.stroke();

        ctx.restore();
      }
    }

    // 8. 파티클
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.fillRect(p.x, p.y, 2.5, 2.5);
    });
    ctx.globalAlpha = 1.0;
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // --- 사용자 입력 (슬링샷 드래그 앤 릴리즈) ---
  function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  canvas.addEventListener('mousedown', (e) => {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    if (gameState === 'SUCCESS') {
      loadLevel(currentLevelIdx + 1);
      return;
    }
    if (gameState === 'CRASHED') {
      loadLevel(currentLevelIdx);
      return;
    }

    const pos = getPointerPos(e);
    // 발사대 근처를 클릭했을 때 슬링샷 드래그 개시
    if (Math.hypot(pos.x - launcherPos.x, pos.y - launcherPos.y) < 45) {
      isDragging = true;
      dragStart = { ...launcherPos };
      dragCurrent = { ...pos };
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (isDragging) {
      dragCurrent = getPointerPos(e);
    }
  });

  window.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;

    const pullDx = launcherPos.x - dragCurrent.x;
    const pullDy = launcherPos.y - dragCurrent.y;
    const power = Math.hypot(pullDx, pullDy);

    if (power > 10) {
      attempts++;
      hudTries.textContent = attempts;
      gameState = 'FLYING';
      hudStatus.textContent = 'IN TRANSIT';
      hudStatus.className = '';

      probe = {
        x: launcherPos.x,
        y: launcherPos.y,
        vx: pullDx * 0.065,
        vy: pullDy * 0.065,
        path: []
      };

      playLaunchSound(power);
    }
  });

  // 터치 조작 대응
  canvas.addEventListener('touchstart', (e) => {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    if (gameState === 'SUCCESS') {
      loadLevel(currentLevelIdx + 1);
      return;
    }
    if (gameState === 'CRASHED') {
      loadLevel(currentLevelIdx);
      return;
    }

    const pos = getPointerPos(e);
    if (Math.hypot(pos.x - launcherPos.x, pos.y - launcherPos.y) < 55) {
      isDragging = true;
      dragStart = { ...launcherPos };
      dragCurrent = { ...pos };
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (isDragging) {
      dragCurrent = getPointerPos(e);
    }
  }, { passive: true });

  canvas.addEventListener('touchend', () => {
    if (!isDragging) return;
    isDragging = false;

    const pullDx = launcherPos.x - dragCurrent.x;
    const pullDy = launcherPos.y - dragCurrent.y;
    const power = Math.hypot(pullDx, pullDy);

    if (power > 10) {
      attempts++;
      hudTries.textContent = attempts;
      gameState = 'FLYING';
      hudStatus.textContent = 'IN TRANSIT';
      hudStatus.className = '';

      probe = {
        x: launcherPos.x,
        y: launcherPos.y,
        vx: pullDx * 0.065,
        vy: pullDy * 0.065,
        path: []
      };

      playLaunchSound(power);
    }
  });

  // 단축키 및 컨트롤 바인딩
  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyR') loadLevel(currentLevelIdx);
    if (e.code === 'Space') {
      if (gameState === 'SUCCESS') loadLevel(currentLevelIdx + 1);
      else if (gameState === 'CRASHED') loadLevel(currentLevelIdx);
    }
  });

  btnRestart.addEventListener('click', () => loadLevel(currentLevelIdx));
  btnPrev.addEventListener('click', () => loadLevel(currentLevelIdx - 1));
  btnNext.addEventListener('click', () => loadLevel(currentLevelIdx + 1));

  btnGravityField.addEventListener('click', () => {
    showGravityField = !showGravityField;
    btnGravityField.classList.toggle('active', showGravityField);
  });

  btnTrace.addEventListener('click', () => {
    showTrace = !showTrace;
    btnTrace.classList.toggle('active', showTrace);
  });

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initStars();
    loadLevel(currentLevelIdx);
  });

  // 초기화 및 가동
  initStars();
  loadLevel(0);
  requestAnimationFrame(loop);
</script>

</body>
</html>
