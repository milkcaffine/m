<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Marsko lab tool — kaleido. 사진을 거울로 접어 돌리는 실시간 만화경.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/marsko-hud.css">
  <meta name="theme-color" content="#09090b">
  <title>만화경 // marsko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      background: #09090b;
      color: #e4e4e7;
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
    }
    .container {
      background: #18181b;
      border: 1px solid #27272a;
      max-width: 680px;
      width: 100%;
      border-radius: 20px;
      padding: 20px 16px 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .back { text-align: center; margin-bottom: 12px; }
    .back a {
      color: #64748b;
      text-decoration: none;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
    }
    .back a:hover { color: #c4b5fd; }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.04em;
      color: #f5f3ff;
    }
    p.sub {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      color: #a1a1aa;
      text-align: center;
      margin: 6px 0 16px;
    }
    .dropzone {
      border: 2px dashed #6d28d9;
      background: #120c1c;
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      color: #c4b5fd;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .dropzone.compact { padding: 10px 12px; font-size: 0.85rem; }
    .dropzone:hover, .dropzone.hot { background: #1c1230; border-color: #c4b5fd; }
    .dropzone small { font-size: 0.72rem; color: #a78bfa; font-weight: 500; }
    input[type="file"] { display: none; }

    #stage { margin-top: 14px; }
    .canvas-wrap {
      width: 100%;
      background:
        radial-gradient(circle at 50% 45%, #1c1430 0%, #09090b 72%);
      border: 1px solid #27272a;
      border-radius: 16px;
      overflow: hidden;
      line-height: 0;
      touch-action: none;
      cursor: grab;
    }
    .canvas-wrap:active { cursor: grabbing; }
    #view { width: 100%; height: auto; display: block; }

    .hint {
      margin-top: 8px;
      text-align: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      color: #71717a;
    }

    .panel {
      margin-top: 12px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.86rem;
      font-weight: 650;
      color: #d4d4d8;
    }
    .slider-box { display: flex; align-items: center; gap: 8px; }
    .slider-box input[type="range"] { width: 132px; accent-color: #a78bfa; }
    .slider-box span {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      color: #a1a1aa;
      width: 36px;
      text-align: right;
      font-weight: 500;
    }
    .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
    .tog, .mini {
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #d4d4d8;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .tog.active {
      border-color: #c4b5fd;
      background: rgba(167, 139, 250, 0.16);
      color: #ddd6fe;
    }
    .tog:hover, .mini:hover { border-color: #52525b; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btn {
      flex: 1 1 30%;
      min-height: 46px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      background: #6d28d9;
      color: #fff;
    }
    .btn:hover { background: #5b21b6; }
    .btn.ghost { background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46; }
    .btn.ghost:hover { background: #3f3f46; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="container">
  <div class="back"><a href="index.html">← marsko</a></div>
  <h1>만화경</h1>
  <p class="sub">사진을 거울로 접고, 끌고, 돌린다</p>

  <label class="dropzone" id="drop" for="file">
    사진 놓기 · 클릭 · 붙여넣기
    <small>브라우저 안에서만 접습니다. 업로드 없음</small>
    <input id="file" type="file" accept="image/*">
  </label>

  <div id="stage" hidden>
    <div class="canvas-wrap" id="wrap">
      <canvas id="view" width="800" height="800"></canvas>
    </div>
    <p class="hint">드래그로 창 이동 · 휠·핀치로 확대 · GIF는 화면 속도 그대로 반복</p>

    <div class="panel">
      <div class="row">
        <label for="slices">조각</label>
        <div class="slider-box">
          <input id="slices" type="range" min="2" max="24" step="1" value="8">
          <span id="slicesVal">8</span>
        </div>
      </div>
      <div class="row">
        <label for="zoom">확대</label>
        <div class="slider-box">
          <input id="zoom" type="range" min="30" max="280" step="1" value="100">
          <span id="zoomVal">1.0</span>
        </div>
      </div>
      <div class="row">
        <label for="speed">속도</label>
        <div class="slider-box">
          <input id="speed" type="range" min="0" max="100" step="1" value="28">
          <span id="speedVal">28</span>
        </div>
      </div>
      <div class="row">
        <label for="twist">어긋남</label>
        <div class="slider-box">
          <input id="twist" type="range" min="0" max="80" step="1" value="0">
          <span id="twistVal">0</span>
        </div>
      </div>
      <div class="toggles">
        <button type="button" class="tog active" id="mirrorBtn">거울</button>
        <button type="button" class="tog active" id="spinBtn">회전</button>
        <button type="button" class="tog" id="stainBtn">스테인드</button>
        <button type="button" class="mini" id="shuffleBtn">아무 접기</button>
        <button type="button" class="mini" id="sampleBtn">산책 사진</button>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn ghost" id="resetBtn">창 리셋</button>
      <button type="button" class="btn" id="saveBtn">PNG 저장</button>
      <button type="button" class="btn" id="gifBtn">GIF 저장</button>
    </div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d", { alpha: false });
  const stage = document.getElementById("stage");
  const drop = document.getElementById("drop");
  const fileInput = document.getElementById("file");

  const slicesInput = document.getElementById("slices");
  const zoomInput = document.getElementById("zoom");
  const speedInput = document.getElementById("speed");
  const twistInput = document.getElementById("twist");

  const state = {
    img: null,
    slices: 8,
    zoom: 1,
    panX: 0,
    panY: 0,
    rot: 0,
    spin: true,
    speed: 0.006,
    twist: 0,
    mirror: true,
    stain: false,
    dragging: false
  };

  let url = null;
  let raf = 0;
  const pointers = new Map();
  let pinchDist = 0;

  function readNum(el, fallback) {
    const n = Number(el.value);
    return Number.isFinite(n) ? n : fallback;
  }

  function syncLabels() {
    state.slices = readNum(slicesInput, 8);
    state.zoom = readNum(zoomInput, 100) / 100;
    state.twist = readNum(twistInput, 0);
    const speedUi = readNum(speedInput, 28);
    state.speed = (speedUi / 100) * 0.02;
    document.getElementById("slicesVal").textContent = String(state.slices);
    document.getElementById("zoomVal").textContent = state.zoom.toFixed(1);
    document.getElementById("speedVal").textContent = String(speedUi);
    document.getElementById("twistVal").textContent = String(state.twist);
  }

  function fitCanvas() {
    const css = Math.max(280, Math.round(canvas.parentElement.clientWidth));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const px = Math.round(css * dpr);
    if (canvas.width !== px) {
      canvas.width = px;
      canvas.height = px;
    }
  }

  function coverScale(size) {
    const img = state.img;
    if (!img) return 1;
    return (size * 0.92) / Math.min(img.width, img.height);
  }

  function paint(target, size, rot) {
    const img = state.img;
    const c = target;
    const angle = rot == null ? state.rot : rot;
    c.fillStyle = "#07060b";
    c.fillRect(0, 0, size, size);
    if (!img) return;

    const slices = Math.max(2, state.slices | 0);
    const wedge = (Math.PI * 2) / slices;
    const half = wedge / 2;
    const overlap = 0.02;
    const radius = size;
    const scale = coverScale(size) * state.zoom;
    const cx = size / 2;
    const cy = size / 2;
    const panScale = size / (canvas.width || size);

    for (let i = 0; i < slices; i++) {
      c.save();
      c.translate(cx, cy);
      c.rotate(angle + i * wedge);
      c.beginPath();
      c.moveTo(0, 0);
      c.arc(0, 0, radius, -half - overlap, half + overlap);
      c.closePath();
      c.clip();
      if (state.mirror && i % 2 === 1) c.scale(1, -1);
      const shift = state.twist * (size / 800);
      c.translate(state.panX * panScale + Math.cos(i * 1.7) * shift, state.panY * panScale + Math.sin(i * 1.3) * shift);
      if (state.stain) {
        c.filter = "hue-rotate(" + Math.round((i * 360) / slices) + "deg) saturate(1.35)";
      }
      c.scale(scale, scale);
      c.imageSmoothingEnabled = true;
      c.imageSmoothingQuality = "high";
      c.drawImage(img, -img.width / 2, -img.height / 2);
      c.restore();
      c.filter = "none";
    }

    const g = c.createRadialGradient(cx, cy, size * 0.22, cx, cy, size * 0.72);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,0.38)");
    c.fillStyle = g;
    c.fillRect(0, 0, size, size);

    c.fillStyle = "rgba(245,243,255,0.9)";
    c.beginPath();
    c.arc(cx, cy, Math.max(1.5, size * 0.0045), 0, Math.PI * 2);
    c.fill();
  }

  function frame() {
    raf = 0;
    fitCanvas();
    if (state.spin && !state.dragging && state.speed > 0) state.rot += state.speed;
    paint(ctx, canvas.width);
    if (state.img && (state.spin || state.dragging)) loop();
  }

  function loop() {
    if (!raf) raf = requestAnimationFrame(frame);
  }

  function kick() {
    syncLabels();
    stage.hidden = !state.img;
    drop.classList.toggle("compact", !!state.img);
    loop();
    if (!state.spin) frame();
  }

  function loadImage(src, revoke) {
    const image = new Image();
    image.onload = function () {
      if (url && url !== src) URL.revokeObjectURL(url);
      if (revoke) url = src;
      state.img = image;
      state.panX = 0;
      state.panY = 0;
      state.rot = 0;
      kick();
    };
    image.onerror = function () {
      if (revoke) URL.revokeObjectURL(src);
    };
    image.src = src;
  }

  function loadFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    loadImage(URL.createObjectURL(file), true);
  }

  fileInput.addEventListener("change", function () {
    const file = fileInput.files && fileInput.files[0];
    loadFile(file);
    fileInput.value = "";
  });

  ["dragenter", "dragover"].forEach(function (name) {
    drop.addEventListener(name, function (e) {
      e.preventDefault();
      drop.classList.add("hot");
    });
  });
  ["dragleave", "drop"].forEach(function (name) {
    drop.addEventListener(name, function (e) {
      e.preventDefault();
      drop.classList.remove("hot");
    });
  });
  drop.addEventListener("drop", function (e) {
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    loadFile(file);
  });
  document.addEventListener("paste", function (e) {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.startsWith("image/")) {
        loadFile(items[i].getAsFile());
        break;
      }
    }
  });

  document.getElementById("sampleBtn").addEventListener("click", function () {
    loadImage("images/walks/HUcF0LjaUAAlrim.jpg", false);
  });

  [slicesInput, zoomInput, speedInput, twistInput].forEach(function (el) {
    el.addEventListener("input", kick);
  });

  document.getElementById("mirrorBtn").addEventListener("click", function () {
    state.mirror = !state.mirror;
    this.classList.toggle("active", state.mirror);
    kick();
  });
  document.getElementById("spinBtn").addEventListener("click", function () {
    state.spin = !state.spin;
    this.classList.toggle("active", state.spin);
    kick();
  });
  document.getElementById("stainBtn").addEventListener("click", function () {
    state.stain = !state.stain;
    this.classList.toggle("active", state.stain);
    kick();
  });
  document.getElementById("shuffleBtn").addEventListener("click", function () {
    const even = 2 + Math.floor(Math.random() * 10) * 2;
    slicesInput.value = String(even);
    zoomInput.value = String(60 + Math.floor(Math.random() * 140));
    twistInput.value = String(Math.floor(Math.random() * 55));
    speedInput.value = String(10 + Math.floor(Math.random() * 50));
    state.panX = (Math.random() - 0.5) * 180;
    state.panY = (Math.random() - 0.5) * 180;
    state.rot = Math.random() * Math.PI * 2;
    state.stain = Math.random() > 0.55;
    state.mirror = Math.random() > 0.2;
    document.getElementById("stainBtn").classList.toggle("active", state.stain);
    document.getElementById("mirrorBtn").classList.toggle("active", state.mirror);
    kick();
  });
  document.getElementById("resetBtn").addEventListener("click", function () {
    state.panX = 0;
    state.panY = 0;
    state.rot = 0;
    zoomInput.value = "100";
    twistInput.value = "0";
    kick();
  });

  function footerHeight(art) {
    return Math.max(26, Math.round(art * 0.042));
  }

  function drawMark(c, art, footer) {
    c.fillStyle = "#09090b";
    c.fillRect(0, art, art, footer);
    c.fillStyle = "#e4e4e7";
    c.font = "600 " + Math.round(footer * 0.4) + "px \"IBM Plex Mono\", ui-monospace, monospace";
    c.textAlign = "center";
    c.textBaseline = "middle";
    if ("letterSpacing" in c) c.letterSpacing = "0.1em";
    c.fillText("marsko.art", art / 2, art + footer / 2 + 0.5);
    if ("letterSpacing" in c) c.letterSpacing = "0px";
  }

  function makeExportCanvas(art) {
    const footer = footerHeight(art);
    const out = document.createElement("canvas");
    out.width = art;
    out.height = art + footer;
    const octx = out.getContext("2d", { alpha: false, willReadFrequently: true });
    return { out: out, octx: octx, art: art, footer: footer };
  }

  function renderCard(card, rot) {
    paint(card.octx, card.art, rot);
    drawMark(card.octx, card.art, card.footer);
  }

  function downloadBlob(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2500);
  }

  async function ensureMarkFont() {
    if (document.fonts && document.fonts.load) {
      try { await document.fonts.load("600 28px \"IBM Plex Mono\""); } catch (err) {}
    }
  }

  function ByteBuf() {
    this.a = new Uint8Array(4096);
    this.n = 0;
  }
  ByteBuf.prototype.need = function (extra) {
    if (this.n + extra <= this.a.length) return;
    let cap = this.a.length;
    while (this.n + extra > cap) cap *= 2;
    const next = new Uint8Array(cap);
    next.set(this.a.subarray(0, this.n));
    this.a = next;
  };
  ByteBuf.prototype.u8 = function (v) {
    this.need(1);
    this.a[this.n++] = v & 255;
  };
  ByteBuf.prototype.u16 = function (v) {
    this.need(2);
    this.a[this.n++] = v & 255;
    this.a[this.n++] = (v >> 8) & 255;
  };
  ByteBuf.prototype.bytes = function (list) {
    this.need(list.length);
    this.a.set(list, this.n);
    this.n += list.length;
  };
  ByteBuf.prototype.ascii = function (s) {
    for (let i = 0; i < s.length; i++) this.u8(s.charCodeAt(i));
  };
  ByteBuf.prototype.finish = function () {
    return this.a.slice(0, this.n);
  };

  function quantize(rgba) {
    const pixelCount = rgba.length >>> 2;
    const paletteSize = 256;
    const imageColors = 96;
    const sampleCount = Math.min(pixelCount, 20000);
    const sampleStep = Math.max(1, Math.floor(pixelCount / sampleCount));
    const sampled = [];
    for (let i = 0; i < pixelCount; i += sampleStep) sampled.push(i);
    const order = new Uint32Array(sampled);
    const boxes = [{ lo: 0, hi: order.length }];

    function biggest() {
      let pick = -1;
      let best = 0;
      let channel = 0;
      for (let b = 0; b < boxes.length; b++) {
        const box = boxes[b];
        const len = box.hi - box.lo;
        if (len < 2) continue;
        let r0 = 255, r1 = 0, g0 = 255, g1 = 0, b0 = 255, b1 = 0;
        for (let i = box.lo; i < box.hi; i++) {
          const p = order[i] << 2;
          const r = rgba[p], g = rgba[p + 1], bl = rgba[p + 2];
          if (r < r0) r0 = r;
          if (r > r1) r1 = r;
          if (g < g0) g0 = g;
          if (g > g1) g1 = g;
          if (bl < b0) b0 = bl;
          if (bl > b1) b1 = bl;
        }
        const rd = r1 - r0, gd = g1 - g0, bd = b1 - b0;
        let ch = 0, range = rd;
        if (gd > range) { ch = 1; range = gd; }
        if (bd > range) { ch = 2; range = bd; }
        const score = range * len;
        if (score > best) { best = score; pick = b; channel = ch; }
      }
      return { pick: pick, channel: channel };
    }

    while (boxes.length < imageColors) {
      const found = biggest();
      if (found.pick < 0) break;
      const box = boxes[found.pick];
      const slice = order.subarray(box.lo, box.hi);
      const ch = found.channel;
      slice.sort(function (a, b) {
        return rgba[(a << 2) + ch] - rgba[(b << 2) + ch];
      });
      const mid = box.lo + ((box.hi - box.lo) >> 1);
      boxes.splice(found.pick, 1, { lo: box.lo, hi: mid }, { lo: mid, hi: box.hi });
    }

    const palette = new Uint8Array(paletteSize * 3);
    palette[0] = 9; palette[1] = 9; palette[2] = 11;
    palette[3] = 228; palette[4] = 228; palette[5] = 231;
    const centers = new Uint8Array(boxes.length * 3);
    for (let b = 0; b < boxes.length; b++) {
      const box = boxes[b];
      let r = 0, g = 0, bl = 0;
      const n = box.hi - box.lo || 1;
      for (let i = box.lo; i < box.hi; i++) {
        const p = order[i] << 2;
        r += rgba[p];
        g += rgba[p + 1];
        bl += rgba[p + 2];
      }
      const o = b * 3;
      centers[o] = palette[(b + 2) * 3] = Math.round(r / n);
      centers[o + 1] = palette[(b + 2) * 3 + 1] = Math.round(g / n);
      centers[o + 2] = palette[(b + 2) * 3 + 2] = Math.round(bl / n);
    }

    const lut = new Uint8Array(32768);
    const nColors = boxes.length;
    for (let r = 0; r < 32; r++) {
      const rr = r << 3;
      for (let g = 0; g < 32; g++) {
        const gg = g << 3;
        const base = (r << 10) | (g << 5);
        for (let b = 0; b < 32; b++) {
          const bb = b << 3;
          let best = 0;
          let bestD = 1e9;
          for (let c = 0; c < nColors; c++) {
            const o = c * 3;
            const dr = rr - centers[o];
            const dg = gg - centers[o + 1];
            const db = bb - centers[o + 2];
            const d = dr * dr + dg * dg + db * db;
            if (d < bestD) { bestD = d; best = c; }
          }
          lut[base | b] = best + 2;
        }
      }
    }

    const indexed = new Uint8Array(pixelCount);
    for (let i = 0; i < pixelCount; i++) {
      const p = i << 2;
      indexed[i] = lut[((rgba[p] >> 3) << 10) | ((rgba[p + 1] >> 3) << 5) | (rgba[p + 2] >> 3)];
    }
    return { palette: palette, indexed: indexed };
  }

  function stampMark(indexed, rgba, width, height, art) {
    for (let y = art; y < height; y++) {
      const row = y * width;
      for (let x = 0; x < width; x++) {
        const i = row + x;
        const p = i << 2;
        indexed[i] = (rgba[p] + rgba[p + 1] + rgba[p + 2]) > 420 ? 1 : 0;
      }
    }
  }

  function lzwEncode(buf, pixels) {
    const initCodeSize = 8;
    const BITS = 12;
    const hsize = 5003;
    const htab = new Int32Array(hsize);
    const codetab = new Int32Array(hsize);
    htab.fill(-1);
    const accum = new Uint8Array(256);
    const MASKS = [0, 1, 3, 7, 15, 31, 63, 127, 255, 511, 1023, 2047, 4095, 8191, 16383, 32767, 65535];
    let curAccum = 0;
    let curBits = 0;
    const gInitBits = initCodeSize + 1;
    let clearFlag = false;
    let nBits = gInitBits;
    let maxcode = (1 << nBits) - 1;
    const clearCode = 1 << initCodeSize;
    const eofCode = clearCode + 1;
    let freeEnt = clearCode + 2;
    let packet = 0;

    let hshift = 0;
    for (let fcode = hsize; fcode < 65536; fcode *= 2) hshift++;
    hshift = 8 - hshift;

    function emitByte(value) {
      accum[packet++] = value & 255;
      if (packet >= 254) {
        buf.u8(packet);
        buf.bytes(accum.subarray(0, packet));
        packet = 0;
      }
    }

    function output(code) {
      curAccum &= MASKS[curBits];
      if (curBits > 0) curAccum |= code << curBits;
      else curAccum = code;
      curBits += nBits;
      while (curBits >= 8) {
        emitByte(curAccum);
        curAccum >>= 8;
        curBits -= 8;
      }
      if (freeEnt > maxcode || clearFlag) {
        if (clearFlag) {
          nBits = gInitBits;
          maxcode = (1 << nBits) - 1;
          clearFlag = false;
        } else {
          nBits++;
          maxcode = nBits === BITS ? (1 << nBits) : (1 << nBits) - 1;
        }
      }
      if (code === eofCode) {
        while (curBits > 0) {
          emitByte(curAccum);
          curAccum >>= 8;
          curBits -= 8;
        }
        if (packet > 0) {
          buf.u8(packet);
          buf.bytes(accum.subarray(0, packet));
          packet = 0;
        }
        buf.u8(0);
      }
    }

    buf.u8(initCodeSize);
    output(clearCode);
    let ent = pixels[0];
    for (let idx = 1; idx < pixels.length; idx++) {
      const c = pixels[idx];
      const fcode = (c << BITS) + ent;
      let i = (c << hshift) ^ ent;
      if (htab[i] === fcode) {
        ent = codetab[i];
        continue;
      }
      const disp = i === 0 ? 1 : hsize - i;
      let found = false;
      while (htab[i] >= 0) {
        i -= disp;
        if (i < 0) i += hsize;
        if (htab[i] === fcode) {
          ent = codetab[i];
          found = true;
          break;
        }
      }
      if (found) continue;
      output(ent);
      ent = c;
      if (freeEnt < (1 << BITS)) {
        codetab[i] = freeEnt++;
        htab[i] = fcode;
      } else {
        htab.fill(-1);
        freeEnt = clearCode + 2;
        clearFlag = true;
        output(clearCode);
      }
    }
    output(ent);
    output(eofCode);
  }

  function writeGifFrame(buf, indexed, palette, width, height, delayCs) {
    buf.u8(0x21); buf.u8(0xf9); buf.u8(0x04);
    buf.u8(0x04);
    buf.u16(delayCs);
    buf.u8(0);
    buf.u8(0);
    buf.u8(0x2c);
    buf.u16(0); buf.u16(0);
    buf.u16(width); buf.u16(height);
    buf.u8(0x87);
    buf.bytes(palette);
    lzwEncode(buf, indexed);
  }

  function gifHeader(buf, width, height) {
    buf.ascii("GIF89a");
    buf.u16(width);
    buf.u16(height);
    buf.u8(0);
    buf.u8(0);
    buf.u8(0);
    buf.u8(0x21); buf.u8(0xff); buf.u8(11);
    buf.ascii("NETSCAPE2.0");
    buf.u8(3); buf.u8(1);
    buf.u16(0);
    buf.u8(0);
  }

  let exporting = false;

  document.getElementById("saveBtn").addEventListener("click", async function () {
    if (!state.img || exporting) return;
    exporting = true;
    const btn = this;
    btn.disabled = true;
    try {
      await ensureMarkFont();
      const card = makeExportCanvas(1600);
      renderCard(card, state.rot);
      const blob = await new Promise(function (resolve) { card.out.toBlob(resolve, "image/png"); });
      if (blob) downloadBlob(blob, "kaleido.png");
    } catch (err) {
      console.error(err);
    } finally {
      exporting = false;
      btn.disabled = false;
    }
  });

  document.getElementById("gifBtn").addEventListener("click", async function () {
    if (!state.img || exporting) return;
    exporting = true;
    const btn = this;
    const pngBtn = document.getElementById("saveBtn");
    btn.disabled = true;
    pngBtn.disabled = true;
    // 화면과 같은 속도로, 패턴이 정확히 반복되는 각도만큼만 돌려 이음매 없는 루프를 만든다.
    const wedge = (Math.PI * 2) / Math.max(2, state.slices | 0);
    const symmetric = state.twist === 0 && !state.stain;
    let period = Math.PI * 2;
    if (symmetric) {
      if (!state.mirror) period = wedge;
      else if ((state.slices | 0) % 2 === 0) period = wedge * 2;
    }
    const radPerSec = (state.speed > 0 ? state.speed : 0.0056) * 60;
    const seconds = period / radPerSec;
    const frames = Math.max(12, Math.min(48, Math.round(seconds * 20)));
    const delayCs = Math.max(2, Math.round((seconds * 100) / frames));
    try {
      await ensureMarkFont();
      const card = makeExportCanvas(512);
      const buf = new ByteBuf();
      gifHeader(buf, card.out.width, card.out.height);
      const base = state.rot;
      for (let i = 0; i < frames; i++) {
        btn.textContent = "GIF " + (i + 1) + "/" + frames;
        renderCard(card, base + (i / frames) * period);
        const pixels = card.octx.getImageData(0, 0, card.out.width, card.out.height).data;
        const q = quantize(pixels);
        stampMark(q.indexed, pixels, card.out.width, card.out.height, card.art);
        writeGifFrame(buf, q.indexed, q.palette, card.out.width, card.out.height, delayCs);
        await new Promise(function (resolve) { setTimeout(resolve, 0); });
      }
      buf.u8(0x3b);
      downloadBlob(new Blob([buf.finish()], { type: "image/gif" }), "kaleido.gif");
    } catch (err) {
      console.error(err);
    } finally {
      exporting = false;
      btn.disabled = false;
      pngBtn.disabled = false;
      btn.textContent = "GIF 저장";
    }
  });

  function canvasPointDelta(e, last) {
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width;
    const sy = canvas.height / rect.height;
    return {
      x: (e.clientX - last.x) * sx,
      y: (e.clientY - last.y) * sy
    };
  }

  const wrap = document.getElementById("wrap");
  wrap.addEventListener("pointerdown", function (e) {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    state.dragging = true;
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }
  });
  wrap.addEventListener("pointermove", function (e) {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    if (pointers.size >= 2) {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const pts = Array.from(pointers.values());
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchDist > 0) {
        const next = Math.min(280, Math.max(30, Math.round(readNum(zoomInput, 100) * (dist / pinchDist))));
        zoomInput.value = String(next);
      }
      pinchDist = dist;
      kick();
      return;
    }
    const d = canvasPointDelta(e, prev);
    state.panX += d.x;
    state.panY += d.y;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    kick();
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchDist = 0;
    if (pointers.size === 0) state.dragging = false;
    kick();
  }
  wrap.addEventListener("pointerup", endPointer);
  wrap.addEventListener("pointercancel", endPointer);
  wrap.addEventListener("wheel", function (e) {
    e.preventDefault();
    const next = Math.min(280, Math.max(30, readNum(zoomInput, 100) + (e.deltaY < 0 ? 8 : -8)));
    zoomInput.value = String(next);
    kick();
  }, { passive: false });

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" && e.target === document.body) {
      e.preventDefault();
      document.getElementById("spinBtn").click();
    }
  });
  window.addEventListener("resize", kick);

  loadImage("images/walks/HUcF0LjaUAAlrim.jpg", false);
})();
</script>
