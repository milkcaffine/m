<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0f14">
  <title>프로시저럴 키보드 사운드 // marsko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Apple SD Gothic Neo", sans-serif;
      background: #090b10;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 14px;
      min-height: 100vh;
    }
    .container {
      background: #11141c;
      border: 1px solid #1f2738;
      max-width: 620px;
      width: 100%;
      border-radius: 24px;
      padding: 20px 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 헤더 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #1a2233;
    }
    .header-left { display: flex; flex-direction: column; gap: 2px; }
    .home-link {
      color: #64748b;
      font-size: 0.75rem;
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
    }
    .home-link:hover { color: #00f0ff; }
    h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.05rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.5px;
    }
    .engine-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #00f0ff;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.25);
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* 사운드 프로필 */
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .profile-btn {
      background: #161c28;
      border: 1px solid #232c3e;
      color: #94a3b8;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.15s ease;
      text-align: left;
    }
    .profile-btn:hover { background: #1c2434; color: #cbd5e1; }
    .profile-btn.active {
      background: rgba(0, 240, 255, 0.1);
      border-color: #00f0ff;
      color: #00f0ff;
    }
    .profile-icon { font-size: 1.1rem; }
    .profile-text { display: flex; flex-direction: column; line-height: 1.25; }
    .profile-text small {
      font-size: 0.64rem;
      font-family: 'IBM Plex Mono', monospace;
      opacity: 0.75;
      margin-top: 2px;
    }

    /* 컨트롤 슬라이더 & 토글 */
    .control-strip {
      background: #141924;
      border: 1px solid #1e2638;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-family: 'IBM Plex Mono', monospace;
      color: #829ab1;
    }
    .control-item input[type="range"] {
      width: 75px;
      height: 4px;
      accent-color: #00f0ff;
      background: #232d40;
      cursor: pointer;
    }
    .control-item label { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }

    /* 타자 입력 공간 */
    .typing-card {
      background: #090b10;
      border: 1px solid #1f2738;
      border-radius: 14px;
      padding: 14px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .typing-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: #627d98;
      padding-bottom: 8px;
      border-bottom: 1px solid #161c28;
      flex-wrap: wrap;
      gap: 6px;
    }
    .meta-tags { display: flex; gap: 10px; }
    .meta-tags span strong { color: #00f0ff; }

    .meta-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .save-indicator {
      color: #00f0ff;
      font-weight: 600;
      opacity: 0.8;
    }
    .btn-meta {
      background: #161c28;
      border: 1px solid #232d40;
      color: #94a3b8;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-meta:hover {
      color: #e2e8f0;
      border-color: #3b465a;
      background: #1c2434;
    }
    .btn-meta.btn-danger:hover {
      color: #ff4d6d;
      border-color: #ff4d6d;
    }

    /* 에디터 뷰포트 컨테이너 */
    .editor-wrapper {
      position: relative;
      width: 100%;
      height: 280px;
      overflow: hidden;
    }

    #typingArea {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.95rem;
      line-height: 28px; /* 엄밀한 라인 높이 */
      resize: none;
      overflow-y: scroll;
      scroll-behavior: smooth;
    }
    #typingArea::placeholder {
      color: #3b465a;
    }

    /* 타자기 모드 활성화 시 중앙 가이드 라인 (은은한 수평선) */
    .typewriter-guide {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0, 240, 255, 0.12);
      pointer-events: none;
      display: none;
    }
    .typewriter-guide.active {
      display: block;
    }

    /* 텍스트 좌표 계산용 미러 엘리먼트 (화면 밖 렌더링) */
    #textMirror {
      position: absolute;
      visibility: hidden;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.95rem;
      line-height: 28px;
      top: -9999px;
      left: -9999px;
      pointer-events: none;
    }

    /* 모바일/터치용 테스트 키 바 */
    .touch-test-bar {
      display: flex;
      gap: 6px;
    }
    .touch-key {
      flex: 1;
      background: #161c28;
      border: 1px solid #232d40;
      color: #cbd5e1;
      padding: 8px 4px;
      border-radius: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
      user-select: none;
    }
    .touch-key:active {
      background: #00f0ff;
      color: #090b10;
      transform: translateY(1px);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-left">
      <a href="index.html" class="home-link">← marsko</a>
      <h1>KEYSTROKE SYNTH</h1>
    </div>
    <span class="engine-badge" id="engineStatus">100% PROCEDURAL</span>
  </header>

  <!-- 4가지 사운드 프로필 -->
  <div class="profile-grid" id="profileGrid">
    <button type="button" class="profile-btn active" data-profile="vintage">
      <span class="profile-icon">📜</span>
      <div class="profile-text">
        <span>빈티지 타자기</span>
        <small>CLACK & ENTER BELL</small>
      </div>
    </button>
    <button type="button" class="profile-btn" data-profile="thock">
      <span class="profile-icon">🪵</span>
      <div class="profile-text">
        <span>윤활 폼떡 기계식</span>
        <small>CREAMY DEEP THOCK</small>
      </div>
    </button>
    <button type="button" class="profile-btn" data-profile="clicky">
      <span class="profile-icon">⚡</span>
      <div class="profile-text">
        <span>청축 클릭키</span>
        <small>CRISP TACTILE LEAF</small>
      </div>
    </button>
    <button type="button" class="profile-btn" data-profile="silent">
      <span class="profile-icon">☁️</span>
      <div class="profile-text">
        <span>저소음 펠트 패드</span>
        <small>SOFT DAMPENED TAP</small>
      </div>
    </button>
  </div>

  <!-- 컨트롤 바 -->
  <div class="control-strip">
    <div class="control-item">
      <span>VOLUME</span>
      <input type="range" id="volRange" min="0" max="100" value="75">
      <span id="volVal">75%</span>
    </div>
    <div class="control-item">
      <span>PITCH JITTER</span>
      <input type="range" id="jitterRange" min="0" max="50" value="25">
      <span id="jitterVal">±2.5%</span>
    </div>
    <div class="control-item">
      <label>
        <input type="checkbox" id="bellCheck" checked style="accent-color:#00f0ff;">
        <span>엔터 벨 (Ding)</span>
      </label>
    </div>
    <div class="control-item">
      <label>
        <input type="checkbox" id="typewriterScrollCheck" checked style="accent-color:#00f0ff;">
        <span style="color:#00f0ff; font-weight:600;">타자기 중앙 스크롤</span>
      </label>
    </div>
  </div>

  <!-- 집필 타이핑 영역 -->
  <div class="typing-card">
    <div class="typing-meta">
      <div class="meta-tags">
        <span>CHARS: <strong id="charCount">0</strong></span>
        <span>WORDS: <strong id="wordCount">0</strong></span>
        <span>SPEED: <strong id="wpmCount">0</strong> WPM</span>
      </div>
      <div class="meta-actions">
        <span class="save-indicator" id="saveStatus">AUTOSAVED</span>
        <button type="button" class="btn-meta" id="downloadBtn" title="텍스트 파일로 저장">⬇ TXT</button>
        <button type="button" class="btn-meta btn-danger" id="clearBtn" title="내용 모두 지우기">✕ CLEAR</button>
      </div>
    </div>
    
    <div class="editor-wrapper">
      <div class="typewriter-guide active" id="typewriterGuide"></div>
      <textarea id="typingArea" placeholder="여기에 글을 써내려가 보세요...&#10;&#10;* 타자기 모드가 켜져 있으면 커서가 항상 화면 정중앙 높이에 머물며 종이가 올라옵니다.&#10;* 브라우저 내부에 글이 실시간 영구 자동 저장됩니다."></textarea>
    </div>
  </div>

  <!-- 좌표 계산용 히든 미러 -->
  <div id="textMirror"></div>

  <!-- 모바일/터치용 테스트 키 바 -->
  <div class="touch-test-bar">
    <button type="button" class="touch-key" data-key="KeyA">A (타건)</button>
    <button type="button" class="touch-key" data-key="Space">Space (울림)</button>
    <button type="button" class="touch-key" data-key="Enter">Enter (개행)</button>
    <button type="button" class="touch-key" data-key="Backspace">⌫ Delete</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'marsko_keystroke_memo_v1';
  let audioCtx = null;
  let masterGain = null;
  let currentProfile = 'vintage';

  const typingArea = document.getElementById('typingArea');
  const textMirror = document.getElementById('textMirror');
  const typewriterGuide = document.getElementById('typewriterGuide');
  const typewriterScrollCheck = document.getElementById('typewriterScrollCheck');

  const profileGrid = document.getElementById('profileGrid');
  const volRange = document.getElementById('volRange');
  const volVal = document.getElementById('volVal');
  const jitterRange = document.getElementById('jitterRange');
  const jitterVal = document.getElementById('jitterVal');
  const bellCheck = document.getElementById('bellCheck');
  const charCount = document.getElementById('charCount');
  const wordCount = document.getElementById('wordCount');
  const wpmCount = document.getElementById('wpmCount');
  const saveStatus = document.getElementById('saveStatus');
  const downloadBtn = document.getElementById('downloadBtn');
  const clearBtn = document.getElementById('clearBtn');

  let keystrokeTimes = [];
  let saveTimeout = null;

  // --- 타자기식 중앙 스크롤 엔진 (Typewriter Scrolling) ---
  function updateTypewriterScroll() {
    if (!typewriterScrollCheck.checked) {
      typingArea.style.paddingTop = '10px';
      typingArea.style.paddingBottom = '10px';
      typewriterGuide.classList.remove('active');
      return;
    }

    typewriterGuide.classList.add('active');

    // 에디터 뷰포트의 절반 높이를 패딩으로 설정해 첫 줄과 마지막 줄도 중앙에 오도록 세팅
    const halfHeight = typingArea.clientHeight / 2;
    typingArea.style.paddingTop = `${halfHeight}px`;
    typingArea.style.paddingBottom = `${halfHeight}px`;

    // 커서 위치까지의 텍스트 높이 계산
    const cursorIndex = typingArea.selectionStart;
    const textUpToCursor = typingArea.value.substring(0, cursorIndex);

    // 미러 DOM의 너비를 실제 텍스트영역과 똑같이 동기화
    textMirror.style.width = `${typingArea.clientWidth}px`;
    textMirror.textContent = textUpToCursor;

    // 커서 위치 표시용 스팬 추가
    const marker = document.createElement('span');
    marker.textContent = '|';
    textMirror.appendChild(marker);

    // 마커의 오프셋 탑 좌표 추출
    const cursorTop = marker.offsetTop;

    // 커서가 뷰포트 정중앙(halfHeight)에 정확히 오도록 스크롤 위치 보정
    // scrollHeight = paddingTop(halfHeight) + cursorTop - halfHeight = cursorTop
    const targetScrollTop = cursorTop;
    typingArea.scrollTop = targetScrollTop;
  }

  typewriterScrollCheck.addEventListener('change', () => {
    updateTypewriterScroll();
    typingArea.focus();
  });

  // --- 저장 기능 (LocalStorage) ---
  function loadSavedContent() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) {
        typingArea.value = saved;
        updateCounts();
        setTimeout(updateTypewriterScroll, 50);
      }
    } catch (e) {
      console.warn('저장된 내용 불러오기 실패:', e);
    }
  }

  function saveContent() {
    saveStatus.textContent = 'SAVING...';
    saveStatus.style.opacity = '0.5';

    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, typingArea.value);
        saveStatus.textContent = 'AUTOSAVED';
        saveStatus.style.opacity = '0.8';
      } catch (e) {
        console.error('저장 실패:', e);
        saveStatus.textContent = 'ERROR';
      }
    }, 250);
  }

  // TXT 파일 다운로드
  downloadBtn.addEventListener('click', () => {
    const text = typingArea.value;
    if (!text.trim()) {
      alert('저장할 텍스트가 없습니다.');
      return;
    }
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    const now = new Date();
    const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
    link.href = URL.createObjectURL(blob);
    link.download = `keystroke_${dateStr}.txt`;
    link.click();
    URL.revokeObjectURL(link.href);
  });

  // 내용 초기화
  clearBtn.addEventListener('click', () => {
    if (!typingArea.value.trim()) return;
    if (confirm('작성 중인 내용을 모두 지우시겠습니까?')) {
      typingArea.value = '';
      saveContent();
      updateCounts();
      updateTypewriterScroll();
      typingArea.focus();
    }
  });

  // --- Web Audio 엔진 초기화 ---
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = parseInt(volRange.value, 10) / 100;
    masterGain.connect(audioCtx.destination);
  }

  volRange.addEventListener('input', (e) => {
    volVal.textContent = e.target.value + '%';
    if (masterGain && audioCtx) {
      masterGain.gain.setTargetAtTime(parseInt(e.target.value, 10) / 100, audioCtx.currentTime, 0.03);
    }
  });

  jitterRange.addEventListener('input', (e) => {
    jitterVal.textContent = `±${(e.target.value / 10).toFixed(1)}%`;
  });

  profileGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('.profile-btn');
    if (!btn) return;
    profileGrid.querySelectorAll('.profile-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentProfile = btn.dataset.profile;
    playKeystrokeSound('KeyA');
  });

  // --- 사운드 합성 분기 ---
  function playKeystrokeSound(code) {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const jitterPercent = parseInt(jitterRange.value, 10) / 1000;
    const jitter = 1 + (Math.random() - 0.5) * (jitterPercent * 2);

    if (code === 'Enter' && bellCheck.checked && (currentProfile === 'vintage' || currentProfile === 'clicky')) {
      playCarriageBell(now);
    }

    if (currentProfile === 'vintage') {
      playVintageTypewriter(now, code, jitter);
    } else if (currentProfile === 'thock') {
      playLubedThock(now, code, jitter);
    } else if (currentProfile === 'clicky') {
      playClickySwitch(now, code, jitter);
    } else if (currentProfile === 'silent') {
      playSilentMembrane(now, code, jitter);
    }
  }

  // 1. 빈티지 타자기
  function playVintageTypewriter(now, code, jitter) {
    const isSpace = (code === 'Space');
    const isEnter = (code === 'Enter');

    const bufSize = Math.floor(audioCtx.sampleRate * 0.03);
    const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);

    const noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuf;

    const bpf = audioCtx.createBiquadFilter();
    bpf.type = 'bandpass';
    bpf.frequency.value = (isSpace ? 1400 : 2800) * jitter;
    bpf.Q.value = 3.5;

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.8, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

    noiseSrc.connect(bpf);
    bpf.connect(noiseGain);
    noiseGain.connect(masterGain);
    noiseSrc.start(now);

    const osc = audioCtx.createOscillator();
    osc.type = isSpace ? 'triangle' : 'sine';
    const baseFreq = (isSpace ? 160 : (isEnter ? 210 : 260)) * jitter;
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, now + 0.045);

    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(isSpace ? 0.9 : 0.6, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

    osc.connect(oscGain);
    oscGain.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.05);
  }

  function playCarriageBell(now) {
    const bellOsc = audioCtx.createOscillator();
    bellOsc.type = 'sine';
    bellOsc.frequency.setValueAtTime(2280, now + 0.02);

    const overtone = audioCtx.createOscillator();
    overtone.type = 'sine';
    overtone.frequency.setValueAtTime(3420, now + 0.02);

    const bellGain = audioCtx.createGain();
    bellGain.gain.setValueAtTime(0, now);
    bellGain.gain.setValueAtTime(0.45, now + 0.025);
    bellGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);

    const overGain = audioCtx.createGain();
    overGain.gain.value = 0.25;

    bellOsc.connect(bellGain);
    overtone.connect(overGain);
    overGain.connect(bellGain);
    bellGain.connect(masterGain);

    bellOsc.start(now + 0.02);
    overtone.start(now + 0.02);
    bellOsc.stop(now + 1.5);
    overtone.stop(now + 1.5);
  }

  // 2. 윤활 폼떡 기계식
  function playLubedThock(now, code, jitter) {
    const isSpace = (code === 'Space');
    const bufSize = Math.floor(audioCtx.sampleRate * 0.025);
    const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);

    const noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuf;

    const lpf = audioCtx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = (isSpace ? 480 : 850) * jitter;

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.65, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

    noiseSrc.connect(lpf);
    lpf.connect(noiseGain);
    noiseGain.connect(masterGain);
    noiseSrc.start(now);

    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    const startFreq = (isSpace ? 130 : 185) * jitter;
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.exponentialRampToValueAtTime(startFreq * 0.35, now + 0.038);

    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(isSpace ? 0.95 : 0.75, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.038);

    osc.connect(oscGain);
    oscGain.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.04);
  }

  // 3. 청축 클릭키
  function playClickySwitch(now, code, jitter) {
    const isSpace = (code === 'Space');
    const clickBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.006), audioCtx.sampleRate);
    const cData = clickBuf.getChannelData(0);
    for (let i = 0; i < cData.length; i++) cData[i] = (Math.random() * 2 - 1);

    const clickSrc = audioCtx.createBufferSource();
    clickSrc.buffer = clickBuf;
    const hpf = audioCtx.createBiquadFilter();
    hpf.type = 'highpass';
    hpf.frequency.value = 3600 * jitter;

    const clickGain = audioCtx.createGain();
    clickGain.gain.setValueAtTime(0.9, now);
    clickGain.gain.exponentialRampToValueAtTime(0.01, now + 0.005);

    clickSrc.connect(hpf);
    hpf.connect(clickGain);
    clickGain.connect(masterGain);
    clickSrc.start(now);

    const hitTime = now + 0.008;
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    const hitFreq = (isSpace ? 320 : 540) * jitter;
    osc.frequency.setValueAtTime(hitFreq, hitTime);
    osc.frequency.exponentialRampToValueAtTime(hitFreq * 0.5, hitTime + 0.025);

    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(0.65, hitTime);
    oscGain.gain.exponentialRampToValueAtTime(0.001, hitTime + 0.025);

    osc.connect(oscGain);
    oscGain.connect(masterGain);
    osc.start(hitTime);
    osc.stop(hitTime + 0.03);
  }

  // 4. 저소음 펠트
  function playSilentMembrane(now, code, jitter) {
    const isSpace = (code === 'Space');
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    const freq = (isSpace ? 90 : 140) * jitter;
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.4, now + 0.03);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 350;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.55, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.035);
  }

  function updateCounts() {
    const text = typingArea.value;
    charCount.textContent = text.length;
    const words = text.trim().split(/\s+/).filter(w => w.length > 0);
    wordCount.textContent = words.length;
  }

  // 키 입력 핸들러
  typingArea.addEventListener('keydown', (e) => {
    if (['Alt', 'Control', 'Shift', 'Meta', 'CapsLock'].includes(e.key)) return;
    playKeystrokeSound(e.code);

    const now = Date.now();
    keystrokeTimes.push(now);
    keystrokeTimes = keystrokeTimes.filter(t => now - t < 5000);
    const wpm = Math.round((keystrokeTimes.length / 5) * 12);
    wpmCount.textContent = wpm;
  });

  typingArea.addEventListener('input', () => {
    updateCounts();
    saveContent();
    updateTypewriterScroll();
  });

  // 클릭이나 방향키로 커서 이동할 때도 중앙 포커싱
  typingArea.addEventListener('keyup', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown'].includes(e.key)) {
      updateTypewriterScroll();
    }
  });
  typingArea.addEventListener('click', updateTypewriterScroll);

  // 모바일 터치 테스트 키
  document.querySelectorAll('.touch-key').forEach(btn => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const code = btn.dataset.key;
      playKeystrokeSound(code);
    });
  });

  // 단축키 Ctrl+S / Cmd+S
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      downloadBtn.click();
    }
  });

  // 초기화 로드
  loadSavedContent();
</script>

</body>
</html>
