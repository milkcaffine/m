<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="아이폰 HEIC를 JPG로 변환 — 서버 업로드 없음, 브라우저 내 일괄 변환.">
  <meta name="theme-color" content="#09090b">
  <title>HEIC to JPG — Marsko</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      background: #09090b;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .container {
      background: #18181b;
      max-width: 500px;
      width: 100%;
      border-radius: 16px;
      padding: 22px 18px;
      border: 1px solid #27272a;
    }
    .back { margin-bottom: 14px; font-size: 0.85rem; }
    .back a {
      color: #71717a;
      text-decoration: none;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      padding: 2px 6px;
      border: 1px solid #27272a;
      border-radius: 4px;
    }
    .back a:hover { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
    h1 { font-size: 1.2rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
    p.sub { font-size: 0.8rem; color: #71717a; text-align: center; margin-bottom: 18px; }
    .dropzone {
      border: 1px dashed #3f3f46;
      background: #09090b;
      border-radius: 12px;
      padding: 28px 14px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      color: #a1a1aa;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.06);
      color: #e4e4e7;
    }
    .dropzone small { font-size: 0.75rem; color: #71717a; font-weight: 400; }
    input[type="file"] { display: none; }
    .status-box {
      margin-top: 14px;
      padding: 12px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #a1a1aa;
      display: none;
      text-align: center;
      font-weight: 600;
    }
    .status-box.error { color: #f87171; border-color: #7f1d1d; }
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
      max-height: 260px;
      overflow-y: auto;
    }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #09090b;
      border: 1px solid #27272a;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .file-item.fail { color: #f87171; }
    .file-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
    .btn-down {
      background: #27272a;
      color: #7dd3fc;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
    }
    .btn-zip {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: #e4e4e7;
      color: #09090b;
      margin-top: 16px;
      display: none;
    }
    .btn-zip:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="container">
  <div class="back"><a href="index.html">← marsko</a></div>
  <h1>HEIC → JPG</h1>
  <p class="sub">서버 업로드 없음 · 브라우저에서 바로 변환</p>
  <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="HEIC 파일 선택 또는 끌어다 놓기">
    <span>HEIC 파일 선택 · 여러 장 가능</span>
    <small>클릭하거나 여기에 끌어다 놓으세요</small>
    <input type="file" id="fileInput" accept=".heic,.HEIC,.heif,.HEIF,image/heic,image/heif" multiple>
  </div>
  <div class="status-box" id="statusBox">변환 준비 중...</div>
  <div class="file-list" id="fileList"></div>
  <button class="btn-zip" id="zipBtn" type="button">모두 ZIP으로 묶어 받기</button>
</div>
<script>
(function () {
  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const statusBox = document.getElementById('statusBox');
  const fileList = document.getElementById('fileList');
  const zipBtn = document.getElementById('zipBtn');
  const convertedFiles = [];

  function openPicker() { fileInput.click(); }

  dropzone.addEventListener('click', openPicker);
  dropzone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openPicker();
    }
  });

  ['dragenter', 'dragover'].forEach((ev) => {
    dropzone.addEventListener(ev, (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach((ev) => {
    dropzone.addEventListener(ev, (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.remove('dragover');
    });
  });
  dropzone.addEventListener('drop', (e) => {
    const files = Array.from(e.dataTransfer.files || []);
    if (files.length) convertFiles(files);
  });

  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length) await convertFiles(files);
    fileInput.value = '';
  });

  async function convertFiles(files) {
    statusBox.style.display = 'block';
    statusBox.classList.remove('error');
    fileList.innerHTML = '';
    convertedFiles.length = 0;
    zipBtn.style.display = 'none';

    let failed = 0;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const baseName = file.name.replace(/\.[^/.]+$/, '');
      statusBox.textContent = `변환 중 (${i + 1}/${files.length}): ${file.name}`;
      try {
        const jpegBlob = await heic2any({
          blob: file,
          toType: 'image/jpeg',
          quality: 0.95
        });
        const finalBlob = Array.isArray(jpegBlob) ? jpegBlob[0] : jpegBlob;
        const url = URL.createObjectURL(finalBlob);
        const newName = `${baseName}.jpg`;
        convertedFiles.push({ name: newName, blob: finalBlob, url });
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `<span>${newName}</span><a class="btn-down" href="${url}" download="${newName}">저장</a>`;
        fileList.appendChild(item);
      } catch (err) {
        failed += 1;
        console.error('변환 실패:', err);
        const item = document.createElement('div');
        item.className = 'file-item fail';
        item.innerHTML = `<span>실패: ${file.name}</span>`;
        fileList.appendChild(item);
      }
    }

    if (convertedFiles.length === 0) {
      statusBox.textContent = '변환에 실패했습니다. HEIC/HEIF 파일인지 확인해 주세요.';
      statusBox.classList.add('error');
      return;
    }

    statusBox.textContent = failed
      ? `완료: ${convertedFiles.length}장 성공 · ${failed}장 실패`
      : `완료! 총 ${convertedFiles.length}장 변환`;
    if (convertedFiles.length > 1) zipBtn.style.display = 'block';
  }

  zipBtn.addEventListener('click', async () => {
    zipBtn.textContent = 'ZIP 압축 중...';
    zipBtn.disabled = true;
    try {
      const zip = new JSZip();
      convertedFiles.forEach((f) => zip.file(f.name, f.blob));
      const content = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = `converted_jpg_${Date.now()}.zip`;
      link.click();
    } finally {
      zipBtn.textContent = '모두 ZIP으로 묶어 받기';
      zipBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
