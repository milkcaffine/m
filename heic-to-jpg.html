<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HEIC to JPG 변환기</title>
  <!-- 클라이언트 HEIC 디코더 & 압축 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 12px;
    }
    .container {
      background: #ffffff;
      max-width: 500px;
      width: 100%;
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    h1 { font-size: 1.25rem; font-weight: 800; text-align: center; margin-bottom: 4px; }
    p.sub { font-size: 0.8rem; color: #868e96; text-align: center; margin-bottom: 16px; }
    .dropzone {
      border: 2px dashed #007aff;
      background: #f0f7ff;
      border-radius: 14px;
      padding: 24px 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      color: #007aff;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dropzone small { font-size: 0.75rem; color: #6c757d; font-weight: 400; }
    input[type="file"] { display: none; }
    /* 진행 상황 및 목록 */
    .status-box {
      margin-top: 14px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #495057;
      display: none;
      text-align: center;
      font-weight: 600;
    }
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
      max-height: 240px;
      overflow-y: auto;
    }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8f9fa;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .file-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
    .btn-down {
      background: #e9ecef;
      color: #007aff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-zip {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: #007aff;
      color: #ffffff;
      margin-top: 16px;
      display: none;
    }
    .btn-zip:disabled { opacity: 0.5; cursor: not-allowed; }
    .back { text-align: center; margin-bottom: 12px; font-size: 0.85rem; }
    .back a { color: #007aff; text-decoration: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="back"><a href="index.html">← marsko</a></div>
  <h1>HEIC ➔ JPG 초고속 변환기</h1>
  <p class="sub">서버 업로드 없음 · 브라우저 자체 변환</p>
  <div class="dropzone" id="dropzone">
    <span>📷 HEIC 파일 선택 (여러 장 가능)</span>
    <small>아이폰 .heic 사진을 여기에 올려주세요</small>
    <input type="file" id="fileInput" accept=".heic, .HEIC" multiple>
  </div>
  <div class="status-box" id="statusBox">변환 준비 중...</div>
  <div class="file-list" id="fileList"></div>
  <button class="btn-zip" id="zipBtn">모두 ZIP으로 묶어 받기</button>
</div>
<script>
  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const statusBox = document.getElementById('statusBox');
  const fileList = document.getElementById('fileList');
  const zipBtn = document.getElementById('zipBtn');
  const convertedFiles = []; // { name, blob, url }
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    statusBox.style.display = 'block';
    fileList.innerHTML = '';
    convertedFiles.length = 0;
    zipBtn.style.display = 'none';
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const baseName = file.name.replace(/\.[^/.]+$/, "");
      statusBox.textContent = `변환 중 (${i + 1}/${files.length}): ${file.name}`;
      try {
        // heic2any 라이브러리로 브라우저 내에서 직접 디코딩
        const jpegBlob = await heic2any({
          blob: file,
          toType: "image/jpeg",
          quality: 0.95
        });
        // 다중 프레임(라이브포토 등)일 경우 배열로 나올 수 있으므로 처리
        const finalBlob = Array.isArray(jpegBlob) ? jpegBlob[0] : jpegBlob;
        const url = URL.createObjectURL(finalBlob);
        const newName = `${baseName}.jpg`;
        convertedFiles.push({ name: newName, blob: finalBlob, url: url });
        // 개별 다운로드 목록 추가
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <span>${newName}</span>
          <a class="btn-down" href="${url}" download="${newName}">저장</a>
        `;
        fileList.appendChild(item);
      } catch (err) {
        console.error("변환 실패:", err);
      }
    }
    statusBox.textContent = `완료! 총 ${convertedFiles.length}장 변환 성공 🎉`;
    if (convertedFiles.length > 1) {
      zipBtn.style.display = 'block';
    }
    fileInput.value = '';
  });
  // ZIP 일괄 다운로드
  zipBtn.addEventListener('click', async () => {
    zipBtn.textContent = 'ZIP 압축 중...';
    zipBtn.disabled = true;
    const zip = new JSZip();
    convertedFiles.forEach(f => {
      zip.file(f.name, f.blob);
    });
    const content = await zip.generateAsync({ type: 'blob' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = `converted_jpg_${Date.now()}.zip`;
    link.click();
    zipBtn.textContent = '모두 ZIP으로 묶어 받기';
    zipBtn.disabled = false;
  });
</script>
</body>
</html>
