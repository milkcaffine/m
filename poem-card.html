<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Marsko lab tool — poem-card.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff">
  <title>SNS 시 & 단가 카드 메이커</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #f4f6f8;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      padding: 12px;
    }
    .container {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    h1 { font-size: 1.25rem; font-weight: 800; text-align: center; margin-bottom: 4px; }
    p.sub { font-size: 0.8rem; color: #868e96; text-align: center; margin-bottom: 16px; }
    .input-section { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    textarea {
      width: 100%;
      height: 110px;
      padding: 12px;
      border: 1px solid #ced4da;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus { border-color: #007aff; outline: none; }
    .control-panel {
      background: #f8f9fa;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.88rem;
    }
    .control-row label { font-weight: 600; color: #343a40; }
    .control-row select, .control-row input[type="text"] {
      font-size: 0.9rem;
      border-radius: 8px;
      padding: 6px 10px;
      border: 1px solid #ced4da;
      background: #fff;
    }
    .control-row input[type="text"] { width: 170px; }
    .segmented-control {
      display: flex;
      background: #e9ecef;
      border-radius: 8px;
      padding: 3px;
      width: 150px;
    }
    .segmented-control button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 6px 0;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      color: #495057;
    }
    .segmented-control button.active {
      background: #fff;
      color: #007aff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }
    .slider-box { display: flex; align-items: center; gap: 8px; }
    .slider-box input[type="range"] { width: 110px; }
    .slider-box span { font-size: 0.8rem; color: #495057; width: 36px; text-align: right; }
    .bg-options {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #ced4da;
      cursor: pointer;
    }
    .color-btn.active { border-color: #007aff; transform: scale(1.15); }
    .btn-file {
      padding: 5px 9px;
      border: 1px solid #ced4da;
      background: #fff;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
    }
    #bgFileInput { display: none; }
    #previewArea {
      margin-top: 16px;
      width: 100%;
      text-align: center;
    }
    .preview-header { font-size: 0.75rem; color: #868e96; margin-bottom: 6px; text-align: left; }
    .canvas-container {
      width: 100%;
      max-height: 420px;
      background: #e9ecef;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }
    #previewCanvas {
      max-width: 100%;
      max-height: 400px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      border-radius: 6px;
    }
    .btn-group { margin-top: 18px; }
    .btn {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #007aff;
      color: #ffffff;
    }
    .back { text-align: center; margin-bottom: 12px; font-size: 0.85rem; }
    .back a { color: #007aff; text-decoration: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="back"><a href="index.html">← marsko</a></div>
  <h1>감성 시 & 단가 카드 메이커</h1>
  <p class="sub">가로·세로쓰기 · 사진/컬러 배경 · 필름 필터 · 닉네임 서명</p>
  <div class="input-section">
    <textarea id="poemInput" placeholder="시, 단가, 하이쿠를 입력하세요 (줄바꿈 지원)">여름밤 잔잔한 바람
창가에 스치울 때
마음은 어느덧 먼 바다로</textarea>
  </div>
  <div class="control-panel">
    <div class="control-row">
      <label>쓰기 방향</label>
      <div class="segmented-control" id="dirControl">
        <button type="button" data-dir="v" class="active">세로쓰기 (縦)</button>
        <button type="button" data-dir="h">가로쓰기 (横)</button>
      </div>
    </div>
    <div class="control-row">
      <label for="fontSelect">서체 (글꼴)</label>
      <select id="fontSelect">
        <option value="'Gowun Batang', serif" selected>고운바탕 (단아함/추천)</option>
        <option value="'Nanum Myeongjo', serif">나눔명조 (클래식)</option>
        <option value="'Noto Serif KR', serif">노토 세리프 (정갈함)</option>
        <option value="'Noto Sans KR', sans-serif">모던 고딕 (깔끔함)</option>
      </select>
    </div>
    <div class="control-row">
      <label for="ratioSelect">카드 비율</label>
      <select id="ratioSelect">
        <option value="1:1" selected>1:1 (정사각형 - 피드)</option>
        <option value="3:4">3:4 (X / 트위터 추천)</option>
        <option value="9:16">9:16 (스토리 / 릴스)</option>
        <option value="4:5">4:5 (인스타 피드)</option>
      </select>
    </div>
    <div class="control-row">
      <label for="authorInput">
        서명 / 닉네임
        <span style="display:block; font-size:0.75rem; font-weight:400; color:#868e96;">낙관 스타일 출력</span>
      </label>
      <input type="text" id="authorInput" value="© Marsko" placeholder="예: 해민, @id">
    </div>
    <div class="control-row">
      <label for="fontSizeRange">글자 크기</label>
      <div class="slider-box">
        <input type="range" id="fontSizeRange" min="28" max="70" value="44">
        <span id="fontSizeVal">44px</span>
      </div>
    </div>
    <div class="control-row">
      <label>배경 스타일</label>
      <div class="bg-options">
        <div class="color-btn" data-color="#fcfbf7" style="background: #fcfbf7;" title="한지 아이보리"></div>
        <div class="color-btn active" data-color="#ffffff" style="background: #ffffff;" title="순백색"></div>
        <div class="color-btn" data-color="#18191a" style="background: #18191a;" title="먹색 다크"></div>
        <button type="button" class="btn-file" id="bgFileBtn">📷 사진 배경</button>
        <input type="file" id="bgFileInput" accept="image/*">
      </div>
    </div>
    <div class="control-row" id="dimRow" style="display: none;">
      <label for="dimRange">배경 어둡기 (가독성)</label>
      <div class="slider-box">
        <input type="range" id="dimRange" min="10" max="85" value="45">
        <span id="dimVal">45%</span>
      </div>
    </div>
    <div class="control-row" id="filterRow" style="display: none;">
      <label for="filterSelect">필름 필터</label>
      <select id="filterSelect">
        <option value="none">없음</option>
        <option value="bw">흑백 (간단)</option>
        <option value="caffenol">카페놀 흑백</option>
        <option value="film">필름 감성</option>
        <option value="warm">온기</option>
      </select>
    </div>
  </div>
  <div id="previewArea">
    <div class="preview-header">미리보기 (고해상도 1600px 캔버스)</div>
    <div class="canvas-container">
      <canvas id="previewCanvas"></canvas>
    </div>
  </div>
  <div class="btn-group">
    <button class="btn" id="downloadBtn">고화질 시 카드 저장</button>
  </div>
</div>
<script>
  const poemInput = document.getElementById('poemInput');
  const authorInput = document.getElementById('authorInput');
  const dirControl = document.getElementById('dirControl');
  const fontSelect = document.getElementById('fontSelect');
  const ratioSelect = document.getElementById('ratioSelect');
  const fontSizeRange = document.getElementById('fontSizeRange');
  const fontSizeVal = document.getElementById('fontSizeVal');
  const colorBtns = document.querySelectorAll('.color-btn');
  const bgFileBtn = document.getElementById('bgFileBtn');
  const bgFileInput = document.getElementById('bgFileInput');
  const dimRow = document.getElementById('dimRow');
  const dimRange = document.getElementById('dimRange');
  const dimVal = document.getElementById('dimVal');
  const filterRow = document.getElementById('filterRow');
  const filterSelect = document.getElementById('filterSelect');
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');
  const downloadBtn = document.getElementById('downloadBtn');
  let writingDir = 'v';
  let bgColor = '#ffffff';
  let bgImage = null;

  dirControl.addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    dirControl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    writingDir = e.target.dataset.dir;
    renderPoemCard();
  });

  colorBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      colorBtns.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      bgColor = e.target.dataset.color;
      bgImage = null;
      dimRow.style.display = 'none';
      filterRow.style.display = 'none';
      renderPoemCard();
    });
  });

  bgFileBtn.addEventListener('click', () => bgFileInput.click());
  bgFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      bgImage = new Image();
      bgImage.onload = () => {
        colorBtns.forEach(b => b.classList.remove('active'));
        dimRow.style.display = 'flex';
        filterRow.style.display = 'flex';
        renderPoemCard();
      };
      bgImage.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    bgFileInput.value = '';
  });

  [poemInput, authorInput, fontSelect, ratioSelect, filterSelect].forEach(el => el.addEventListener('input', renderPoemCard));
  fontSizeRange.addEventListener('input', () => {
    fontSizeVal.textContent = fontSizeRange.value + 'px';
    renderPoemCard();
  });
  dimRange.addEventListener('input', () => {
    dimVal.textContent = dimRange.value + '%';
    renderPoemCard();
  });

  function applyFilter(filter) {
    if (filter === 'none') return;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      let r = data[i], g = data[i+1], b = data[i+2];
      if (filter === 'bw') {
        const gray = 0.299*r + 0.587*g + 0.114*b;
        data[i] = data[i+1] = data[i+2] = gray;
      } else if (filter === 'caffenol') {
        const gray = 0.299*r + 0.587*g + 0.114*b;
        const contrast = (gray - 128) * 1.15 + 128;
        const warm = Math.min(255, contrast * 1.05);
        data[i] = warm;
        data[i+1] = contrast * 0.95;
        data[i+2] = contrast * 0.85;
      } else if (filter === 'film') {
        data[i] = Math.min(255, r * 1.08);
        data[i+1] = g * 0.95;
        data[i+2] = Math.min(255, b * 0.9);
        // slight grain-like contrast
        const avg = (data[i]+data[i+1]+data[i+2])/3;
        const c = (avg - 128) * 1.1 + 128;
        data[i] = data[i] * 0.9 + c * 0.1;
        data[i+1] = data[i+1] * 0.9 + c * 0.1;
        data[i+2] = data[i+2] * 0.9 + c * 0.1;
      } else if (filter === 'warm') {
        data[i] = Math.min(255, r * 1.12);
        data[i+1] = g * 1.02;
        data[i+2] = b * 0.88;
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }

  function renderPoemCard() {
    const text = poemInput.value;
    const author = authorInput.value.trim();
    const ratioStr = ratioSelect.value;
    const [rw, rh] = ratioStr.split(':').map(Number);
    const baseW = 1600;
    const baseH = Math.round((baseW / rw) * rh);
    canvas.width = baseW;
    canvas.height = baseH;

    if (bgImage) {
      const imgRatio = bgImage.naturalWidth / bgImage.naturalHeight;
      const targetRatio = baseW / baseH;
      let sx, sy, sw, sh;
      if (imgRatio > targetRatio) {
        sh = bgImage.naturalHeight; sw = sh * targetRatio;
        sy = 0; sx = (bgImage.naturalWidth - sw) / 2;
      } else {
        sw = bgImage.naturalWidth; sh = sw / targetRatio;
        sx = 0; sy = (bgImage.naturalHeight - sh) / 2;
      }
      ctx.drawImage(bgImage, sx, sy, sw, sh, 0, 0, baseW, baseH);
      const dimOpacity = parseInt(dimRange.value, 10) / 100;
      ctx.fillStyle = `rgba(0, 0, 0, ${dimOpacity})`;
      ctx.fillRect(0, 0, baseW, baseH);
      applyFilter(filterSelect.value);
    } else {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, baseW, baseH);
    }

    const isDark = bgImage || (bgColor === '#18191a');
    const mainTextColor = isDark ? '#ffffff' : '#1e1e1e';
    const subTextColor = isDark ? 'rgba(255,255,255,0.65)' : 'rgba(0,0,0,0.55)';
    const fontSize = parseInt(fontSizeRange.value, 10);
    const fontFam = fontSelect.value;
    ctx.fillStyle = mainTextColor;
    const lines = text.split('\n');

    if (writingDir === 'v') {
      const colSpacing = fontSize * 1.9;
      const charSpacing = fontSize * 1.35;
      const maxChars = Math.max(...lines.map(l => l.length), 1);
      const totalTextWidth = (lines.length - 1) * colSpacing;
      const totalTextHeight = (maxChars - 1) * charSpacing;
      const startX = (baseW / 2) + (totalTextWidth / 2);
      const startY = (baseH / 2) - (totalTextHeight / 2) + (fontSize * 0.4);
      ctx.font = `400 ${fontSize}px ${fontFam}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      lines.forEach((line, colIdx) => {
        const x = startX - (colIdx * colSpacing);
        for (let rowIdx = 0; rowIdx < line.length; rowIdx++) {
          const char = line[rowIdx];
          const y = startY + (rowIdx * charSpacing);
          ctx.fillText(char, x, y);
        }
      });
      if (author) {
        ctx.save();
        ctx.font = `400 ${Math.round(fontSize * 0.58)}px ${fontFam}`;
        ctx.fillStyle = subTextColor;
        const authorX = startX - (lines.length * colSpacing) - (fontSize * 0.5);
        const authorY = startY + (fontSize * 0.8);
        for (let i = 0; i < author.length; i++) {
          ctx.fillText(author[i], authorX, authorY + (i * fontSize * 0.8));
        }
        ctx.restore();
      }
    } else {
      const lineSpacing = fontSize * 1.85;
      const totalHeight = (lines.length - 1) * lineSpacing;
      const startY = (baseH / 2) - (totalHeight / 2);
      ctx.font = `400 ${fontSize}px ${fontFam}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      lines.forEach((line, idx) => {
        const y = startY + (idx * lineSpacing);
        ctx.fillText(line, baseW / 2, y);
      });
      if (author) {
        ctx.save();
        ctx.font = `400 ${Math.round(fontSize * 0.58)}px ${fontFam}`;
        ctx.fillStyle = subTextColor;
        const authorY = startY + (lines.length * lineSpacing) + (fontSize * 0.6);
        ctx.fillText(author, baseW / 2, authorY);
        ctx.restore();
      }
    }
  }

  document.fonts.ready.then(() => {
    renderPoemCard();
  });

  downloadBtn.addEventListener('click', () => {
    canvas.toBlob((blob) => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `poem_${Date.now()}.jpg`;
      link.click();
    }, 'image/jpeg', 0.98);
  });
</script>
</body>
</html>
