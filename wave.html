<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Marsko lab tool — wave.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/marsko-hud.css">
<meta name="theme-color" content="#03060a">
  <title>Wave Interference Tank // marsko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020408;
      color: #cbd5e1;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    #waveCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* 상단 헤더 HUD */
    header {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
    }
    .home-link {
      color: #64748b;
      font-size: 0.75rem;
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      pointer-events: auto;
      width: fit-content;
      padding: 2px 6px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
    }
    .home-link:hover { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
    h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f8fafc;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    .hud-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #94a3b8;
    }

    /* 우측 텔레메트리 */
    .telemetry-card {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(10, 15, 26, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #94a3b8;
      backdrop-filter: blur(6px);
      pointer-events: none;
      line-height: 1.6;
      text-align: right;
      z-index: 10;
    }
    .telemetry-card strong { color: #38bdf8; }

    /* 하단 플로팅 컨트롤 독 */
    .control-dock {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 15, 26, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      z-index: 10;
      max-width: 95%;
      overflow-x: auto;
    }
    .dock-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .dock-btn:hover { background: #334155; color: #38bdf8; }
    .dock-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }

    .dock-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: #94a3b8;
      white-space: nowrap;
    }
    .slider-group input[type="range"] {
      width: 55px;
      height: 4px;
      accent-color: #38bdf8;
      background: #334155;
      cursor: pointer;
    }
    .slider-group select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      border-radius: 6px;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 0.7rem;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="home-link">← marsko</a>
  <h1>2D WAVE INTERFERENCE TANK</h1>
  <div class="hud-meta">FDTD WAVE EQUATION · QUANTUM SLITS</div>
</header>

<div class="telemetry-card">
  <div>SCENARIO: <strong id="valScene">DOUBLE SLIT</strong></div>
  <div>STATUS: <strong id="valStatus">RUNNING</strong></div>
  <div>CONTRAST: <strong id="valGain">2.4x</strong></div>
  <div>FPS: <strong id="valFps">60</strong></div>
</div>

<canvas id="waveCanvas"></canvas>

<div class="control-dock">
  <button type="button" class="dock-btn active" id="btnDouble">이중 슬릿 (양자 간섭)</button>
  <button type="button" class="dock-btn" id="btnSingle">단일 슬릿 (회절)</button>
  <button type="button" class="dock-btn" id="btnDoppler">도플러 파동</button>
  <button type="button" class="dock-btn" id="btnMirror">오목 거울 집초</button>

  <div class="dock-sep"></div>

  <div class="slider-group">
    <span>모드</span>
    <select id="toolSelect">
      <option value="drop">물방울 파문</option>
      <option value="wall">벽 그리기</option>
      <option value="erase">벽 지우개</option>
    </select>
  </div>

  <button type="button" class="dock-btn" id="btnClear">초기화</button>
  <button type="button" class="dock-btn" id="btnPause">❚❚ 일시정지</button>

  <div class="dock-sep"></div>

  <div class="slider-group">
    <span>감도(Gain)</span>
    <input type="range" id="gainRange" min="10" max="60" value="24">
  </div>
  <div class="slider-group">
    <span>파장/주파수</span>
    <input type="range" id="freqRange" min="8" max="32" value="18">
  </div>
</div>

<script>
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');

  const valScene = document.getElementById('valScene');
  const valStatus = document.getElementById('valStatus');
  const valGain = document.getElementById('valGain');
  const valFps = document.getElementById('valFps');

  const btnDouble = document.getElementById('btnDouble');
  const btnSingle = document.getElementById('btnSingle');
  const btnDoppler = document.getElementById('btnDoppler');
  const btnMirror = document.getElementById('btnMirror');
  const btnClear = document.getElementById('btnClear');
  const btnPause = document.getElementById('btnPause');

  const toolSelect = document.getElementById('toolSelect');
  const gainRange = document.getElementById('gainRange');
  const freqRange = document.getElementById('freqRange');

  // 내부 유한차분 시뮬레이션 그리드 해상도
  const GRID_W = 320;
  const GRID_H = 200;

  // 3단계 시간 버퍼
  let uPrev = new Float32Array(GRID_W * GRID_H);
  let uCurr = new Float32Array(GRID_W * GRID_H);
  let uNext = new Float32Array(GRID_W * GRID_H);
  let walls = new Uint8Array(GRID_W * GRID_H);

  // 렌더링용 오프스크린 캔버스
  const offscreenCanvas = document.createElement('canvas');
  offscreenCanvas.width = GRID_W;
  offscreenCanvas.height = GRID_H;
  const offCtx = offscreenCanvas.getContext('2d');
  let imgData = offCtx.createImageData(GRID_W, GRID_H);

  // 물리 파라미터 (CFL 안정 조건 엄수)
  let c2 = 0.42; 
  let damping = 0.996;
  let frequency = 0.18;
  let gain = 2.4;
  let isRunning = true;
  let currentScene = 'double';
  let simStep = 0;

  // 도플러 음원 좌표
  let dopplerX = 40;
  let dopplerSpeed = 0.45;

  let width = window.innerWidth;
  let height = window.innerHeight;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // 프리셋 시나리오 구성
  function buildScene(name) {
    currentScene = name;
    uPrev.fill(0);
    uCurr.fill(0);
    uNext.fill(0);
    walls.fill(0);
    simStep = 0;

    [btnDouble, btnSingle, btnDoppler, btnMirror].forEach(b => b.classList.remove('active'));

    const midX = Math.floor(GRID_W * 0.32);
    const midY = Math.floor(GRID_H * 0.5);

    if (name === 'double') {
      btnDouble.classList.add('active');
      valScene.textContent = 'DOUBLE SLIT';

      // 세로 벽 세우기
      for (let y = 0; y < GRID_H; y++) {
        walls[y * GRID_W + midX] = 1;
        walls[y * GRID_W + midX + 1] = 1; // 2px 두께
      }

      // 두 개의 슬릿 (너비 8px, 간격 28px)
      const slitDist = 28;
      const slitWidth = 8;
      for (let w = -slitWidth/2; w <= slitWidth/2; w++) {
        for (let th = 0; th <= 1; th++) {
          walls[Math.floor(midY - slitDist/2 + w) * GRID_W + midX + th] = 0;
          walls[Math.floor(midY + slitDist/2 + w) * GRID_W + midX + th] = 0;
        }
      }
    } else if (name === 'single') {
      btnSingle.classList.add('active');
      valScene.textContent = 'SINGLE SLIT';

      for (let y = 0; y < GRID_H; y++) {
        walls[y * GRID_W + midX] = 1;
        walls[y * GRID_W + midX + 1] = 1;
      }
      const slitWidth = 10;
      for (let w = -slitWidth/2; w <= slitWidth/2; w++) {
        for (let th = 0; th <= 1; th++) {
          walls[Math.floor(midY + w) * GRID_W + midX + th] = 0;
        }
      }
    } else if (name === 'doppler') {
      btnDoppler.classList.add('active');
      valScene.textContent = 'DOPPLER SHIFT';
      dopplerX = 40;
    } else if (name === 'mirror') {
      btnMirror.classList.add('active');
      valScene.textContent = 'PARABOLIC MIRROR';

      const f = 45;
      const mirrorApexX = GRID_W - 20;
      for (let y = 15; y < GRID_H - 15; y++) {
        const dy = y - midY;
        const x = Math.floor(mirrorApexX - (dy * dy) / (4 * f));
        if (x >= 0 && x < GRID_W - 1) {
          walls[y * GRID_W + x] = 1;
          walls[y * GRID_W + x + 1] = 1;
        }
      }
    }
  }

  // --- 유한차분법(FDTD) 2D 파동 방정식 솔버 ---
  function updatePhysics() {
    if (!isRunning) return;
    simStep++;

    // 1. 연속 파원 드라이버 공급
    const amp = Math.sin(simStep * frequency) * 2.2;

    if (currentScene === 'double' || currentScene === 'single') {
      // 좌측 수면에서 밀려오는 균일한 평면파
      for (let y = 4; y < GRID_H - 4; y++) {
        uCurr[y * GRID_W + 6] = amp;
      }
    } else if (currentScene === 'doppler') {
      dopplerX += dopplerSpeed;
      if (dopplerX > GRID_W - 40) dopplerX = 40;
      const dX = Math.floor(dopplerX);
      const dY = Math.floor(GRID_H * 0.5);
      uCurr[dY * GRID_W + dX] = amp * 2.5;
    } else if (currentScene === 'mirror') {
      for (let y = 20; y < GRID_H - 20; y++) {
        uCurr[y * GRID_W + 10] = amp;
      }
    }

    // 2. 2D 라플라시안 2차 중앙 차분
    for (let y = 1; y < GRID_H - 1; y++) {
      let idx = y * GRID_W + 1;
      for (let x = 1; x < GRID_W - 1; x++, idx++) {
        if (walls[idx] === 1) {
          uNext[idx] = 0;
          continue;
        }

        const laplacian = uCurr[idx - 1] + uCurr[idx + 1] +
                          uCurr[idx - GRID_W] + uCurr[idx + GRID_W] - 4.0 * uCurr[idx];

        uNext[idx] = (2.0 * uCurr[idx] - uPrev[idx] + c2 * laplacian) * damping;
      }
    }

    // 3. 가장자리 흡수 경계 (반사 완화)
    for (let x = 0; x < GRID_W; x++) {
      uNext[x] *= 0.88;
      uNext[(GRID_H - 1) * GRID_W + x] *= 0.88;
    }
    for (let y = 0; y < GRID_H; y++) {
      uNext[y * GRID_W] *= 0.88;
      uNext[y * GRID_W + (GRID_W - 1)] *= 0.88;
    }

    // 핑퐁 버퍼 스왑
    const temp = uPrev;
    uPrev = uCurr;
    uCurr = uNext;
    uNext = temp;
  }

  // --- 화면 렌더링 루프 (비선형 tanh 네온 감마 보정) ---
  function render() {
    const data = imgData.data;
    let ptr = 0;

    for (let idx = 0; idx < GRID_W * GRID_H; idx++) {
      if (walls[idx] === 1) {
        // 장애물 슬릿 벽: 선명한 슬레이트 그레이
        data[ptr++] = 148;
        data[ptr++] = 163;
        data[ptr++] = 184;
        data[ptr++] = 255;
      } else {
        const u = uCurr[idx];
        // 비선형 감마: 미세한 투과파(0.02)도 눈부시게 끌어올림
        const norm = Math.tanh(u * gain);

        if (norm >= 0) {
          // 마루 (Crest): 깊은 감청색 ➔ 눈부신 네온 시안/백색 (#38bdf8)
          data[ptr++] = Math.min(255, Math.floor(6 + norm * (248 - 6)));
          data[ptr++] = Math.min(255, Math.floor(12 + norm * (252 - 12)));
          data[ptr++] = Math.min(255, Math.floor(24 + norm * (255 - 24)));
          data[ptr++] = 255;
        } else {
          // 골 (Trough): 깊은 감청색 ➔ 칠흑의 심해 암청색
          const absNorm = -norm;
          data[ptr++] = Math.max(0, Math.floor(6 * (1.0 - absNorm)));
          data[ptr++] = Math.max(0, Math.floor(12 * (1.0 - absNorm)));
          data[ptr++] = Math.max(0, Math.floor(24 * (1.0 - absNorm * 0.7)));
          data[ptr++] = 255;
        }
      }
    }

    offCtx.putImageData(imgData, 0, 0);

    // 메인 화면으로 전사 (부드러운 보간 적용)
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(offscreenCanvas, 0, 0, width, height);
  }

  let frameCount = 0;
  let lastTime = performance.now();

  function loop() {
    updatePhysics();
    updatePhysics();
    render();

    frameCount++;
    const now = performance.now();
    if (now - lastTime >= 500) {
      valFps.textContent = Math.round((frameCount * 1000) / (now - lastTime));
      frameCount = 0;
      lastTime = now;
    }

    requestAnimationFrame(loop);
  }

  // --- 마우스 / 터치 인터랙션 ---
  let isPointerDown = false;

  function handlePointer(clientX, clientY) {
    const gx = Math.floor((clientX / width) * GRID_W);
    const gy = Math.floor((clientY / height) * GRID_H);
    if (gx < 2 || gx >= GRID_W - 2 || gy < 2 || gy >= GRID_H - 2) return;

    const tool = toolSelect.value;
    if (tool === 'drop') {
      const r = 5;
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          const d2 = dx * dx + dy * dy;
          if (d2 <= r * r) {
            const idx = (gy + dy) * GRID_W + (gx + dx);
            if (walls[idx] === 0) {
              uCurr[idx] += Math.exp(-d2 / 7.0) * 3.5;
            }
          }
        }
      }
    } else if (tool === 'wall') {
      walls[gy * GRID_W + gx] = 1;
      uCurr[gy * GRID_W + gx] = 0;
    } else if (tool === 'erase') {
      walls[gy * GRID_W + gx] = 0;
    }
  }

  canvas.addEventListener('mousedown', (e) => {
    isPointerDown = true;
    handlePointer(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    if (isPointerDown) handlePointer(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', () => { isPointerDown = false; });

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isPointerDown = true;
      handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (isPointerDown && e.touches.length === 1) {
      handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });
  canvas.addEventListener('touchend', () => { isPointerDown = false; });

  // UI 버튼 바인딩
  btnDouble.addEventListener('click', () => buildScene('double'));
  btnSingle.addEventListener('click', () => buildScene('single'));
  btnDoppler.addEventListener('click', () => buildScene('doppler'));
  btnMirror.addEventListener('click', () => buildScene('mirror'));

  btnClear.addEventListener('click', () => {
    uPrev.fill(0);
    uCurr.fill(0);
    uNext.fill(0);
  });

  btnPause.addEventListener('click', () => {
    isRunning = !isRunning;
    btnPause.textContent = isRunning ? '❚❚ 일시정지' : '▶ 재생';
    btnPause.classList.toggle('active', isRunning);
    valStatus.textContent = isRunning ? 'RUNNING' : 'PAUSED';
    valStatus.style.color = isRunning ? '#38bdf8' : '#94a3b8';
  });

  gainRange.addEventListener('input', (e) => {
    gain = parseInt(e.target.value, 10) / 10.0;
    valGain.textContent = `${gain.toFixed(1)}x`;
  });

  freqRange.addEventListener('input', (e) => {
    frequency = parseInt(e.target.value, 10) / 100.0;
  });

  // 초기 시작
  buildScene('double');
  requestAnimationFrame(loop);
</script>

</body>
</html>
