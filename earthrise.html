<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020306">
  <meta name="description" content="Marsko lab tool — Horizon Observatory. 달(지구돋이·개기월식) 및 외계 위성(엔셀라두스·유로파·포보스) 지평선 모행성 실시간 관측소 & 우주 엠비언트 사운드.">
  <title>Horizon Observatory (Earth &amp; Exomoon) // marsko</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/marsko-hud.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020306;
      color: #cbd5e1;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      user-select: none;
    }

    #obsCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    #obsCanvas:active { cursor: grabbing; }

    /* 상단 헤더 HUD */
    header {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .sound-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(15, 23, 42, 0.65);
      color: #94a3b8;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.15s ease;
    }
    .sound-btn:hover { color: #38bdf8; border-color: rgba(56, 189, 248, 0.45); }
    .sound-btn.active {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.55);
      background: rgba(16, 185, 129, 0.14);
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.25);
    }
    h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f8fafc;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }
    .hud-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #94a3b8;
    }

    /* 우측 천문 텔레메트리 HUD */
    .telemetry-card {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(8, 12, 22, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #94a3b8;
      backdrop-filter: blur(6px);
      pointer-events: none;
      line-height: 1.65;
      text-align: right;
      z-index: 10;
    }
    .telemetry-card strong { color: #38bdf8; }
    .telemetry-card .eclipse, .telemetry-card .accent-rose { color: #f43f5e !important; text-shadow: 0 0 8px rgba(244, 63, 94, 0.5); }
    .telemetry-card .accent-amber { color: #fbbf24; }

    /* 하단 플로팅 컨트롤 독 */
    .control-dock {
      max-width: min(1040px, 96%);
      gap: 7px 10px;
    }
    .dock-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 8px;
      width: 100%;
    }
    .dock-sep {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
    }
    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #94a3b8;
    }
    .slider-group input[type="range"] {
      width: 82px;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .hidden { display: none !important; }

    @media (max-width: 720px) {
      .telemetry-card { display: none; }
      header h1 { font-size: 0.85rem; }
      .control-dock { bottom: 10px; padding: 8px 10px; gap: 6px; }
      .dock-sep { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <a href="index.html" class="home-link">← marsko</a>
    <button type="button" class="sound-btn active" id="btnSound">♪ SPACE AUDIO: ON</button>
  </div>
  <h1 id="hudTitle">LUNAR EARTHRISE OBSERVATORY</h1>
  <div class="hud-meta" id="hudSub">SELENOGRAPHIC HORIZON · ORTHOGRAPHIC GLOBE</div>
</header>

<div class="telemetry-card" id="telemetryCard"></div>

<canvas id="obsCanvas"></canvas>

<div class="control-dock">
  <!-- 최상위 천체 전환 -->
  <div class="dock-row">
    <button type="button" class="dock-btn active" data-body="earth">달 (지구돋이)</button>
    <button type="button" class="dock-btn" data-body="saturn">토성 (엔셀라두스)</button>
    <button type="button" class="dock-btn" data-body="jupiter">목성 (유로파)</button>
    <button type="button" class="dock-btn" data-body="mars">화성 (포보스)</button>
    <div class="dock-sep"></div>
    <button type="button" class="dock-btn active" id="btnSpin">자전 재생</button>
  </div>

  <!-- 달(Earthrise) 전용 컨트롤 -->
  <div class="dock-row" id="earthControls">
    <button type="button" class="dock-btn active" data-preset="limb">지구돋이 능선 (82°E)</button>
    <button type="button" class="dock-btn" data-preset="apollo">고요의 바다 (아폴로 11)</button>
    <button type="button" class="dock-btn" data-preset="shackleton">남극 섀클턴 (89°S)</button>
    <button type="button" class="dock-btn" data-preset="eclipse">개기월식 (붉은 반지)</button>
    <div class="dock-sep"></div>
    <div class="slider-group">
      <span>월면 경도</span>
      <input type="range" id="lonRange" min="-95" max="95" value="82">
    </div>
    <div class="slider-group">
      <span>월면 위도</span>
      <input type="range" id="latRange" min="-90" max="90" value="12">
    </div>
    <div class="slider-group">
      <span>지구 위상</span>
      <input type="range" id="earthPhaseRange" min="0" max="360" value="65">
    </div>
  </div>

  <!-- 외계 위성(Exomoon) 전용 컨트롤 -->
  <div class="dock-row hidden" id="exoControls">
    <div class="slider-group">
      <span>관측 위도(기울기)</span>
      <input type="range" id="tiltRange" min="-35" max="35" value="18">
    </div>
    <div class="slider-group">
      <span>태양 위상</span>
      <input type="range" id="exoPhaseRange" min="15" max="165" value="55">
    </div>
    <div class="slider-group">
      <span>고도</span>
      <input type="range" id="altRange" min="-10" max="60" value="22">
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('obsCanvas');
  const ctx = canvas.getContext('2d');

  const hudTitle = document.getElementById('hudTitle');
  const hudSub = document.getElementById('hudSub');
  const telemetryCard = document.getElementById('telemetryCard');
  const earthControls = document.getElementById('earthControls');
  const exoControls = document.getElementById('exoControls');

  const lonRange = document.getElementById('lonRange');
  const latRange = document.getElementById('latRange');
  const earthPhaseRange = document.getElementById('earthPhaseRange');
  const tiltRange = document.getElementById('tiltRange');
  const exoPhaseRange = document.getElementById('exoPhaseRange');
  const altRange = document.getElementById('altRange');

  const btnSpin = document.getElementById('btnSpin');
  const btnSound = document.getElementById('btnSound');

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  // 현재 관측 대상: 'earth' | 'saturn' | 'jupiter' | 'mars'
  let currentBody = 'earth';
  let isSpinning = true;
  let timeTick = 0;

  // Earthrise 상태
  let lunarLat = 12;
  let lunarLon = 82;
  let earthSunPhaseDeg = 65;
  let earthRotLon = -135;
  let earthSiteName = 'EARTHRISE LIMB';

  // Exomoon 상태
  let viewTiltDeg = 18;
  let exoSunPhaseDeg = 55;
  let altitudeDeg = 22;
  let exoRotAngle = 0;

  // 배경 & 지형 데이터
  let stars = [];
  let plumeParticles = [];
  let lunarRidges = [];
  let exoRidges = [];

  function initStars() {
    stars = [];
    for (let i = 0; i < 180; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height * 0.85,
        r: Math.random() * 1.3 + 0.3,
        alpha: Math.random() * 0.7 + 0.15
      });
    }
  }

  function initPlumes() {
    plumeParticles = [];
    for (let i = 0; i < 85; i++) {
      plumeParticles.push({
        x: width * (0.2 + Math.random() * 0.6),
        y: height * 0.75 + Math.random() * 60,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -(Math.random() * 1.6 + 0.6),
        size: Math.random() * 2.2 + 0.8,
        life: Math.random()
      });
    }
  }

  function initTerrains() {
    lunarRidges = [];
    for (let l = 0; l < 4; l++) {
      const pts = [];
      for (let i = 0; i <= 48; i++) {
        const u = i / 48;
        pts.push({ u, hNoise: Math.sin(u * 12 + l * 2.1) * 14 + Math.cos(u * 27 - l) * 6 });
      }
      lunarRidges.push(pts);
    }

    exoRidges = [];
    for (let l = 0; l < 4; l++) {
      const pts = [];
      for (let i = 0; i <= 54; i++) {
        const u = i / 54;
        pts.push({ u, jagged: Math.sin(u * 15 + l * 1.9) * 16 + Math.cos(u * 33 - l * 1.3) * 8 });
      }
      exoRidges.push(pts);
    }
  }

  // ===== Space Ambient Web Audio Engine =====
  let audioCtx = null;
  let audioMaster = null;
  let audioNodes = [];
  let pingTimer = null;
  let soundOn = true;

  const BODY_ROOT_HZ = {
    earth: 55.0,    // A1 - warm Earthrise
    saturn: 65.41,  // C2 - icy ring shimmer
    jupiter: 49.0,  // G1 - deep magnetosphere
    mars: 61.74     // B1 - austere desert red
  };

  function createCosmicNoise(ctx) {
    const len = ctx.sampleRate * 4;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const ch = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      ch[i] = last * 1.8;
    }
    return buf;
  }

  function buildSpaceAudio() {
    if (!audioCtx) return;
    audioNodes.forEach(n => { try { n.stop(); } catch (_) {} });
    audioNodes = [];

    const root = BODY_ROOT_HZ[currentBody] || 55.0;

    // 1. Breathing Low-Pass Filter for cosmic drone
    const droneLP = audioCtx.createBiquadFilter();
    droneLP.type = 'lowpass';
    droneLP.frequency.value = 260;
    droneLP.Q.value = 1.4;
    droneLP.connect(audioMaster);

    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.07; // ~14s slow breathing cycle
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 110;
    lfo.connect(lfoGain);
    lfoGain.connect(droneLP.frequency);
    lfo.start();
    audioNodes.push(lfo);

    // Sub-bass + Fifth + Octave + Ninth shimmer
    const partials = [
      { mult: 1,   type: 'sine',     gain: 0.24, pan: 0 },
      { mult: 1.5, type: 'triangle', gain: 0.11, pan: -0.35 },
      { mult: 2,   type: 'sine',     gain: 0.09, pan: 0.35 },
      { mult: 3,   type: 'sine',     gain: 0.045, pan: -0.55 },
      { mult: 4.5, type: 'sine',     gain: 0.025, pan: 0.55 }
    ];

    partials.forEach((p, idx) => {
      const osc = audioCtx.createOscillator();
      osc.type = p.type;
      osc.frequency.value = root * p.mult + (idx % 2 === 0 ? 0.15 : -0.15);
      const g = audioCtx.createGain();
      g.gain.value = p.gain;
      const panner = audioCtx.createStereoPanner();
      panner.pan.value = p.pan;
      osc.connect(g);
      g.connect(panner);
      panner.connect(droneLP);
      osc.start();
      audioNodes.push(osc);
    });

    // 2. Solar Wind / Vacuum Hiss
    const windSrc = audioCtx.createBufferSource();
    windSrc.buffer = createCosmicNoise(audioCtx);
    windSrc.loop = true;
    const windBP = audioCtx.createBiquadFilter();
    windBP.type = 'bandpass';
    windBP.frequency.value = currentBody === 'saturn' ? 680 : 420;
    windBP.Q.value = 0.9;
    const windGain = audioCtx.createGain();
    windGain.gain.value = 0.16;
    windSrc.connect(windBP);
    windBP.connect(windGain);
    windGain.connect(audioMaster);
    windSrc.start();
    audioNodes.push(windSrc);
  }

  function playSpacePing() {
    if (!audioCtx || !soundOn) return;
    const now = audioCtx.currentTime;
    const root = BODY_ROOT_HZ[currentBody] || 55;
    const mults = [6, 8, 9, 12];
    const freq = root * mults[Math.floor(Math.random() * mults.length)];
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    const env = audioCtx.createGain();
    env.gain.setValueAtTime(0.0001, now);
    env.gain.exponentialRampToValueAtTime(0.045, now + 0.06);
    env.gain.exponentialRampToValueAtTime(0.0001, now + 3.4);
    const pan = audioCtx.createStereoPanner();
    pan.pan.value = (Math.random() - 0.5) * 1.2;
    osc.connect(env);
    env.connect(pan);
    pan.connect(audioMaster);
    osc.start(now);
    osc.stop(now + 3.5);
  }

  function scheduleSpacePing() {
    if (pingTimer) clearTimeout(pingTimer);
    pingTimer = setTimeout(() => {
      playSpacePing();
      scheduleSpacePing();
    }, 6500 + Math.random() * 8500);
  }

  function initSpaceAudio() {
    if (!audioCtx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioCtx();
      audioMaster = audioCtx.createGain();
      audioMaster.gain.value = 0;
      audioMaster.connect(audioCtx.destination);
      buildSpaceAudio();
      scheduleSpacePing();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function unlockSpaceAudio() {
    if (!soundOn) return;
    initSpaceAudio();
    audioMaster.gain.setTargetAtTime(0.65, audioCtx.currentTime, 0.25);
  }

  function toggleSpaceSound() {
    soundOn = !soundOn;
    if (soundOn) {
      initSpaceAudio();
      audioMaster.gain.setTargetAtTime(0.65, audioCtx.currentTime, 0.25);
    } else if (audioCtx && audioMaster) {
      audioMaster.gain.setTargetAtTime(0, audioCtx.currentTime, 0.25);
    }
    btnSound.classList.toggle('active', soundOn);
    btnSound.textContent = soundOn ? '♪ SPACE AUDIO: ON' : '♪ SPACE AUDIO: OFF';
  }

  btnSound.addEventListener('click', toggleSpaceSound);
  window.addEventListener('pointerdown', (e) => {
    if (e.target && e.target.closest && e.target.closest('#btnSound')) return;
    unlockSpaceAudio();
  });
  window.addEventListener('keydown', unlockSpaceAudio);

  // ===== Earthrise Data & Helpers =====
  const CONTINENTS = [
    [[36,-9],[43,-9],[48,-4],[54,8],[60,5],[70,28],[72,70],[70,130],[65,170],[55,160],[50,140],[38,120],[22,114],[9,105],[22,88],[8,77],[25,67],[13,45],[30,32],[38,24],[45,12],[36,-9]],
    [[31,130],[34,131],[35,136],[35.6,140],[39,142],[41,141],[44,145],[43,140],[37,137],[34,132],[31,130]],
    [[34.5,126],[38,126],[42,130],[38,129],[35,129],[34.5,126]],
    [[35,-6],[37,10],[32,32],[12,51],[-2,41],[-25,35],[-34,18],[-18,12],[5,9],[5,-8],[15,-17],[35,-6]],
    [[70,-160],[72,-120],[60,-64],[45,-60],[25,-80],[19,-96],[8,-78],[16,-100],[32,-117],[48,-124],[60,-140],[70,-160]],
    [[10,-75],[5,-52],[-6,-35],[-23,-43],[-54,-68],[-40,-73],[-18,-71],[-5,-81],[10,-75]],
    [[-12,131],[-12,142],[-28,153],[-38,145],[-34,115],[-22,114],[-12,131]]
  ];

  const CITIES = [
    { lat: 35.68, lon: 139.76, size: 2.6, name: 'TOKYO', highlight: true },
    { lat: 37.56, lon: 126.97, size: 2.2, name: 'SEOUL', highlight: true },
    { lat: 35.87, lon: 128.60, size: 1.8, name: 'DAEGU', highlight: true },
    { lat: 31.23, lon: 121.47, size: 2.0 },
    { lat: 39.90, lon: 116.40, size: 1.9 },
    { lat: 22.31, lon: 114.16, size: 1.8 },
    { lat: 1.35,  lon: 103.81, size: 1.7 },
    { lat: 28.61, lon: 77.20,  size: 1.9 },
    { lat: 51.50, lon: -0.12,  size: 2.0 },
    { lat: 48.85, lon: 2.35,   size: 1.9 },
    { lat: 55.75, lon: 37.61,  size: 1.8 },
    { lat: 30.04, lon: 31.23,  size: 1.8 },
    { lat: 40.71, lon: -74.00, size: 2.2 },
    { lat: 34.05, lon: -118.24,size: 2.0 },
    { lat: -23.55,lon: -46.63, size: 1.8 },
    { lat: -33.86,lon: 151.20, size: 1.7 }
  ];

  function latLonTo3D(latDeg, lonDeg, centerLatDeg, centerLonDeg) {
    const phi = (latDeg * Math.PI) / 180;
    const lam = ((lonDeg - centerLonDeg) * Math.PI) / 180;
    const phi0 = (centerLatDeg * Math.PI) / 180;
    return {
      x: Math.cos(phi) * Math.sin(lam),
      y: Math.cos(phi0) * Math.sin(phi) - Math.sin(phi0) * Math.cos(phi) * Math.cos(lam),
      z: Math.sin(phi0) * Math.sin(phi) + Math.cos(phi0) * Math.cos(phi) * Math.cos(lam)
    };
  }

  function applyEarthPreset(name) {
    earthControls.querySelectorAll('[data-preset]').forEach(b => {
      b.classList.toggle('active', b.dataset.preset === name);
    });
    if (name === 'limb') {
      lunarLat = 12; lunarLon = 82; earthSunPhaseDeg = 65; earthSiteName = 'EARTHRISE LIMB';
    } else if (name === 'apollo') {
      lunarLat = 0.67; lunarLon = 23.47; earthSunPhaseDeg = 45; earthSiteName = 'MARE TRANQUILLITATIS';
    } else if (name === 'shackleton') {
      lunarLat = -88.5; lunarLon = 0; earthSunPhaseDeg = 95; earthSiteName = 'SHACKLETON SOUTH POLE';
    } else if (name === 'eclipse') {
      lunarLat = 10; lunarLon = 76; earthSunPhaseDeg = 180; earthSiteName = 'TOTAL LUNAR ECLIPSE';
    }
    lonRange.value = Math.round(lunarLon);
    latRange.value = Math.round(lunarLat);
    earthPhaseRange.value = Math.round(earthSunPhaseDeg);
  }

  function setBody(body) {
    currentBody = body;
    document.querySelectorAll('[data-body]').forEach(b => {
      b.classList.toggle('active', b.dataset.body === body);
    });

    if (body === 'earth') {
      earthControls.classList.remove('hidden');
      exoControls.classList.add('hidden');
      hudTitle.textContent = 'LUNAR EARTHRISE OBSERVATORY';
      hudSub.textContent = 'SELENOGRAPHIC HORIZON · ORTHOGRAPHIC GLOBE';
    } else {
      earthControls.classList.add('hidden');
      exoControls.classList.remove('hidden');
      hudTitle.textContent = 'EXOMOON HORIZON OBSERVATORY';
      hudSub.textContent = 'TIDAL LOCK SKY · PLANETARY RING & TRANSIT';

      if (body === 'saturn') {
        viewTiltDeg = 18; exoSunPhaseDeg = 55; altitudeDeg = 24;
      } else if (body === 'jupiter') {
        viewTiltDeg = 6; exoSunPhaseDeg = 48; altitudeDeg = 20;
      } else if (body === 'mars') {
        viewTiltDeg = -10; exoSunPhaseDeg = 65; altitudeDeg = 14;
      }
      tiltRange.value = viewTiltDeg;
      exoPhaseRange.value = exoSunPhaseDeg;
      altRange.value = altitudeDeg;
    }

    if (audioCtx) buildSpaceAudio();
  }

  // ===== Render Earthrise =====
  function renderEarth() {
    if (isSpinning) earthRotLon = (earthRotLon + 0.18) % 360;

    const librationLon = Math.sin(timeTick * 0.5) * 3.2;
    const librationLat = Math.cos(timeTick * 0.35) * 2.1;
    const effLatRad = ((lunarLat + librationLat) * Math.PI) / 180;
    const effLonRad = ((lunarLon + librationLon) * Math.PI) / 180;

    const cosZ = Math.cos(effLatRad) * Math.cos(effLonRad);
    const altDeg = (Math.asin(Math.max(-1, Math.min(1, cosZ))) * 180) / Math.PI;
    const horizonBaseY = height * 0.74;
    const degToPx = (height * 0.52) / 90;

    const earthCenterX = width * 0.5 + Math.sin(effLonRad) * (width * 0.12);
    const earthCenterY = horizonBaseY - altDeg * degToPx;
    const earthRadius = Math.min(width, height) * 0.21;

    const sunRad = (earthSunPhaseDeg * Math.PI) / 180;
    const sunVec = { x: Math.sin(sunRad), y: 0.12, z: Math.cos(sunRad) };
    const sLen = Math.hypot(sunVec.x, sunVec.y, sunVec.z);
    sunVec.x /= sLen; sunVec.y /= sLen; sunVec.z /= sLen;
    const isEclipse = Math.abs(earthSunPhaseDeg - 180) < 16;

    ctx.fillStyle = '#f8fafc';
    stars.forEach(s => {
      if (s.y < horizonBaseY + 20) {
        ctx.globalAlpha = s.alpha;
        ctx.fillRect(s.x, s.y, s.r, s.r);
      }
    });
    ctx.globalAlpha = 1.0;

    ctx.save();
    const glowRadius = earthRadius * (isEclipse ? 1.25 : 1.15);
    const atmoGrad = ctx.createRadialGradient(earthCenterX, earthCenterY, earthRadius * 0.92, earthCenterX, earthCenterY, glowRadius);
    if (isEclipse) {
      atmoGrad.addColorStop(0, '#f43f5e');
      atmoGrad.addColorStop(0.35, 'rgba(244, 63, 94, 0.65)');
      atmoGrad.addColorStop(1, 'transparent');
    } else {
      atmoGrad.addColorStop(0, '#38bdf8');
      atmoGrad.addColorStop(0.4, 'rgba(56, 189, 248, 0.35)');
      atmoGrad.addColorStop(1, 'transparent');
    }
    ctx.fillStyle = atmoGrad;
    ctx.beginPath();
    ctx.arc(earthCenterX, earthCenterY, glowRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(earthCenterX, earthCenterY, earthRadius, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = '#041022';
    ctx.fillRect(earthCenterX - earthRadius, earthCenterY - earthRadius, earthRadius * 2, earthRadius * 2);

    ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
    ctx.lineWidth = 0.8;
    const viewCenterLat = -lunarLat * 0.3;

    for (let lon = -180; lon < 180; lon += 30) {
      ctx.beginPath();
      let started = false;
      for (let lat = -80; lat <= 80; lat += 8) {
        const p = latLonTo3D(lat, lon, viewCenterLat, earthRotLon);
        if (p.z > 0) {
          const sx = earthCenterX + p.x * earthRadius;
          const sy = earthCenterY - p.y * earthRadius;
          if (!started) { ctx.moveTo(sx, sy); started = true; } else ctx.lineTo(sx, sy);
        } else started = false;
      }
      ctx.stroke();
    }

    for (let lat = -60; lat <= 60; lat += 30) {
      ctx.beginPath();
      let started = false;
      for (let lon = -180; lon <= 180; lon += 8) {
        const p = latLonTo3D(lat, lon, viewCenterLat, earthRotLon);
        if (p.z > 0) {
          const sx = earthCenterX + p.x * earthRadius;
          const sy = earthCenterY - p.y * earthRadius;
          if (!started) { ctx.moveTo(sx, sy); started = true; } else ctx.lineTo(sx, sy);
        } else started = false;
      }
      ctx.stroke();
    }

    CONTINENTS.forEach(poly => {
      ctx.beginPath();
      let validPts = 0;
      poly.forEach(([lat, lon]) => {
        const p = latLonTo3D(lat, lon, viewCenterLat, earthRotLon);
        if (p.z > -0.15) {
          const normLen = Math.hypot(p.x, p.y) || 1;
          const px = p.z > 0 ? p.x : (p.x / normLen);
          const py = p.z > 0 ? p.y : (p.y / normLen);
          const sx = earthCenterX + px * earthRadius;
          const sy = earthCenterY - py * earthRadius;
          if (validPts === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          validPts++;
        }
      });
      if (validPts > 2) {
        ctx.closePath();
        ctx.fillStyle = 'rgba(14, 116, 144, 0.48)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
        ctx.lineWidth = 1.1;
        ctx.stroke();
      }
    });

    const lightX = earthCenterX + sunVec.x * earthRadius * 0.85;
    const lightY = earthCenterY - sunVec.y * earthRadius * 0.85;
    if (earthSunPhaseDeg < 165 || earthSunPhaseDeg > 195) {
      const dayGrad = ctx.createRadialGradient(lightX, lightY, earthRadius * 0.05, lightX, lightY, earthRadius * 1.45);
      dayGrad.addColorStop(0, 'rgba(186, 230, 253, 0.42)');
      dayGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.15)');
      dayGrad.addColorStop(1, 'rgba(2, 3, 6, 0.92)');
      ctx.fillStyle = dayGrad;
      ctx.fillRect(earthCenterX - earthRadius, earthCenterY - earthRadius, earthRadius * 2, earthRadius * 2);
    }

    const darkX = earthCenterX - sunVec.x * earthRadius * 1.1;
    const darkY = earthCenterY + sunVec.y * earthRadius * 1.1;
    const nightRadius = earthRadius * (1.25 + (1 - sunVec.z) * 0.55);
    const nightGrad = ctx.createRadialGradient(darkX, darkY, earthRadius * 0.2, darkX, darkY, nightRadius);
    nightGrad.addColorStop(0, 'rgba(2, 3, 6, 0.96)');
    nightGrad.addColorStop(0.65, 'rgba(2, 3, 6, 0.82)');
    nightGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = nightGrad;
    ctx.fillRect(earthCenterX - earthRadius, earthCenterY - earthRadius, earthRadius * 2, earthRadius * 2);

    CITIES.forEach(city => {
      const p = latLonTo3D(city.lat, city.lon, viewCenterLat, earthRotLon);
      if (p.z > 0.08) {
        const sunDot = p.x * sunVec.x + p.y * sunVec.y + p.z * sunVec.z;
        if (sunDot < 0.12) {
          const sx = earthCenterX + p.x * earthRadius;
          const sy = earthCenterY - p.y * earthRadius;
          const nightIntensity = Math.min(1.0, (0.12 - sunDot) * 3.0);
          ctx.fillStyle = city.highlight ? `rgba(251, 191, 36, ${nightIntensity})` : `rgba(254, 240, 138, ${nightIntensity * 0.75})`;
          ctx.beginPath();
          ctx.arc(sx, sy, city.size, 0, Math.PI * 2);
          ctx.fill();
          if (city.highlight && city.name === 'TOKYO' && nightIntensity > 0.4) {
            ctx.font = '600 9px "IBM Plex Mono", monospace';
            ctx.fillStyle = `rgba(251, 191, 36, ${nightIntensity * 0.9})`;
            ctx.fillText('TOKYO', sx + 5, sy + 3);
          }
        }
      }
    });

    ctx.strokeStyle = isEclipse ? 'rgba(244, 63, 94, 0.85)' : 'rgba(125, 211, 252, 0.55)';
    ctx.lineWidth = isEclipse ? 2.5 : 1.5;
    ctx.beginPath();
    ctx.arc(earthCenterX, earthCenterY, earthRadius - 0.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    lunarRidges.forEach((pts, idx) => {
      const layerY = horizonBaseY + idx * 24;
      ctx.fillStyle = idx === 0 ? '#070a12' : (idx === 1 ? '#05070e' : '#030408');
      ctx.strokeStyle = idx === 0 ? '#475569' : 'rgba(71, 85, 105, 0.45)';
      ctx.lineWidth = idx === 0 ? 1.6 : 1.0;
      ctx.beginPath();
      ctx.moveTo(0, height);
      pts.forEach(pt => ctx.lineTo(pt.u * width, layerY + pt.hNoise));
      ctx.lineTo(width, height);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    });

    const latStr = `${Math.abs(lunarLat).toFixed(1)}°${lunarLat >= 0 ? 'N' : 'S'}`;
    const lonStr = `${Math.abs(lunarLon).toFixed(1)}°${lunarLon >= 0 ? 'E' : 'W'}`;
    const illumPct = Math.round(((1 + Math.cos(sunRad)) / 2) * 100);
    const phaseLabel = isEclipse
      ? `<strong class="eclipse">SOLAR ECLIPSE RING (${illumPct}%)</strong>`
      : `<strong>${illumPct > 85 ? 'FULL EARTH' : (illumPct < 15 ? 'NEW EARTH' : (illumPct > 50 ? 'GIBBOUS' : 'CRESCENT'))} (${illumPct}%)</strong>`;

    telemetryCard.innerHTML = `
      <div>SITE: <strong>${earthSiteName}</strong></div>
      <div>LUNAR COORD: <strong>${latStr}, ${lonStr}</strong></div>
      <div>EARTH ALTITUDE: <strong class="${altDeg < 0 ? 'eclipse' : ''}">${altDeg >= 0 ? '+' : ''}${altDeg.toFixed(1)}°</strong></div>
      <div>EARTH PHASE: ${phaseLabel}</div>
      <div>LIBRATION: <strong>ACTIVE</strong></div>
    `;
  }

  // ===== Render Exomoon =====
  function drawSaturnRings(cx, cy, pRadius, tiltRad, isFrontHalf) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.14);
    const yScale = Math.max(0.03, Math.abs(Math.sin(tiltRad)));
    const flip = tiltRad >= 0 ? 1 : -1;

    ctx.beginPath();
    if (isFrontHalf) {
      if (flip > 0) ctx.rect(-pRadius * 3, 0, pRadius * 6, pRadius * 3);
      else ctx.rect(-pRadius * 3, -pRadius * 3, pRadius * 6, pRadius * 3);
    } else {
      if (flip > 0) ctx.rect(-pRadius * 3, -pRadius * 3, pRadius * 6, pRadius * 3);
      else ctx.rect(-pRadius * 3, 0, pRadius * 6, pRadius * 3);
    }
    ctx.clip();
    ctx.scale(1, yScale);

    const ringBands = [
      { rIn: 1.25, rOut: 1.48, color: 'rgba(148, 163, 184, 0.22)', step: 3.5 },
      { rIn: 1.48, rOut: 1.92, color: 'rgba(253, 230, 138, 0.62)', step: 2.2 },
      { rIn: 1.92, rOut: 2.00, color: 'rgba(2, 3, 6, 0.90)',       step: 4.0 },
      { rIn: 2.00, rOut: 2.32, color: 'rgba(56, 189, 248, 0.45)',  step: 2.5 },
      { rIn: 2.36, rOut: 2.38, color: 'rgba(248, 250, 252, 0.70)', step: 1.5 }
    ];
    ringBands.forEach(band => {
      ctx.strokeStyle = band.color;
      ctx.lineWidth = 1.6 / yScale;
      for (let r = pRadius * band.rIn; r <= pRadius * band.rOut; r += band.step) {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
      }
    });

    if (!isFrontHalf) {
      const sunRad = (exoSunPhaseDeg * Math.PI) / 180;
      ctx.fillStyle = 'rgba(2, 3, 6, 0.85)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, pRadius * 2.45, -Math.PI * 0.5 - sunRad * 0.5, -Math.PI * 0.5 + 0.35);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawExoPlanetBody(cx, cy, pRadius, tiltRad) {
    ctx.save();
    const glowColor = currentBody === 'saturn' ? 'rgba(251, 191, 36, 0.3)' :
                      currentBody === 'jupiter' ? 'rgba(56, 189, 248, 0.32)' :
                      'rgba(244, 63, 94, 0.38)';
    const atmoGrad = ctx.createRadialGradient(cx, cy, pRadius * 0.92, cx, cy, pRadius * 1.12);
    atmoGrad.addColorStop(0, glowColor);
    atmoGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = atmoGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, pRadius * 1.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, pRadius, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = currentBody === 'mars' ? '#1c080b' : '#060c18';
    ctx.fillRect(cx - pRadius, cy - pRadius, pRadius * 2, pRadius * 2);
    ctx.translate(cx, cy);
    ctx.rotate(-0.14);

    if (currentBody === 'saturn') {
      [
        { y: -0.85, h: 0.25, col: 'rgba(56, 189, 248, 0.28)' },
        { y: -0.60, h: 0.30, col: 'rgba(251, 191, 36, 0.35)' },
        { y: -0.30, h: 0.25, col: 'rgba(253, 230, 138, 0.45)' },
        { y: -0.05, h: 0.20, col: 'rgba(245, 158, 11, 0.40)' },
        { y:  0.15, h: 0.35, col: 'rgba(251, 191, 36, 0.30)' },
        { y:  0.50, h: 0.50, col: 'rgba(14, 116, 144, 0.28)' }
      ].forEach(b => {
        ctx.fillStyle = b.col;
        ctx.fillRect(-pRadius, b.y * pRadius, pRadius * 2, b.h * pRadius);
      });
      ctx.strokeStyle = 'rgba(254, 240, 138, 0.22)';
      ctx.lineWidth = 1;
      for (let lat = -75; lat <= 75; lat += 15) {
        const yOff = Math.sin((lat * Math.PI) / 180) * pRadius;
        ctx.beginPath(); ctx.moveTo(-pRadius, yOff); ctx.lineTo(pRadius, yOff); ctx.stroke();
      }
      const shadowY = -Math.sin(tiltRad) * pRadius * 0.45;
      ctx.fillStyle = 'rgba(2, 3, 6, 0.78)';
      ctx.fillRect(-pRadius, shadowY - pRadius * 0.06, pRadius * 2, pRadius * 0.12);
    } else if (currentBody === 'jupiter') {
      [
        { y: -0.90, h: 0.22, col: 'rgba(30, 58, 138, 0.35)' },
        { y: -0.68, h: 0.18, col: 'rgba(226, 232, 240, 0.38)' },
        { y: -0.50, h: 0.16, col: 'rgba(234, 88, 12, 0.45)' },
        { y: -0.34, h: 0.20, col: 'rgba(248, 250, 252, 0.42)' },
        { y: -0.14, h: 0.24, col: 'rgba(249, 115, 22, 0.48)' },
        { y:  0.10, h: 0.18, col: 'rgba(241, 245, 249, 0.45)' },
        { y:  0.28, h: 0.22, col: 'rgba(225, 29, 72, 0.42)' },
        { y:  0.50, h: 0.50, col: 'rgba(56, 189, 248, 0.25)' }
      ].forEach(b => {
        ctx.fillStyle = b.col;
        ctx.fillRect(-pRadius, b.y * pRadius, pRadius * 2, b.h * pRadius);
      });
      ctx.strokeStyle = 'rgba(254, 215, 170, 0.35)';
      ctx.lineWidth = 1.2;
      for (let row = -3; row <= 3; row++) {
        const baseY = row * pRadius * 0.22;
        ctx.beginPath();
        for (let x = -pRadius; x <= pRadius; x += 8) {
          const wave = Math.sin((x * 0.04) + exoRotAngle * (row % 2 === 0 ? 2 : -1.5)) * 4;
          if (x === -pRadius) ctx.moveTo(x, baseY + wave); else ctx.lineTo(x, baseY + wave);
        }
        ctx.stroke();
      }
      const grsLon = (exoRotAngle * 1.4) % (Math.PI * 2);
      const grsX = Math.sin(grsLon) * pRadius * 0.85;
      const grsZ = Math.cos(grsLon);
      if (grsZ > 0) {
        const grsY = pRadius * 0.36;
        const grsW = pRadius * 0.18 * grsZ;
        const grsH = pRadius * 0.11;
        ctx.save();
        ctx.translate(grsX, grsY);
        const grsGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, grsW);
        grsGrad.addColorStop(0, '#f43f5e');
        grsGrad.addColorStop(0.6, '#e11d48');
        grsGrad.addColorStop(1, 'rgba(251, 191, 36, 0.2)');
        ctx.fillStyle = grsGrad;
        ctx.beginPath(); ctx.ellipse(0, 0, grsW, grsH, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fda4af'; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.restore();
      }
      const transitX = Math.sin(exoRotAngle * 0.9 + 0.5) * pRadius * 0.75;
      if (Math.cos(exoRotAngle * 0.9 + 0.5) > 0) {
        ctx.fillStyle = '#020306';
        ctx.beginPath(); ctx.arc(transitX, -pRadius * 0.08, pRadius * 0.055, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.5)'; ctx.lineWidth = 1; ctx.stroke();
      }
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5;
      ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.ellipse(0, -pRadius * 0.92, pRadius * 0.32, pRadius * 0.06, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (currentBody === 'mars') {
      const marsGrad = ctx.createRadialGradient(-pRadius * 0.2, -pRadius * 0.2, pRadius * 0.1, 0, 0, pRadius);
      marsGrad.addColorStop(0, 'rgba(244, 63, 94, 0.55)');
      marsGrad.addColorStop(0.6, 'rgba(185, 28, 28, 0.45)');
      marsGrad.addColorStop(1, 'rgba(69, 10, 10, 0.7)');
      ctx.fillStyle = marsGrad;
      ctx.fillRect(-pRadius, -pRadius, pRadius * 2, pRadius * 2);
      ctx.strokeStyle = 'rgba(251, 113, 133, 0.18)'; ctx.lineWidth = 1;
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath(); ctx.arc(0, 0, pRadius * (Math.abs(i) * 0.25), 0, Math.PI * 2); ctx.stroke();
      }
      const canyonX = Math.sin(exoRotAngle) * pRadius * 0.5;
      if (Math.cos(exoRotAngle) > -0.2) {
        ctx.strokeStyle = '#fecdd3'; ctx.lineWidth = 3.0;
        ctx.shadowColor = '#f43f5e'; ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(canyonX - pRadius * 0.35, pRadius * 0.08);
        ctx.lineTo(canyonX - pRadius * 0.10, pRadius * 0.14);
        ctx.lineTo(canyonX + pRadius * 0.22, pRadius * 0.11);
        ctx.lineTo(canyonX + pRadius * 0.38, pRadius * 0.16);
        ctx.stroke();
        ctx.shadowBlur = 0;

        const olyX = canyonX - pRadius * 0.42;
        const olyY = -pRadius * 0.24;
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(olyX, olyY, pRadius * 0.11, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(olyX, olyY, pRadius * 0.03, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(240, 249, 255, 0.75)';
      ctx.beginPath(); ctx.ellipse(0, -pRadius * 0.95, pRadius * 0.36, pRadius * 0.09, 0, 0, Math.PI * 2); ctx.fill();
    }

    const sunRad = (exoSunPhaseDeg * Math.PI) / 180;
    const shadowOffsetX = -Math.sin(sunRad) * pRadius * 1.15;
    const termGrad = ctx.createRadialGradient(shadowOffsetX, 0, pRadius * 0.25, shadowOffsetX, 0, pRadius * 1.55);
    termGrad.addColorStop(0, 'rgba(2, 3, 6, 0.96)');
    termGrad.addColorStop(0.6, 'rgba(2, 3, 6, 0.85)');
    termGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = termGrad;
    ctx.fillRect(-pRadius * 1.5, -pRadius * 1.5, pRadius * 3, pRadius * 3);

    ctx.strokeStyle = currentBody === 'mars' ? 'rgba(251, 113, 133, 0.65)' : 'rgba(186, 230, 253, 0.55)';
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 0, pRadius - 0.8, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function renderExomoon() {
    if (isSpinning) exoRotAngle += currentBody === 'jupiter' ? 0.012 : 0.006;
    const horizonY = height * 0.76;

    ctx.fillStyle = '#f8fafc';
    stars.forEach(s => {
      ctx.globalAlpha = s.alpha;
      ctx.fillRect(s.x, s.y, s.r, s.r);
    });
    ctx.globalAlpha = 1.0;

    const baseScale = currentBody === 'mars' ? 0.42 : (currentBody === 'saturn' ? 0.23 : 0.27);
    const pRadius = Math.min(width, height) * baseScale;
    const cx = width * 0.5;
    const cy = horizonY - (altitudeDeg / 60) * (height * 0.48);
    const tiltRad = (viewTiltDeg * Math.PI) / 180;

    if (currentBody === 'saturn') drawSaturnRings(cx, cy, pRadius, tiltRad, false);
    drawExoPlanetBody(cx, cy, pRadius, tiltRad);
    if (currentBody === 'saturn') drawSaturnRings(cx, cy, pRadius, tiltRad, true);

    if (currentBody === 'saturn') {
      plumeParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.008;
        if (p.life <= 0 || p.y < horizonY - 180) {
          p.x = width * (0.25 + Math.random() * 0.5);
          p.y = horizonY + 10;
          p.life = 1.0;
        }
        ctx.fillStyle = `rgba(186, 230, 253, ${p.life * 0.45})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      });
    }

    exoRidges.forEach((pts, idx) => {
      const layerY = horizonY + idx * 24;
      if (currentBody === 'saturn') {
        ctx.fillStyle = idx === 0 ? '#081426' : '#040a14';
        ctx.strokeStyle = idx === 0 ? '#38bdf8' : 'rgba(56, 189, 248, 0.35)';
      } else if (currentBody === 'jupiter') {
        ctx.fillStyle = idx === 0 ? '#0c101d' : '#060810';
        ctx.strokeStyle = idx === 0 ? '#f43f5e' : 'rgba(56, 189, 248, 0.4)';
      } else {
        ctx.fillStyle = idx === 0 ? '#110c10' : '#080508';
        ctx.strokeStyle = idx === 0 ? '#fb7185' : 'rgba(148, 163, 184, 0.3)';
      }
      ctx.lineWidth = idx === 0 ? 1.8 : 1.1;
      ctx.beginPath();
      ctx.moveTo(0, height);
      pts.forEach(pt => ctx.lineTo(pt.u * width, layerY + pt.jagged));
      ctx.lineTo(width, height);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    });

    const meta = {
      saturn:  { moon: 'ENCELADUS (SATURN)', dist: '238,000 km', size: '30.2x FULL MOON', cls: 'accent-amber', ph: 'CRYO-PLUME &amp; CASSINI RINGS' },
      jupiter: { moon: 'EUROPA (JUPITER)',   dist: '670,900 km', size: '24.0x FULL MOON', cls: 'accent-amber', ph: 'GREAT RED SPOT &amp; IO TRANSIT' },
      mars:    { moon: 'STICKNEY CRATER (PHOBOS)', dist: '5,980 km (ULTRA CLOSE)', size: '82.0x FULL MOON', cls: 'accent-rose', ph: 'VALLES MARINERIS &amp; OLYMPUS' }
    }[currentBody];

    telemetryCard.innerHTML = `
      <div>VANTAGE: <strong>${meta.moon}</strong></div>
      <div>DISTANCE: <strong>${meta.dist}</strong></div>
      <div>APPARENT SIZE: <strong class="${meta.cls}">${meta.size}</strong></div>
      <div>PHENOMENON: <strong>${meta.ph}</strong></div>
    `;
  }

  function render() {
    ctx.fillStyle = '#020306';
    ctx.fillRect(0, 0, width, height);
    timeTick += 0.015;
    if (currentBody === 'earth') renderEarth();
    else renderExomoon();
    requestAnimationFrame(render);
  }

  // ===== Drag Interaction =====
  let isDragging = false;
  let lastX = 0;
  let lastY = 0;
  let downX = 0;
  let downY = 0;

  canvas.addEventListener('pointerdown', (e) => {
    isDragging = true;
    lastX = downX = e.clientX;
    lastY = downY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    if (currentBody === 'earth') {
      earthRotLon = (earthRotLon - dx * 0.4) % 360;
    } else {
      exoRotAngle += dx * 0.008;
      viewTiltDeg = Math.max(-35, Math.min(35, viewTiltDeg + dy * 0.15));
      tiltRange.value = Math.round(viewTiltDeg);
    }
  });
  canvas.addEventListener('pointerup', (e) => {
    if (isDragging && Math.hypot(e.clientX - downX, e.clientY - downY) < 6) {
      playSpacePing();
    }
    isDragging = false;
  });
  canvas.addEventListener('pointercancel', () => { isDragging = false; });

  // ===== UI Events =====
  document.querySelectorAll('[data-body]').forEach(btn => {
    btn.addEventListener('click', () => setBody(btn.dataset.body));
  });

  earthControls.querySelectorAll('[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => applyEarthPreset(btn.dataset.preset));
  });

  lonRange.addEventListener('input', (e) => {
    earthControls.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('active'));
    lunarLon = parseFloat(e.target.value);
    earthSiteName = 'CUSTOM SELENOGRAPHIC';
  });
  latRange.addEventListener('input', (e) => {
    earthControls.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('active'));
    lunarLat = parseFloat(e.target.value);
    earthSiteName = 'CUSTOM SELENOGRAPHIC';
  });
  earthPhaseRange.addEventListener('input', (e) => {
    earthControls.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('active'));
    earthSunPhaseDeg = parseFloat(e.target.value);
  });

  tiltRange.addEventListener('input', (e) => { viewTiltDeg = parseFloat(e.target.value); });
  exoPhaseRange.addEventListener('input', (e) => { exoSunPhaseDeg = parseFloat(e.target.value); });
  altRange.addEventListener('input', (e) => { altitudeDeg = parseFloat(e.target.value); });

  btnSpin.addEventListener('click', () => {
    isSpinning = !isSpinning;
    btnSpin.classList.toggle('active', isSpinning);
  });

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initStars();
    initPlumes();
  });

  // 초기화 및 URL 파라미터 (?body=saturn 등) 지원
  initStars();
  initPlumes();
  initTerrains();
  applyEarthPreset('limb');

  const params = new URLSearchParams(window.location.search);
  const bodyParam = params.get('body');
  if (bodyParam && ['earth', 'saturn', 'jupiter', 'mars'].includes(bodyParam)) {
    setBody(bodyParam);
  } else {
    setBody('earth');
  }

  requestAnimationFrame(render);
})();
</script>

</body>
</html>
